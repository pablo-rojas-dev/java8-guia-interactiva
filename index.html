d\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eparseInt con texto no numérico\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIllegalArgumentException, IllegalStateException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eArgumento o estado inválido\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eUnsupportedOperationException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eOperación no permitida (lista de tamaño fijo)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    static void leer() {\n        throw new java.io.IOException(\u0026quot;sin archivo\u0026quot;);\n    }\n    public static void main(String[] args) { leer(); }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIOException es checked. \u003ccode\u003eleer\u003c/code\u003e debe declarar \u003ccode\u003ethrows java.io.IOException\u003c/code\u003e (y entonces quien la llame debe manejarla) o capturarla.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint[] datos = new int[3];\nString texto = null;\nObject o = \u0026quot;hola\u0026quot;;\ntry { System.out.println(datos[3]); } catch (ArrayIndexOutOfBoundsException e) { System.out.println(\u0026quot;índice \u0026quot; + e.getMessage()); }\ntry { System.out.println(texto.length()); } catch (NullPointerException e) { System.out.println(\u0026quot;NPE\u0026quot;); }\ntry { Integer n = (Integer) o; } catch (ClassCastException e) { System.out.println(\u0026quot;cast\u0026quot;); }\ntry { Integer.parseInt(\u0026quot;12a\u0026quot;); } catch (NumberFormatException e) { System.out.println(e.getMessage()); }\ntry { System.out.println(10 / 0); } catch (ArithmeticException e) { System.out.println(e.getMessage()); }\nSystem.out.println(10.0 / 0);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eíndice 3\nNPE\ncast\nFor input string: \u0026quot;12a\u0026quot;\n/ by zero\nInfinity\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLas unchecked más comunes del examen. Observa la última línea: con double no hay excepción.\u003c/p\u003e\n","number":"01"},{"title":"Flujo de try, catch y finally","html":"\u003cp\u003eCuando el bloque \u003ccode\u003etry\u003c/code\u003e lanza una excepción, Java salta al primer \u003ccode\u003ecatch\u003c/code\u003e compatible (en orden de escritura). Solo se ejecuta un catch. \u003ccode\u003efinally\u003c/code\u003e se ejecuta siempre al salir del try, haya excepción o no, y aunque haya un \u003ccode\u003ereturn\u003c/code\u003e (salvo que la JVM termine con \u003ccode\u003eSystem.exit\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003eSi \u003ccode\u003etry\u003c/code\u003e ejecuta \u003ccode\u003ereturn x\u003c/code\u003e, el valor se calcula antes de entrar a \u003ccode\u003efinally\u003c/code\u003e. Cambiar \u003ccode\u003ex\u003c/code\u003e en finally no cambia lo devuelto. Pero un \u003ccode\u003ereturn\u003c/code\u003e dentro de finally sí reemplaza el retorno anterior y descarta cualquier excepción pendiente.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    static String probar(int n) {\n        StringBuilder sb = new StringBuilder();\n        try {\n            sb.append(\u0026quot;T\u0026quot;);\n            if (n == 0) throw new IllegalArgumentException();\n            sb.append(\u0026quot;t\u0026quot;);\n        } catch (IllegalArgumentException e) {\n            sb.append(\u0026quot;C\u0026quot;);\n        } finally {\n            sb.append(\u0026quot;F\u0026quot;);\n        }\n        sb.append(\u0026quot;E\u0026quot;);\n        return sb.toString();\n    }\n    static int valor() {\n        int x = 1;\n        try { return x; } finally { x = 2; }\n    }\n    static int reemplazo() {\n        try { return 1; } finally { return 2; }\n    }\n    public static void main(String[] args) {\n        System.out.println(probar(1) + \u0026quot; \u0026quot; + probar(0));\n        System.out.println(valor() + \u0026quot; \u0026quot; + reemplazo());\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eTtFE TCFE\n1 2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSin excepción se salta el catch. Con excepción, la «t» no se agrega. \u003ccode\u003evalor()\u003c/code\u003e devuelve 1 porque el retorno se calculó antes del finally; \u003ccode\u003ereemplazo()\u003c/code\u003e devuelve 2 porque finally tiene su propio return.\u003c/p\u003e\n","number":"02"},{"title":"Orden de catch y multi-catch","html":"\u003cp\u003eUn catch de un tipo general antes de uno específico deja al segundo inalcanzable: no compila. Ordena de lo específico a lo general.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMulti-catch: \u003ccode\u003ecatch (IOException | SQLException e)\u003c/code\u003e. Los tipos no pueden ser subclase uno del otro, y \u003ccode\u003ee\u003c/code\u003e es final.\u003c/li\u003e\n\u003cli\u003eCapturar una checked que el try no puede lanzar no compila. Exception, Throwable y las unchecked sí se pueden capturar siempre.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    public static void main(String[] args) {\n        try {\n            new java.io.FileReader(\u0026quot;datos.txt\u0026quot;);\n        } catch (java.io.IOException e) {\n            System.out.println(\u0026quot;io\u0026quot;);\n        } catch (java.io.FileNotFoundException e) {\n            System.out.println(\u0026quot;no encontrado\u0026quot;);\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFileNotFoundException es subclase de IOException: el primer catch ya la cubre.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    public static void main(String[] args) {\n        try {\n            System.out.println(\u0026quot;sin E/S\u0026quot;);\n        } catch (java.io.IOException e) {\n            System.out.println(\u0026quot;io\u0026quot;);\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl try no puede lanzar IOException, que es checked: ese catch es imposible.\u003c/p\u003e\n","number":"03"},{"title":"throw, throws y excepciones propias","html":"\u003cp\u003e\u003ccode\u003ethrow\u003c/code\u003e lanza una excepción en un punto del código. \u003ccode\u003ethrows\u003c/code\u003e en la firma declara qué checked puede propagar el método. Una excepción propia checked extiende \u003ccode\u003eException\u003c/code\u003e; una unchecked extiende \u003ccode\u003eRuntimeException\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eAl sobrescribir, el método puede declarar menos excepciones checked o subclases de las originales, pero no nuevas ni más amplias. Las unchecked no tienen esta restricción.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass SaldoInsuficiente extends Exception {\n    SaldoInsuficiente(String mensaje) { super(mensaje); }\n}\npublic class Main {\n    static void retirar(int saldo, int monto) throws SaldoInsuficiente {\n        if (monto \u0026gt; saldo) throw new SaldoInsuficiente(\u0026quot;faltan \u0026quot; + (monto - saldo));\n        System.out.println(\u0026quot;retiro de \u0026quot; + monto);\n    }\n    public static void main(String[] args) {\n        try {\n            retirar(100, 30);\n            retirar(100, 150);\n            retirar(100, 10);\n        } catch (SaldoInsuficiente e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eretiro de 30\nfaltan 50\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl segundo retiro lanza la excepción y el control pasa al catch: el tercer retiro nunca se ejecuta.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Lector {\n    void leer() { }\n}\nclass LectorArchivo extends Lector {\n    void leer() throws java.io.IOException { }\n}\npublic class Main {\n    public static void main(String[] args) { }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa versión original no declara checked; la sobrescritura no puede agregar IOException. Sí podría declarar una RuntimeException.\u003c/p\u003e\n","number":"04"},{"title":"try-with-resources","html":"\u003cp\u003eLos recursos declarados en la cabecera de \u003ccode\u003etry (...)\u003c/code\u003e deben implementar \u003ccode\u003eAutoCloseable\u003c/code\u003e. Se cierran automáticamente al salir del bloque, en orden inverso a su declaración, y antes de ejecutar catch y finally.\u003c/p\u003e\n\u003cp\u003eSi el cuerpo lanza una excepción y \u003ccode\u003eclose()\u003c/code\u003e también, la del cuerpo es la principal y la de cierre queda como suprimida (\u003ccode\u003egetSuppressed()\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003eEn Java 8 el recurso debe declararse dentro de los paréntesis. Usar una variable ya existente (\u003ccode\u003etry (r)\u003c/code\u003e) es sintaxis de Java 9.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Recurso implements AutoCloseable {\n    private final String nombre;\n    Recurso(String nombre) { this.nombre = nombre; System.out.print(\u0026quot;abre \u0026quot; + nombre + \u0026quot;; \u0026quot;); }\n    public void close() { System.out.print(\u0026quot;cierra \u0026quot; + nombre + \u0026quot;; \u0026quot;); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        try (Recurso a = new Recurso(\u0026quot;A\u0026quot;); Recurso b = new Recurso(\u0026quot;B\u0026quot;)) {\n            System.out.print(\u0026quot;usa; \u0026quot;);\n            throw new IllegalStateException(\u0026quot;fallo\u0026quot;);\n        } catch (IllegalStateException e) {\n            System.out.print(\u0026quot;catch \u0026quot; + e.getMessage() + \u0026quot;; \u0026quot;);\n        } finally {\n            System.out.print(\u0026quot;finally\u0026quot;);\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eabre A; abre B; usa; cierra B; cierra A; catch fallo; finally\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLos recursos se cierran (B y después A) antes de que el catch maneje la excepción.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Falla implements AutoCloseable {\n    public void close() throws Exception { throw new Exception(\u0026quot;al cerrar\u0026quot;); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        try (Falla f = new Falla()) {\n            throw new RuntimeException(\u0026quot;en el cuerpo\u0026quot;);\n        } catch (Exception e) {\n            System.out.println(e.getMessage() + \u0026quot; | suprimida: \u0026quot; + e.getSuppressed()[0].getMessage());\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003een el cuerpo | suprimida: al cerrar\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa excepción del cuerpo llega al catch; la de close() viaja dentro de ella como suprimida.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Recurso implements AutoCloseable {\n    public void close() { }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Recurso r = new Recurso();\n        try (r) {\n            System.out.println(\u0026quot;uso\u0026quot;);\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEn Java 8 hay que escribir \u003ccode\u003etry (Recurso r2 = r)\u003c/code\u003e. La forma \u003ccode\u003etry (r)\u003c/code\u003e llegó en Java 9.\u003c/p\u003e\n","number":"05"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ethrow\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ethrows\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ethrow\u003c/code\u003e lanza una excepción; \u003ccode\u003ethrows\u003c/code\u003e la declara en la firma.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eChecked\u003c/td\u003e\n  \u003ctd\u003eUnchecked\u003c/td\u003e\n  \u003ctd\u003eChecked obliga a capturar o declarar; unchecked (RuntimeException, Error) no.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eExcepción principal\u003c/td\u003e\n  \u003ctd\u003eSuprimida\u003c/td\u003e\n  \u003ctd\u003eLa del cuerpo es la principal; la de \u003ccode\u003eclose()\u003c/code\u003e se adjunta como suprimida.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ereturn\u003c/code\u003e en try\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ereturn\u003c/code\u003e en finally\u003c/td\u003e\n  \u003ctd\u003eEl de finally reemplaza al de try y descarta excepciones pendientes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Alguna llamada lanza una checked que no se captura ni se declara?\u003c/li\u003e\n\u003cli\u003e¿Hay un catch inalcanzable por estar después de su superclase, o uno de una checked imposible?\u003c/li\u003e\n\u003cli\u003e¿Qué sentencias del try se ejecutan antes de la excepción y cuáles se saltan?\u003c/li\u003e\n\u003cli\u003e¿Qué hace finally? ¿Tiene return?\u003c/li\u003e\n\u003cli\u003eCon try-with-resources: ¿en qué orden se cierran y cuál excepción queda como principal?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["checked / unchecked","catch o throws obligatorios / no"],["throw / throws","Lanza / declara"],["finally","Se ejecuta normalmente incluso con return"],["try-with-resources","Cierra en orden inverso"],["getSuppressed()","Excepciones secundarias de close"]]},{"title":"SQL y lógica","id":"sql-y-logica","group":"Complementario","scope":"Complementario","icon":"database","intro":"Bloque complementario del temario original. Parte del primer apartado SQL se encontraba incompleta en el archivo de origen.","sections":[{"title":"Filtros, LIKE y ORDER BY","html":"\u003cp\u003eEn SQL, \u003ccode\u003eWHERE\u003c/code\u003e filtra filas antes de agrupar. \u003ccode\u003eLIKE\u003c/code\u003e permite patrones: \u003ccode\u003e%\u003c/code\u003e equivale a cero o más caracteres y \u003ccode\u003e_\u003c/code\u003e a uno. \u003ccode\u003eORDER BY 2, 1 DESC\u003c/code\u003e ordena primero por la segunda columna ascendente y, en empate, por la primera descendente.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-sql\"\u003eSELECT nombre, depto FROM empleado WHERE nombre LIKE '%a%' AND depto IS NOT NULL ORDER BY 2, 1 DESC;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEn SQL la comparación con \u003ccode\u003eNULL\u003c/code\u003e requiere \u003ccode\u003eIS NULL\u003c/code\u003e o \u003ccode\u003eIS NOT NULL\u003c/code\u003e; las expresiones con \u003ccode\u003e= NULL\u003c/code\u003e producen UNKNOWN.\u003c/p\u003e\n","number":"01"},{"title":"Funciones de agregación, GROUP BY y HAVING","html":"\u003cp\u003e\u003ccode\u003eCOUNT(*)\u003c/code\u003e cuenta filas. \u003ccode\u003eCOUNT(columna)\u003c/code\u003e, \u003ccode\u003eSUM\u003c/code\u003e, \u003ccode\u003eAVG\u003c/code\u003e, \u003ccode\u003eMIN\u003c/code\u003e y \u003ccode\u003eMAX\u003c/code\u003e ignoran los NULL.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eGROUP BY\u003c/code\u003e forma un grupo por cada valor distinto y produce una fila por grupo. En el SELECT solo pueden aparecer las columnas agrupadas y funciones de agregación.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eWHERE\u003c/code\u003e filtra filas antes de agrupar; \u003ccode\u003eHAVING\u003c/code\u003e filtra grupos después de agrupar y puede usar agregaciones.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT COUNT(*) AS filas, COUNT(depto) AS con_depto, SUM(salario) AS total, MAX(salario) AS maximo FROM empleado;\nSELECT depto, COUNT(*) AS personas, AVG(salario) AS promedio FROM empleado\nWHERE depto IS NOT NULL GROUP BY depto HAVING COUNT(*) \u0026gt; 1 ORDER BY depto;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFILAS\u003c/th\u003e\n  \u003cth\u003eCON_DEPTO\u003c/th\u003e\n  \u003cth\u003eTOTAL\u003c/th\u003e\n  \u003cth\u003eMAXIMO\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e5\u003c/td\u003e\n  \u003ctd\u003e4\u003c/td\u003e\n  \u003ctd\u003e5500\u003c/td\u003e\n  \u003ctd\u003e1500\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eDEPTO\u003c/th\u003e\n  \u003cth\u003ePERSONAS\u003c/th\u003e\n  \u003cth\u003ePROMEDIO\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eTI\u003c/td\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003e1300\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eVentas\u003c/td\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003e1050\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003ccode\u003eCOUNT(depto)\u003c/code\u003e da 4 porque Sara tiene depto NULL.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT nombre, COUNT(*) FROM empleado GROUP BY depto;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eError: La columna \u0026quot;NOMBRE\u0026quot; debe estar incluida en la lista de GROUP BY\u003c/p\u003e\n\u003cp\u003eCada grupo tiene varios nombres; la base de datos no sabe cuál mostrar. En Oracle el error es «ORA-00979: not a GROUP BY expression».\u003c/p\u003e\n","number":"02"},{"title":"JOIN","html":"\u003cp\u003e\u003ccode\u003eINNER JOIN\u003c/code\u003e devuelve solo las combinaciones que cumplen la condición \u003ccode\u003eON\u003c/code\u003e. \u003ccode\u003eLEFT JOIN\u003c/code\u003e conserva todas las filas de la tabla izquierda y rellena con NULL cuando no hay pareja.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT e.nombre, j.nombre AS jefe FROM empleado e INNER JOIN empleado j ON e.jefe_id = j.id ORDER BY e.id;\nSELECT e.nombre, j.nombre AS jefe FROM empleado e LEFT JOIN empleado j ON e.jefe_id = j.id ORDER BY e.id;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n  \u003cth\u003eJEFE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRaúl\u003c/td\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n  \u003cth\u003eJEFE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRaúl\u003c/td\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSara\u003c/td\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eLa tabla se une consigo misma. Con INNER solo aparecen quienes tienen jefe; con LEFT aparecen todos.\u003c/p\u003e\n","number":"03"},{"title":"Operaciones de conjuntos","html":"\u003cp\u003eCombinan el resultado de dos SELECT. Ambos deben devolver el mismo número de columnas con tipos compatibles; los nombres de columna salen de la primera consulta. ORDER BY va una sola vez, al final.\u003c/p\u003e\n\u003cp\u003eEjemplos con estas tablas:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTabla\u003c/th\u003e\n  \u003cth\u003eFilas (id, nombre)\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eclientes\u003c/td\u003e\n  \u003ctd\u003e(1, Ana), (2, Luis)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eclientes_nuevos\u003c/td\u003e\n  \u003ctd\u003e(2, Luis), (3, Eva)\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eUNION\u003c/code\u003e: filas de ambas consultas, sin duplicados.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eUNION ALL\u003c/code\u003e: filas de ambas, con duplicados. Es más rápido porque no compara.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eINTERSECT\u003c/code\u003e: filas que están en ambas.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eMINUS\u003c/code\u003e (Oracle) o \u003ccode\u003eEXCEPT\u003c/code\u003e (estándar): filas de la primera que no están en la segunda.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eDUAL\u003c/code\u003e es una tabla de Oracle con una sola fila; se usa para seleccionar valores sin tabla real.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT 1 AS n FROM DUAL UNION SELECT 1 FROM DUAL;\nSELECT 1 AS n FROM DUAL UNION ALL SELECT 1 FROM DUAL;\nSELECT 1 AS n FROM DUAL INTERSECT SELECT 2 FROM DUAL;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eN\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eN\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003cp\u003eUNION deja una fila, UNION ALL deja las dos, INTERSECT no encuentra filas comunes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT id, nombre FROM clientes UNION SELECT id, nombre FROM clientes_nuevos ORDER BY id;\nSELECT id, nombre FROM clientes INTERSECT SELECT id, nombre FROM clientes_nuevos;\nSELECT id, nombre FROM clientes_nuevos MINUS SELECT id, nombre FROM clientes;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eID\u003c/th\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eID\u003c/th\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eID\u003c/th\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eLuis está en ambas: aparece una vez en UNION y es la única fila de INTERSECT. MINUS deja solo a Eva.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT id, nombre FROM clientes UNION SELECT id FROM clientes_nuevos;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eError: La cantidad de columnas no coincide\u003c/p\u003e\n\u003cp\u003eLa primera consulta tiene dos columnas y la segunda una. En Oracle el error es «ORA-01789: query block has incorrect number of result columns».\u003c/p\u003e\n","number":"04"},{"title":"INSERT, UPDATE y DELETE","html":"\u003cp\u003e\u003ccode\u003eSELECT\u003c/code\u003e solo lee. \u003ccode\u003eINSERT\u003c/code\u003e, \u003ccode\u003eUPDATE\u003c/code\u003e y \u003ccode\u003eDELETE\u003c/code\u003e modifican la tabla. \u003ccode\u003eINSERT INTO destino SELECT …\u003c/code\u003e inserta el resultado de una consulta, incluida una con UNION.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eUPDATE\u003c/code\u003e y \u003ccode\u003eDELETE\u003c/code\u003e sin WHERE son válidos y afectan a todas las filas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eCREATE TABLE ventas_enero (prod VARCHAR(5), cant INT);\nCREATE TABLE ventas_febrero (prod VARCHAR(5), cant INT);\nCREATE TABLE ventas_totales (prod VARCHAR(5), cant INT);\nINSERT INTO ventas_enero VALUES ('A', 1);\nINSERT INTO ventas_enero VALUES ('B', 2);\nINSERT INTO ventas_febrero VALUES ('B', 2);\nINSERT INTO ventas_febrero VALUES ('C', 3);\nINSERT INTO ventas_totales SELECT prod, cant FROM ventas_enero UNION SELECT prod, cant FROM ventas_febrero;\nSELECT prod, cant FROM ventas_totales ORDER BY prod;\nUPDATE ventas_totales SET cant = cant * 10;\nSELECT SUM(cant) AS suma FROM ventas_totales;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003ePROD\u003c/th\u003e\n  \u003cth\u003eCANT\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eA\u003c/td\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eB\u003c/td\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eC\u003c/td\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eSUMA\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e60\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eCon UNION, la fila (B, 2) entra una sola vez. Con UNION ALL entraría dos veces. El UPDATE sin WHERE modifica las tres filas.\u003c/p\u003e\n","number":"05"},{"title":"TRUNCATE, DELETE y permisos","html":"\u003cp\u003e\u003ccode\u003eDELETE\u003c/code\u003e es DML: puede llevar WHERE y forma parte de la transacción, así que \u003ccode\u003eROLLBACK\u003c/code\u003e lo deshace mientras no haya COMMIT. \u003ccode\u003eTRUNCATE TABLE\u003c/code\u003e es DDL: vacía la tabla completa, no acepta WHERE y confirma de inmediato, por lo que no se puede deshacer. También vacía los índices, que siguen siendo utilizables.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eGRANT\u003c/code\u003e otorga privilegios. Sobre columnas concretas se escribe \u003ccode\u003eGRANT UPDATE (title, address) ON customers TO andrew\u003c/code\u003e. \u003ccode\u003eWITH GRANT OPTION\u003c/code\u003e permite que el usuario otorgue ese privilegio de objeto a otros; \u003ccode\u003eWITH ADMIN OPTION\u003c/code\u003e es para privilegios de sistema y roles.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eCREATE TABLE copia AS SELECT * FROM empleado;\nSET AUTOCOMMIT FALSE;\nDELETE FROM copia WHERE depto = 'TI';\nSELECT COUNT(*) AS filas FROM copia;\nROLLBACK;\nSELECT COUNT(*) AS filas FROM copia;\nTRUNCATE TABLE copia;\nROLLBACK;\nSELECT COUNT(*) AS filas FROM copia;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFILAS\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFILAS\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e5\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFILAS\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eEl DELETE borra a Eva y Raúl, y el ROLLBACK los recupera. Después del TRUNCATE, el ROLLBACK ya no recupera nada porque TRUNCATE confirmó la operación.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eCREATE TABLE copia AS SELECT * FROM empleado;\nTRUNCATE TABLE copia WHERE depto = 'TI';\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eError: Error de Sintaxis en sentencia SQL \u0026quot;TRUNCATE TABLE COPIA WHERE[*] DEPTO = 'TI'\u0026quot;\u003c/p\u003e\n\u003cp\u003eTRUNCATE no tiene WHERE: para borrar algunas filas se usa DELETE.\u003c/p\u003e\n","number":"06"},{"title":"Fechas y subconsultas escalares","html":"\u003cp\u003eFunciones de fecha de Oracle que aparecen en el examen:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFunción\u003c/th\u003e\n  \u003cth\u003eDevuelve\u003c/th\u003e\n  \u003cth\u003eEjemplo\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eADD_MONTHS(fecha, n)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eLa fecha n meses después (ajusta al último día si hace falta)\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eADD_MONTHS(DATE '2026-01-31', 1)\u003c/code\u003e → 2026-02-28\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eMONTHS_BETWEEN(f1, f2)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eMeses entre dos fechas: positivo si f1 es posterior\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eMONTHS_BETWEEN(SYSDATE, start_date) \u0026lt;= 25\u003c/code\u003e: insertadas en los últimos 25 meses\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eNEXT_DAY(fecha, 'MONDAY')\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eEl primer día de ese nombre posterior a la fecha\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eNEXT_DAY(ADD_MONTHS(hire_date, 6), 'MONDAY')\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eSYSDATE\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eFecha y hora actuales del servidor\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eSELECT SYSDATE FROM DUAL\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003eRestar dos fechas da días, no meses.\u003c/li\u003e\n\u003cli\u003eUna subconsulta escalar devuelve un solo valor y puede ir donde va una expresión: en el SELECT, en WHERE, en VALUES de un INSERT o dentro de otra subconsulta. Si no devuelve filas, vale NULL.\u003c/li\u003e\n\u003cli\u003eOracle no admite subconsultas escalares como valor por defecto de una columna, en CHECK ni en GROUP BY.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT ADD_MONTHS(DATE '2026-01-31', 1) AS fecha FROM DUAL;\nSELECT nombre FROM empleado WHERE salario \u0026gt; (SELECT AVG(salario) FROM empleado) ORDER BY nombre;\nSELECT (SELECT nombre FROM empleado WHERE id = 99) AS nadie FROM DUAL;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eFECHA\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e2026-02-28\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNADIE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eEl promedio es 1100, así que Raúl (1100) no entra: la condición es mayor estricto. La última subconsulta no encuentra a nadie y vale NULL, no 0. MONTHS_BETWEEN y NEXT_DAY no se ejecutan aquí porque el motor de prueba no las tiene; su comportamiento es el de la documentación de Oracle.\u003c/p\u003e\n","number":"07"},{"title":"Precedencia: NOT, AND, OR","html":"\u003cp\u003ePrimero se aplican las comparaciones (\u003ccode\u003e=\u003c/code\u003e, \u003ccode\u003e\u0026lt;\u0026gt;\u003c/code\u003e, \u003ccode\u003e\u0026gt;\u003c/code\u003e…), después \u003ccode\u003eNOT\u003c/code\u003e, después \u003ccode\u003eAND\u003c/code\u003e y al final \u003ccode\u003eOR\u003c/code\u003e. Los paréntesis cambian ese orden.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eA OR B AND C\u003c/code\u003e se lee \u003ccode\u003eA OR (B AND C)\u003c/code\u003e. \u003ccode\u003eNOT A AND B\u003c/code\u003e se lee \u003ccode\u003e(NOT A) AND B\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT 'fila' AS r FROM DUAL WHERE 1 = 1 OR 1 = 0 AND 1 = 0;\nSELECT 'fila' AS r FROM DUAL WHERE (1 = 1 OR 1 = 0) AND 1 = 0;\nSELECT 'fila' AS r FROM DUAL WHERE NOT 1 = 2 AND 1 = 2;\nSELECT 'fila' AS r FROM DUAL WHERE NOT (1 = 1 AND 1 = 0);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eR\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003efila\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eR\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003efila\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003col\u003e\n\u003cli\u003everdadero OR (falso AND falso) = verdadero. 2) (verdadero OR falso) AND falso = falso. 3) (NOT falso) AND falso = falso. 4) NOT (verdadero AND falso) = NOT falso = verdadero.\u003c/li\u003e\n\u003c/ol\u003e\n","number":"08"},{"title":"NULL y la lógica de tres valores","html":"\u003cp\u003eCualquier comparación con NULL (\u003ccode\u003e= NULL\u003c/code\u003e, \u003ccode\u003e\u0026lt;\u0026gt; NULL\u003c/code\u003e, \u003ccode\u003e\u0026gt; NULL\u003c/code\u003e) da desconocido, no verdadero ni falso. Para preguntar si un valor es nulo se usa \u003ccode\u003eIS NULL\u003c/code\u003e o \u003ccode\u003eIS NOT NULL\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eDesconocido se combina así: \u003ccode\u003everdadero OR desconocido\u003c/code\u003e = verdadero; \u003ccode\u003efalso AND desconocido\u003c/code\u003e = falso; en los demás casos el resultado sigue siendo desconocido. \u003ccode\u003eNOT desconocido\u003c/code\u003e es desconocido.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eA\u003c/th\u003e\n  \u003cth\u003eB\u003c/th\u003e\n  \u003cth\u003eA AND B\u003c/th\u003e\n  \u003cth\u003eA OR B\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eV\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eF\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n  \u003ctd\u003eD\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT CASE WHEN 1 = NULL THEN 'verdadero' WHEN NOT (1 = NULL) THEN 'falso' ELSE 'desconocido' END AS r FROM DUAL;\nSELECT 'fila' AS r FROM DUAL WHERE (1 = NULL) OR 1 = 1;\nSELECT 'fila' AS r FROM DUAL WHERE (1 = NULL) AND 1 = 1;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eR\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003edesconocido\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eR\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003efila\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003cp\u003edesconocido OR verdadero = verdadero, así que se devuelve la fila. desconocido AND verdadero = desconocido, y WHERE descarta lo que no es verdadero.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT nombre FROM empleado WHERE depto = NULL;\nSELECT nombre FROM empleado WHERE depto IS NULL;\nSELECT nombre FROM empleado WHERE id NOT IN (SELECT jefe_id FROM empleado);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSara\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e(sin filas)\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e= NULL\u003c/code\u003e nunca es verdadero. El NOT IN es la trampa clásica: la subconsulta incluye NULL, así que \u003ccode\u003eid \u0026lt;\u0026gt; NULL\u003c/code\u003e es desconocido para todos y no se devuelve ninguna fila.\u003c/p\u003e\n","number":"09"},{"title":"Leyes de De Morgan","html":"\u003cp\u003eNegar una condición compuesta invierte cada parte y cambia el conector:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eNOT (A AND B)\u003c/code\u003e equivale a \u003ccode\u003eNOT A OR NOT B\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eNOT (A OR B)\u003c/code\u003e equivale a \u003ccode\u003eNOT A AND NOT B\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eNegar una comparación invierte el operador: \u003ccode\u003eNOT (salario \u0026gt; 1200)\u003c/code\u003e es \u003ccode\u003esalario \u0026lt;= 1200\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT nombre FROM empleado WHERE NOT (depto = 'TI' AND salario \u0026gt; 1200) ORDER BY id;\nSELECT nombre FROM empleado WHERE depto \u0026lt;\u0026gt; 'TI' OR salario \u0026lt;= 1200 ORDER BY id;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRaúl\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSara\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLuis\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRaúl\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSara\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAmbas consultas son equivalentes: excluyen solo a Eva (TI con 1500).\u003c/p\u003e\n","number":"10"},{"title":"Implicación","html":"\u003cp\u003e«Si P, entonces Q» (P → Q) solo es falsa cuando P es verdadera y Q falsa. En SQL se escribe \u003ccode\u003eNOT P OR Q\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eSu contrarrecíproca (\u003ccode\u003eNOT Q → NOT P\u003c/code\u003e) es equivalente. En cambio, de P → Q y Q no se puede concluir P (error de afirmar el consecuente).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT nombre FROM empleado WHERE NOT (depto = 'Ventas') OR salario \u0026gt; 1000 ORDER BY id;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eNOMBRE\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAna\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eEva\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRaúl\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eLa regla «si es de Ventas, gana más de 1000» excluye a Luis (Ventas, 900). Sara también queda fuera: su depto es NULL, así que \u003ccode\u003eNOT (depto = 'Ventas')\u003c/code\u003e es desconocido y su salario no pasa de 1000.\u003c/p\u003e\n","number":"11"},{"title":"AVG, NULL y alcance de UPDATE","html":"\u003cp\u003e\u003ccode\u003eAVG(columna)\u003c/code\u003e ignora NULL tanto en la suma como en la cantidad de valores. La media de 100, 300 y NULL es 200, no 133.33.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eWHERE\u003c/code\u003e filtra antes de agregar. Si no queda ningún valor y no hay GROUP BY, AVG devuelve una fila con NULL.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eUPDATE tabla SET columna = expresión WHERE condición\u003c/code\u003e cambia solo las filas seleccionadas. Sin WHERE cambia todas. \u003ccode\u003eNULL + 50\u003c/code\u003e sigue siendo NULL; una asignación directa sí puede reemplazar NULL.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eVer el script que crea los datos\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSQL · Oracle\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSELECT AVG(valor) AS promedio FROM salarios;\nUPDATE salarios SET valor = valor + 50 WHERE id \u0026lt;= 2;\nSELECT id, valor FROM salarios ORDER BY id;\nSELECT AVG(valor) AS promedio FROM salarios WHERE valor \u0026gt; 1000;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003ePROMEDIO\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e200\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eID\u003c/th\u003e\n  \u003cth\u003eVALOR\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n  \u003ctd\u003e150\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003e350\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003ePROMEDIO\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNULL\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003ePrimero AVG usa dos salarios. UPDATE suma 50 a las dos filas seleccionadas. El último filtro no conserva salarios.\u003c/p\u003e\n","number":"12"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eUNION\u003c/td\u003e\n  \u003ctd\u003eUNION ALL\u003c/td\u003e\n  \u003ctd\u003eSin duplicados contra con duplicados.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eWHERE\u003c/td\u003e\n  \u003ctd\u003eHAVING\u003c/td\u003e\n  \u003ctd\u003eFiltra filas antes de agrupar contra filtra grupos.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eCOUNT(*)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eCOUNT(columna)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eCuenta filas contra cuenta valores no NULL.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMINUS\u003c/td\u003e\n  \u003ctd\u003eINTERSECT\u003c/td\u003e\n  \u003ctd\u003eLo que está solo en la primera contra lo que está en ambas.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eINNER JOIN\u003c/td\u003e\n  \u003ctd\u003eLEFT JOIN\u003c/td\u003e\n  \u003ctd\u003eSolo coincidencias contra todas las filas de la izquierda.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDELETE\u003c/td\u003e\n  \u003ctd\u003eTRUNCATE\u003c/td\u003e\n  \u003ctd\u003eDML con WHERE y ROLLBACK contra DDL sin WHERE que no se deshace.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eLIKE '%AN%'\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e= '%AN%'\u003c/code\u003e o \u003ccode\u003eIN ('%AN%')\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003ePatrón con comodines contra comparación literal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eWITH GRANT OPTION\u003c/td\u003e\n  \u003ctd\u003eWITH ADMIN OPTION\u003c/td\u003e\n  \u003ctd\u003ePrivilegios de objeto (tablas) contra privilegios de sistema y roles.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003e= NULL\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eIS NULL\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eLa comparación da desconocido; IS NULL da verdadero o falso.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eA OR B AND C\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e(A OR B) AND C\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eAND se aplica antes que OR.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eNOT (A AND B)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eNOT A AND NOT B\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eLa negación de un AND es un OR de negaciones.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDesconocido\u003c/td\u003e\n  \u003ctd\u003eFalso\u003c/td\u003e\n  \u003ctd\u003eNOT falso es verdadero; NOT desconocido sigue desconocido.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿La pregunta es sobre filas del resultado o sobre filas modificadas?\u003c/li\u003e\n\u003cli\u003eEn operaciones de conjuntos: ¿mismo número de columnas? ¿Quita o conserva duplicados?\u003c/li\u003e\n\u003cli\u003e¿Hay columnas en el SELECT que no están en el GROUP BY?\u003c/li\u003e\n\u003cli\u003e¿Se filtra con WHERE o con HAVING?\u003c/li\u003e\n\u003cli\u003e¿Hay ORDER BY? Si no, no supongas un orden.\u003c/li\u003e\n\u003cli\u003e¿DISTINCT aparece una sola vez y justo después de SELECT?\u003c/li\u003e\n\u003cli\u003e¿Los comodines van con LIKE, no con = ni con IN?\u003c/li\u003e\n\u003cli\u003ePon paréntesis según la precedencia: NOT, luego AND, luego OR.\u003c/li\u003e\n\u003cli\u003e¿Alguna comparación involucra NULL? Entonces es desconocida.\u003c/li\u003e\n\u003cli\u003eWHERE solo conserva las filas verdaderas.\u003c/li\u003e\n\u003cli\u003e¿Hay un NOT IN con una subconsulta que puede contener NULL?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["WHERE / HAVING","Filtra filas / grupos"],["COUNT(*) / COUNT(col)","Todas las filas / no NULL"],["IS NULL / = NULL","Verifica NULL / devuelve UNKNOWN"],["INNER / LEFT JOIN","Coincidencias / conserva izquierda"],["NOT IN + NULL","Posible resultado vacío por lógica de tres valores"]]},{"title":"Diagramas de flujo","id":"diagramas-de-flujo","group":"Complementario","scope":"Complementario","icon":"workflow","intro":"Reconoce diagramas de flujo a partir de requisitos. Traza entradas, procesos, decisiones y salidas; comprueba casos frontera y la terminación de los ciclos.","sections":[{"title":"Trazado paso a paso del estado","html":"\u003cp\u003eRegistra el valor de cada variable antes de la decisión y después de cada proceso. Sigue la flecha de la rama elegida; no ejecutes también la otra rama.\u003c/p\u003e\n\u003cp\u003ePara sumar de 1 a n con i = 1 y suma = 0, la condición es i \u0026lt;= n. Cada vuelta suma i y después incrementa i. Esta traza usa n = 3:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eMomento\u003c/th\u003e\n  \u003cth\u003ei\u003c/th\u003e\n  \u003cth\u003esuma\u003c/th\u003e\n  \u003cth\u003ei \u0026lt;= 3\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAntes de entrar\u003c/td\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n  \u003ctd\u003e0\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDespués de la primera vuelta\u003c/td\u003e\n  \u003ctd\u003e2\u003c/td\u003e\n  \u003ctd\u003e1\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDespués de la segunda vuelta\u003c/td\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003e3\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDespués de la tercera vuelta\u003c/td\u003e\n  \u003ctd\u003e4\u003c/td\u003e\n  \u003ctd\u003e6\u003c/td\u003e\n  \u003ctd\u003eNo: mostrar 6 y terminar\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","number":"01"},{"title":"Diagramas de flujo: decisiones y requisitos","html":"\u003cp\u003eUn óvalo marca inicio o fin; un paralelogramo representa entrada o salida; un rectángulo representa un proceso; un rombo plantea una decisión. Las flechas indican el orden.\u003c/p\u003e\n\u003cp\u003eComprueba la condición del rombo y qué salida sigue cada rama Sí/No. Para «desde 18 inclusive», la condición es \u003ccode\u003eedad \u0026gt;= 18\u003c/code\u003e, no \u003ccode\u003eedad \u0026gt; 18\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUna sola salida esperada no demuestra que el diagrama sea correcto. Prueba valores por debajo, en el límite y por encima; para AND/OR, comprueba también cuando solo una condición es verdadera.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eRequisito\u003c/th\u003e\n  \u003cth\u003eCondición correcta\u003c/th\u003e\n  \u003cth\u003eEntradas para contrastar\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAdulto desde 18\u003c/td\u003e\n  \u003ctd\u003eedad \u0026gt;= 18\u003c/td\u003e\n  \u003ctd\u003e17, 18, 19\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAmbas cantidades mayores que 5\u003c/td\u003e\n  \u003ctd\u003ea \u0026gt; 5 \u0026amp;\u0026amp; b \u0026gt; 5\u003c/td\u003e\n  \u003ctd\u003e(6,6), (6,5), (5,6), (5,5)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNúmero par\u003c/td\u003e\n  \u003ctd\u003en % 2 == 0\u003c/td\u003e\n  \u003ctd\u003e0, 1, 2, 3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","number":"02"},{"title":"Diagramas con ciclos: inicializar, decidir y actualizar","html":"\u003cp\u003eAntes del ciclo identifica el estado inicial. La condición decide si se entra; el cuerpo cambia el estado y una flecha vuelve a la decisión. Una rama de salida debe llegar al fin.\u003c/p\u003e\n\u003cp\u003eSi se suman los números de 1 a n inclusive: inicializa \u003ccode\u003ei = 1\u003c/code\u003e, \u003ccode\u003esuma = 0\u003c/code\u003e; comprueba \u003ccode\u003ei \u0026lt;= n\u003c/code\u003e; suma i e incrementa i. Con n = 0 no debe ejecutarse el cuerpo.\u003c/p\u003e\n\u003cp\u003eComprueba que la actualización acerca el estado a la salida. Omitir i++ puede producir un ciclo infinito; usar i \u0026lt; n omite el último número.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint n = 3;\nint suma = 0;\nint i = 1;\nwhile (i \u0026lt;= n) {\n    suma += i;\n    i++;\n}\nSystem.out.println(suma + \u0026quot; \u0026quot; + i);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e6 4\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLas iteraciones usan i = 1, 2 y 3. Al llegar a 4 la condición es falsa y termina el ciclo.\u003c/p\u003e\n","number":"03"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDecisión\u003c/td\u003e\n  \u003ctd\u003eProceso\u003c/td\u003e\n  \u003ctd\u003eEl rombo elige una rama; el rectángulo modifica el estado.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ei \u0026lt; n\u003c/td\u003e\n  \u003ctd\u003ei \u0026lt;= n\u003c/td\u003e\n  \u003ctd\u003eLa segunda condición incluye el límite n.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eInicialización\u003c/td\u003e\n  \u003ctd\u003eActualización\u003c/td\u003e\n  \u003ctd\u003eLa primera prepara el estado; la segunda cambia el estado dentro del ciclo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003eIdentifica las entradas y la salida requerida.\u003c/li\u003e\n\u003cli\u003eSigue una sola rama por decisión y registra los valores.\u003c/li\u003e\n\u003cli\u003ePrueba valores por debajo, en el límite y por encima.\u003c/li\u003e\n\u003cli\u003eComprueba que cada ciclo actualiza su estado y tiene una salida alcanzable.\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Inicializar / actualizar","Asignación inicial / cambio por ciclo"],["Decisión","Evaluar dos ramas verdadero y falso"],["Condición de salida","Probar también 0 y 1 iteración"]]},{"title":"Tipos de pruebas de software","id":"tipos-de-pruebas-de-software","group":"Complementario","scope":"Complementario","icon":"check","intro":"Distingue las seis clases de prueba mencionadas en el correo mediante situaciones concretas. El nivel describe qué se evalúa; funcional describe el comportamiento y regresión la finalidad después de un cambio.","sections":[{"title":"Unitarias, integración y sistema","html":"\u003cp\u003eUnitarias: evalúan un componente aislado. Integración: evalúan interfaces e interacción entre componentes o sistemas. Sistema: evalúan el producto completo.\u003c/p\u003e\n\u003cp\u003eEn una aplicación Java, calcular un total aislado es unitario; comprobar servicio, repositorio y base de datos reales es integración; comprobar el flujo completo de pedidos es sistema.\u003c/p\u003e\n","number":"01"},{"title":"Funcionales y aceptación","html":"\u003cp\u003eFuncionales: comprueban qué hace el software frente al comportamiento especificado. Pueden aplicarse a un componente o a una aplicación completa.\u003c/p\u003e\n\u003cp\u003eAceptación: validan que el producto satisface las necesidades y criterios del negocio para aceptar su entrega. No basta con que el enunciado mencione una pantalla o un usuario.\u003c/p\u003e\n","number":"02"},{"title":"Regresión y etiquetas compatibles","html":"\u003cp\u003eRegresión: después de un cambio, busca efectos adversos sobre comportamientos existentes. Puede ser manual o automatizada y aplicarse a distintos niveles.\u003c/p\u003e\n\u003cp\u003eUna prueba puede ser unitaria y funcional; una prueba de sistema puede ser funcional y volver a ejecutarse como regresión. Lee si la pregunta pide nivel, comportamiento o finalidad.\u003c/p\u003e\n","number":"03"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eClase\u003c/th\u003e\n  \u003cth\u003eSeñal en el enunciado\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eUnitaria\u003c/td\u003e\n  \u003ctd\u003eComponente aislado\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntegración\u003c/td\u003e\n  \u003ctd\u003eContratos e interacción real\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSistema\u003c/td\u003e\n  \u003ctd\u003eProducto completo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFuncional\u003c/td\u003e\n  \u003ctd\u003eRegla de comportamiento especificada\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eRegresión\u003c/td\u003e\n  \u003ctd\u003eEfectos adversos de un cambio\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eAceptación\u003c/td\u003e\n  \u003ctd\u003eCriterios y aprobación de negocio\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003eIdentifica qué objeto se evalúa.\u003c/li\u003e\n\u003cli\u003eSepara alcance de finalidad.\u003c/li\u003e\n\u003cli\u003eNo deduzcas el nivel por la herramienta o por ser automatizada.\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Unitarias","Aíslan unidades"],["Integración","Interacción entre componentes"],["Sistema","Sistema completo"],["Regresión","Detecta fallos tras cambios"]]},{"title":"Localización","id":"localizacion","group":"Avanzado","scope":"1Z0-809","icon":"globe","intro":"Localizar es adaptar un programa a un idioma y región sin cambiar su código: los textos salen de archivos de recursos y los números, monedas y fechas se formatean según la convención local. La clase central es `Locale`, que identifica idioma y país.","sections":[{"title":"Locale","html":"\u003cp\u003eUn Locale tiene idioma (minúsculas, \u003ccode\u003ees\u003c/code\u003e) y opcionalmente país (mayúsculas, \u003ccode\u003eMX\u003c/code\u003e). Su \u003ccode\u003etoString\u003c/code\u003e es \u003ccode\u003ees_MX\u003c/code\u003e; su etiqueta estándar es \u003ccode\u003ees-MX\u003c/code\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFormas de crearlo: \u003ccode\u003enew Locale(\u0026quot;es\u0026quot;, \u0026quot;MX\u0026quot;)\u003c/code\u003e, constantes (\u003ccode\u003eLocale.US\u003c/code\u003e, \u003ccode\u003eLocale.GERMANY\u003c/code\u003e), \u003ccode\u003eLocale.forLanguageTag(\u0026quot;es-MX\u0026quot;)\u003c/code\u003e y \u003ccode\u003enew Locale.Builder().setLanguage(\u0026quot;es\u0026quot;).setRegion(\u0026quot;MX\u0026quot;).build()\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEl constructor normaliza mayúsculas: \u003ccode\u003enew Locale(\u0026quot;ES\u0026quot;, \u0026quot;mx\u0026quot;)\u003c/code\u003e da \u003ccode\u003ees_MX\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eLocale.setDefault\u003c/code\u003e cambia el locale por defecto de la JVM para las llamadas posteriores.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eLocale mx = new Locale(\u0026quot;es\u0026quot;, \u0026quot;MX\u0026quot;);\nLocale tag = Locale.forLanguageTag(\u0026quot;fr-CA\u0026quot;);\nLocale br = new Locale.Builder().setLanguage(\u0026quot;pt\u0026quot;).setRegion(\u0026quot;BR\u0026quot;).build();\nSystem.out.println(mx + \u0026quot; \u0026quot; + tag + \u0026quot; \u0026quot; + br + \u0026quot; \u0026quot; + Locale.US + \u0026quot; \u0026quot; + new Locale(\u0026quot;EN\u0026quot;, \u0026quot;us\u0026quot;));\nSystem.out.println(mx.getLanguage() + \u0026quot; \u0026quot; + mx.getCountry() + \u0026quot; \u0026quot; + mx.toLanguageTag());\nLocale.setDefault(Locale.GERMANY);\nSystem.out.println(Locale.getDefault());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ees_MX fr_CA pt_BR en_US en_US\nes MX es-MX\nde_DE\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCuatro formas de crear un Locale. El último ejemplo de la primera línea muestra la normalización de mayúsculas.\u003c/p\u003e\n","number":"01"},{"title":"Formatear números, monedas y fechas","html":"\u003cp\u003e\u003ccode\u003eNumberFormat.getInstance(locale)\u003c/code\u003e, \u003ccode\u003egetCurrencyInstance(locale)\u003c/code\u003e y \u003ccode\u003egetPercentInstance(locale)\u003c/code\u003e aplican los separadores y símbolos de la región. \u003ccode\u003eparse\u003c/code\u003e hace lo inverso. El formato de moneda solo cambia cómo se ve el número: no convierte de una moneda a otra.\u003c/p\u003e\n\u003cp\u003ePara fechas, \u003ccode\u003eDateTimeFormatter.ofLocalizedDate(FormatStyle.SHORT | MEDIUM | LONG | FULL)\u003c/code\u003e con \u003ccode\u003ewithLocale\u003c/code\u003e usa el formato de la región.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eMessageFormat.format(\u0026quot;Hola {0}, tienes {1} mensajes\u0026quot;, \u0026quot;Ana\u0026quot;, 3)\u003c/code\u003e sustituye los marcadores por posición.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003edouble monto = 1234.5;\nSystem.out.println(NumberFormat.getCurrencyInstance(Locale.US).format(monto));\nSystem.out.println(NumberFormat.getCurrencyInstance(Locale.GERMANY).format(monto));\nSystem.out.println(NumberFormat.getInstance(Locale.GERMANY).format(monto) + \u0026quot; \u0026quot; + NumberFormat.getInstance(Locale.US).format(monto));\nSystem.out.println(NumberFormat.getPercentInstance(Locale.US).format(0.256));\nSystem.out.println(NumberFormat.getInstance(Locale.GERMANY).parse(\u0026quot;1.234,5\u0026quot;));\nLocalDate d = LocalDate.of(2024, 3, 5);\nSystem.out.println(d.format(DateTimeFormatter.ofLocalizedDate(FormatStyle.SHORT).withLocale(Locale.US)));\nSystem.out.println(d.format(DateTimeFormatter.ofLocalizedDate(FormatStyle.LONG).withLocale(new Locale(\u0026quot;es\u0026quot;, \u0026quot;MX\u0026quot;))));\nSystem.out.println(MessageFormat.format(\u0026quot;Hola {0}, tienes {1} mensajes\u0026quot;, \u0026quot;Ana\u0026quot;, 3));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e$1,234.50\n1.234,50 €\n1.234,5 1,234.5\n26%\n1234.5\n3/5/24\n5 de marzo de 2024\nHola Ana, tienes 3 mensajes\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAlemania usa punto para miles y coma para decimales; Estados Unidos, al revés. El porcentaje multiplica por 100 y redondea.\u003c/p\u003e\n","number":"02"},{"title":"Properties","html":"\u003cp\u003e\u003ccode\u003eProperties\u003c/code\u003e guarda pares clave-valor de texto. \u003ccode\u003eload\u003c/code\u003e lee el formato \u003ccode\u003eclave=valor\u003c/code\u003e o \u003ccode\u003eclave: valor\u003c/code\u003e; las líneas con \u003ccode\u003e#\u003c/code\u003e o \u003ccode\u003e!\u003c/code\u003e son comentarios.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003egetProperty(clave)\u003c/code\u003e devuelve null si no existe; \u003ccode\u003egetProperty(clave, porDefecto)\u003c/code\u003e devuelve la alternativa.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eProperties p = new Properties();\np.load(new StringReader(\u0026quot;# configuración\\nhost=localhost\\npuerto: 8080\\n\u0026quot;));\nSystem.out.println(p.getProperty(\u0026quot;host\u0026quot;) + \u0026quot; \u0026quot; + p.getProperty(\u0026quot;puerto\u0026quot;) + \u0026quot; \u0026quot; + p.getProperty(\u0026quot;usuario\u0026quot;) + \u0026quot; \u0026quot; + p.getProperty(\u0026quot;usuario\u0026quot;, \u0026quot;invitado\u0026quot;));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elocalhost 8080 null invitado\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa clave «usuario» no existe: sin valor por defecto devuelve null.\u003c/p\u003e\n","number":"03"},{"title":"ResourceBundle","html":"\u003cp\u003e\u003ccode\u003eResourceBundle.getBundle(\u0026quot;Mensajes\u0026quot;, locale)\u003c/code\u003e busca archivos \u003ccode\u003eMensajes_idioma_PAIS.properties\u003c/code\u003e (o clases Java con ese nombre) en el classpath. Si no encuentra el más específico, sigue este orden:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003col\u003e\n\u003cli\u003e\u003ccode\u003eMensajes_es_MX\u003c/code\u003e → 2. \u003ccode\u003eMensajes_es\u003c/code\u003e → 3. los mismos pasos con el locale por defecto → 4. \u003ccode\u003eMensajes\u003c/code\u003e (base).\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003eUna vez elegido el archivo, las claves que le falten se buscan en sus padres: \u003ccode\u003eMensajes_es_MX\u003c/code\u003e → \u003ccode\u003eMensajes_es\u003c/code\u003e → \u003ccode\u003eMensajes\u003c/code\u003e. Los padres no incluyen el locale por defecto.\u003c/li\u003e\n\u003cli\u003eUna clave que no está en ningún archivo de la cadena lanza \u003ccode\u003eMissingResourceException\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEn Java 8 los \u003ccode\u003e.properties\u003c/code\u003e se leen como ISO-8859-1: las letras acentuadas deben escribirse con escapes \u003ccode\u003e\\u00e9\u003c/code\u003e o el texto se verá mal.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eMensajes.properties\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esaludo=Hello\ndespedida=Bye\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMensajes_es.properties\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esaludo=Hola\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMensajes_es_MX.properties\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003esaludo=Que tal\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Locale.setDefault(Locale.US);\n        ResourceBundle mx = ResourceBundle.getBundle(\u0026quot;Mensajes\u0026quot;, new Locale(\u0026quot;es\u0026quot;, \u0026quot;MX\u0026quot;));\n        ResourceBundle ar = ResourceBundle.getBundle(\u0026quot;Mensajes\u0026quot;, new Locale(\u0026quot;es\u0026quot;, \u0026quot;AR\u0026quot;));\n        ResourceBundle fr = ResourceBundle.getBundle(\u0026quot;Mensajes\u0026quot;, Locale.FRANCE);\n        System.out.println(mx.getString(\u0026quot;saludo\u0026quot;) + \u0026quot; / \u0026quot; + mx.getString(\u0026quot;despedida\u0026quot;));\n        System.out.println(ar.getString(\u0026quot;saludo\u0026quot;) + \u0026quot; [\u0026quot; + ar.getLocale() + \u0026quot;]\u0026quot;);\n        System.out.println(fr.getString(\u0026quot;saludo\u0026quot;) + \u0026quot; [\u0026quot; + fr.getLocale() + \u0026quot;]\u0026quot;);\n        try {\n            mx.getString(\u0026quot;titulo\u0026quot;);\n        } catch (MissingResourceException e) {\n            System.out.println(\u0026quot;falta la clave titulo\u0026quot;);\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eQue tal / Bye\nHola [es]\nHello []\nfalta la clave titulo\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ees_MX encuentra «saludo» en su archivo y «despedida» en el base. es_AR no tiene archivo y usa Mensajes_es. Para Francia no hay archivo ni para el locale por defecto (en_US), así que usa el base, cuyo locale está vacío.\u003c/p\u003e\n","number":"04"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ees_MX\u003c/code\u003e (toString)\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ees-MX\u003c/code\u003e (etiqueta)\u003c/td\u003e\n  \u003ctd\u003eGuion bajo en toString y en nombres de archivo; guion en forLanguageTag.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePadres de un bundle\u003c/td\u003e\n  \u003ctd\u003eLocale por defecto\u003c/td\u003e\n  \u003ctd\u003eLas claves faltantes se buscan en los padres; el locale por defecto solo interviene al elegir el archivo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFormato de moneda\u003c/td\u003e\n  \u003ctd\u003eConversión de moneda\u003c/td\u003e\n  \u003ctd\u003eCambia símbolo y separadores, no el valor.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003egetProperty(k)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003egetString(k)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eProperties devuelve null; ResourceBundle lanza MissingResourceException.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Qué locale se pide y cuál es el locale por defecto?\u003c/li\u003e\n\u003cli\u003e¿Qué archivos existen? Recorre el orden de búsqueda hasta encontrar uno.\u003c/li\u003e\n\u003cli\u003e¿La clave está en ese archivo o en uno de sus padres?\u003c/li\u003e\n\u003cli\u003e¿Se usa coma o punto decimal según el locale?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Locale / ResourceBundle","Preferencia regional / textos traducibles"],["NumberFormat","Formato sensible a locale"],["getBundle","Busca archivos usando reglas de fallback"],["Properties","Asocia claves String a valores String"]]},{"title":"Acceso a bases de datos con JDBC","id":"acceso-a-bases-de-datos-con-jdbc","group":"Avanzado","scope":"1Z0-809","icon":"database","intro":"JDBC es la API estándar de Java para hablar con bases de datos relacionales. El programa usa interfaces (`Connection`, `Statement`, `ResultSet`) y el driver de cada base de datos aporta la implementación. El flujo es siempre: obtener una conexión, crear una sentencia, ejecutarla, leer resultados y cerrar todo.","sections":[{"title":"Conexión, sentencias y resultados","html":"\u003cp\u003e\u003ccode\u003eDriverManager.getConnection(url)\u003c/code\u003e devuelve una \u003ccode\u003eConnection\u003c/code\u003e. La URL empieza con \u003ccode\u003ejdbc:\u003c/code\u003e seguido del subprotocolo del driver (\u003ccode\u003ejdbc:mysql://host/db\u003c/code\u003e, \u003ccode\u003ejdbc:h2:mem:prueba\u003c/code\u003e). Desde JDBC 4 el driver se carga solo si está en el classpath; si no hay uno para la URL, se lanza \u003ccode\u003eSQLException\u003c/code\u003e («No suitable driver»).\u003c/p\u003e\n\u003cp\u003eTodos los métodos de estas interfaces pueden lanzar \u003ccode\u003eSQLException\u003c/code\u003e, que es checked.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eMétodo de Statement\u003c/th\u003e\n  \u003cth\u003ePara\u003c/th\u003e\n  \u003cth\u003eDevuelve\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eexecuteQuery(sql)\u003c/td\u003e\n  \u003ctd\u003eSELECT\u003c/td\u003e\n  \u003ctd\u003eResultSet\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eexecuteUpdate(sql)\u003c/td\u003e\n  \u003ctd\u003eINSERT, UPDATE, DELETE, DDL\u003c/td\u003e\n  \u003ctd\u003eint: filas afectadas (0 en DDL)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eexecute(sql)\u003c/td\u003e\n  \u003ctd\u003eCualquiera\u003c/td\u003e\n  \u003ctd\u003eboolean: true si el resultado es un ResultSet\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws SQLException {\n
