<script id="study-data" type="application/json">{"chapters":[{"title":"Plataforma, tipos y control de flujo","id":"plataforma-tipos-y-control-de-flujo","group":"Fundamentos","scope":"1Z0-808","icon":"terminal","intro":"Un programa Java pasa por dos etapas: el compilador (`javac`) revisa tipos, nombres y alcance, y la JVM ejecuta el bytecode resultante. En el examen, la primera pregunta ante cualquier fragmento es si compila; solo después tiene sentido calcular la salida o la excepción.","sections":[{"title":"Del código fuente a la ejecución","html":"\u003cp\u003e\u003ccode\u003ejavac Main.java\u003c/code\u003e genera \u003ccode\u003eMain.class\u003c/code\u003e (bytecode). \u003ccode\u003ejava Main\u003c/code\u003e arranca la JVM, carga la clase y ejecuta su método \u003ccode\u003emain\u003c/code\u003e. El mismo bytecode corre en cualquier sistema con una JVM compatible.\u003c/p\u003e\n\u003cp\u003eUn archivo puede tener varias clases, pero solo una \u003ccode\u003epublic\u003c/code\u003e, y su nombre debe coincidir con el del archivo.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eJDK = herramientas de desarrollo (\u003ccode\u003ejavac\u003c/code\u003e, \u003ccode\u003ejar\u003c/code\u003e) + JRE. JRE = JVM + bibliotecas estándar.\u003c/li\u003e\n\u003cli\u003eFirma válida de entrada: \u003ccode\u003epublic static void main(String[] args)\u003c/code\u003e. También valen \u003ccode\u003eString... args\u003c/code\u003e, \u003ccode\u003eString args[]\u003c/code\u003e, \u003ccode\u003efinal String[] args\u003c/code\u003e y el orden \u003ccode\u003estatic public\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eSin \u003ccode\u003estatic\u003c/code\u003e, o con un retorno distinto de \u003ccode\u003evoid\u003c/code\u003e, el código compila pero la JVM no lo acepta como punto de entrada.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eargs\u003c/code\u003e nunca es \u003ccode\u003enull\u003c/code\u003e: si no se pasan argumentos, es un arreglo de longitud 0.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    public static void main(String... args) {\n        System.out.println(\u0026quot;argumentos: \u0026quot; + args.length);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eargumentos: 0\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSe ejecutó sin argumentos: \u003ccode\u003eargs\u003c/code\u003e existe y su \u003ccode\u003elength\u003c/code\u003e es 0.\u003c/p\u003e\n","number":"01"},{"title":"Tipos primitivos y literales","html":"\u003cp\u003eJava tiene ocho tipos primitivos. Todo lo demás (String, arreglos, clases propias) es una referencia a un objeto.\u003c/p\u003e\n\u003cp\u003eLos campos de clase y los elementos de un arreglo reciben un valor por defecto. Las variables locales no: deben asignarse antes de leerse o el código no compila.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTipo\u003c/th\u003e\n  \u003cth\u003eTamaño\u003c/th\u003e\n  \u003cth\u003eValor por defecto (campos)\u003c/th\u003e\n  \u003cth\u003eLiteral de ejemplo\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003ebyte\u003c/td\u003e\n  \u003ctd\u003e8 bits (-128 a 127)\u003c/td\u003e\n  \u003ctd\u003e0\u003c/td\u003e\n  \u003ctd\u003e(byte) 10\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eshort\u003c/td\u003e\n  \u003ctd\u003e16 bits\u003c/td\u003e\n  \u003ctd\u003e0\u003c/td\u003e\n  \u003ctd\u003e(short) 300\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003echar\u003c/td\u003e\n  \u003ctd\u003e16 bits sin signo\u003c/td\u003e\n  \u003ctd\u003e'\\u0000'\u003c/td\u003e\n  \u003ctd\u003e'A', 65\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eint\u003c/td\u003e\n  \u003ctd\u003e32 bits\u003c/td\u003e\n  \u003ctd\u003e0\u003c/td\u003e\n  \u003ctd\u003e1_000, 0x1F, 0b101, 017\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003elong\u003c/td\u003e\n  \u003ctd\u003e64 bits\u003c/td\u003e\n  \u003ctd\u003e0L\u003c/td\u003e\n  \u003ctd\u003e3_000_000_000L\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003efloat\u003c/td\u003e\n  \u003ctd\u003e32 bits\u003c/td\u003e\n  \u003ctd\u003e0.0f\u003c/td\u003e\n  \u003ctd\u003e3.5f\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003edouble\u003c/td\u003e\n  \u003ctd\u003e64 bits\u003c/td\u003e\n  \u003ctd\u003e0.0\u003c/td\u003e\n  \u003ctd\u003e3.5, 1e3\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eboolean\u003c/td\u003e\n  \u003ctd\u003etrue/false\u003c/td\u003e\n  \u003ctd\u003efalse\u003c/td\u003e\n  \u003ctd\u003etrue\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003eUn literal entero es \u003ccode\u003eint\u003c/code\u003e; un literal decimal es \u003ccode\u003edouble\u003c/code\u003e. Por eso \u003ccode\u003efloat f = 3.5;\u003c/code\u003e no compila.\u003c/li\u003e\n\u003cli\u003eEl guion bajo solo puede ir entre dígitos: \u003ccode\u003e1_000\u003c/code\u003e sí, \u003ccode\u003e_1000\u003c/code\u003e o \u003ccode\u003e1000_\u003c/code\u003e no.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003echar\u003c/code\u003e es numérico: \u003ccode\u003e'A' + 1\u003c/code\u003e vale 66 (int).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint x = 1_000;\nlong grande = 3_000_000_000L;\nfloat f = 3.5f;\nchar c = 'A';\nSystem.out.println(x + \u0026quot; \u0026quot; + grande + \u0026quot; \u0026quot; + f + \u0026quot; \u0026quot; + (c + 1) + \u0026quot; \u0026quot; + (char) (c + 1));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e1000 3000000000 3.5 66 B\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ec + 1\u003c/code\u003e se calcula como int (66). Con el cast \u003ccode\u003e(char)\u003c/code\u003e vuelve a ser carácter: B.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint n;\nSystem.out.println(n);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUna variable local no tiene valor por defecto. El compilador rechaza leer \u003ccode\u003en\u003c/code\u003e antes de asignarla: «variable n might not have been initialized».\u003c/p\u003e\n","number":"02"},{"title":"Conversiones y promoción numérica","html":"\u003cp\u003eJava amplía tipos automáticamente cuando no hay pérdida (\u003ccode\u003eint\u003c/code\u003e → \u003ccode\u003elong\u003c/code\u003e → \u003ccode\u003efloat\u003c/code\u003e → \u003ccode\u003edouble\u003c/code\u003e). Para reducir (\u003ccode\u003edouble\u003c/code\u003e → \u003ccode\u003eint\u003c/code\u003e, \u003ccode\u003eint\u003c/code\u003e → \u003ccode\u003ebyte\u003c/code\u003e) hace falta un cast explícito, que puede truncar o desbordar.\u003c/p\u003e\n\u003cp\u003eEn una operación aritmética, \u003ccode\u003ebyte\u003c/code\u003e, \u003ccode\u003eshort\u003c/code\u003e y \u003ccode\u003echar\u003c/code\u003e se promocionan a \u003ccode\u003eint\u003c/code\u003e. Si un operando es \u003ccode\u003elong\u003c/code\u003e, \u003ccode\u003efloat\u003c/code\u003e o \u003ccode\u003edouble\u003c/code\u003e, el resultado toma ese tipo.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ebyte + byte\u003c/code\u003e produce \u003ccode\u003eint\u003c/code\u003e; asignarlo a un \u003ccode\u003ebyte\u003c/code\u003e exige cast.\u003c/li\u003e\n\u003cli\u003eLos operadores compuestos (\u003ccode\u003e+=\u003c/code\u003e, \u003ccode\u003e*=\u003c/code\u003e…) incluyen un cast implícito: \u003ccode\u003eb += 5\u003c/code\u003e compila con \u003ccode\u003eb\u003c/code\u003e de tipo \u003ccode\u003ebyte\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eUna constante que cabe en el tipo sí se asigna sin cast: \u003ccode\u003ebyte b = 10;\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eint / int\u003c/code\u003e descarta los decimales. \u003ccode\u003e%\u003c/code\u003e devuelve el residuo.\u003c/li\u003e\n\u003cli\u003eLos enteros desbordan sin excepción: \u003ccode\u003eInteger.MAX_VALUE + 1\u003c/code\u003e es el valor mínimo. Dividir un entero entre 0 lanza \u003ccode\u003eArithmeticException\u003c/code\u003e; dividir un \u003ccode\u003edouble\u003c/code\u003e entre 0 da \u003ccode\u003eInfinity\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ebyte a = 10;\nbyte b = 20;\nint suma = a + b;\na += 5;\nSystem.out.println(suma + \u0026quot; \u0026quot; + a);\nSystem.out.println(7 / 2 + \u0026quot; \u0026quot; + 7 / 2.0 + \u0026quot; \u0026quot; + 7 % 3);\nSystem.out.println((int) 3.99 + \u0026quot; \u0026quot; + (byte) 130);\nSystem.out.println(Integer.MAX_VALUE + 1);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e30 15\n3 3.5 1\n3 -126\n-2147483648\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003e(int) 3.99\u003c/code\u003e trunca a 3 (no redondea). \u003ccode\u003e(byte) 130\u003c/code\u003e no cabe en un byte y da la vuelta a -126. El desbordamiento de int tampoco lanza excepción.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ebyte a = 10;\nbyte b = 20;\nbyte c = a + b;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ea + b\u003c/code\u003e es de tipo int. Asignarlo a un byte requiere \u003ccode\u003e(byte) (a + b)\u003c/code\u003e o usar \u003ccode\u003eint c\u003c/code\u003e.\u003c/p\u003e\n","number":"03"},{"title":"Operadores","html":"\u003cp\u003eEl orden de evaluación es de izquierda a derecha, respetando la precedencia: postfijos (\u003ccode\u003ex++\u003c/code\u003e), unarios (\u003ccode\u003e++x\u003c/code\u003e, \u003ccode\u003e!\u003c/code\u003e, cast), multiplicativos, aditivos, relacionales, igualdad, lógicos y asignación.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ex++\u003c/code\u003e usa el valor actual y después incrementa. \u003ccode\u003e++x\u003c/code\u003e incrementa y después usa el nuevo valor.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e\u0026amp;\u0026amp;\u003c/code\u003e y \u003ccode\u003e||\u003c/code\u003e hacen cortocircuito: si el lado izquierdo decide el resultado, el derecho no se evalúa. \u003ccode\u003e\u0026amp;\u003c/code\u003e y \u003ccode\u003e|\u003c/code\u003e evalúan ambos lados siempre.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e+\u003c/code\u003e concatena en cuanto uno de los operandos es String, siguiendo el orden de izquierda a derecha.\u003c/li\u003e\n\u003cli\u003eEl operador ternario \u003ccode\u003econdición ? a : b\u003c/code\u003e devuelve un valor; ambas ramas deben ser compatibles con el destino.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint x = 5;\nint y = x++ + ++x;\nSystem.out.println(x + \u0026quot; \u0026quot; + y);\nSystem.out.println(1 + 2 + \u0026quot;3\u0026quot; + 4 + 5);\nint z = 0;\nboolean r = (z \u0026gt; 0) \u0026amp;\u0026amp; (++z \u0026gt; 0);\nSystem.out.println(r + \u0026quot; \u0026quot; + z);\nboolean s = (z == 0) | (++z \u0026gt; 0);\nSystem.out.println(s + \u0026quot; \u0026quot; + z);\nSystem.out.println(x \u0026gt; 6 ? \u0026quot;grande\u0026quot; : \u0026quot;chico\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e7 12\n3345\nfalse 0\ntrue 1\ngrande\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ex++\u003c/code\u003e aporta 5 y deja x en 6; \u003ccode\u003e++x\u003c/code\u003e la sube a 7 y aporta 7: y = 12. En la concatenación, 1 + 2 se suma (3) antes de encontrar el String. \u003ccode\u003e\u0026amp;\u0026amp;\u003c/code\u003e no evalúa \u003ccode\u003e++z\u003c/code\u003e; \u003ccode\u003e|\u003c/code\u003e sí lo evalúa.\u003c/p\u003e\n","number":"04"},{"title":"if/else y switch","html":"\u003cp\u003eLas llaves definen los bloques, no la sangría. Sin llaves, \u003ccode\u003eif\u003c/code\u003e y \u003ccode\u003eelse\u003c/code\u003e controlan solo la siguiente sentencia, y un \u003ccode\u003eelse\u003c/code\u003e pertenece al \u003ccode\u003eif\u003c/code\u003e sin \u003ccode\u003eelse\u003c/code\u003e más cercano.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eswitch\u003c/code\u003e salta al \u003ccode\u003ecase\u003c/code\u003e que coincide y ejecuta desde ahí hacia abajo hasta encontrar \u003ccode\u003ebreak\u003c/code\u003e o el final (fall-through). \u003ccode\u003edefault\u003c/code\u003e se ejecuta si ningún caso coincide, sin importar dónde esté escrito.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eTipos válidos en \u003ccode\u003eswitch\u003c/code\u003e (Java 8): \u003ccode\u003ebyte\u003c/code\u003e, \u003ccode\u003eshort\u003c/code\u003e, \u003ccode\u003echar\u003c/code\u003e, \u003ccode\u003eint\u003c/code\u003e, sus wrappers, \u003ccode\u003eString\u003c/code\u003e y enums. No se permiten \u003ccode\u003elong\u003c/code\u003e, \u003ccode\u003eboolean\u003c/code\u003e, \u003ccode\u003efloat\u003c/code\u003e ni \u003ccode\u003edouble\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eCada \u003ccode\u003ecase\u003c/code\u003e necesita una constante de compilación y no puede repetirse.\u003c/li\u003e\n\u003cli\u003eUn \u003ccode\u003e;\u003c/code\u003e justo después de \u003ccode\u003eif (...)\u003c/code\u003e es un cuerpo vacío: la sentencia siguiente se ejecuta siempre.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint dia = 2;\nswitch (dia) {\n    case 1: System.out.print(\u0026quot;L\u0026quot;);\n    case 2: System.out.print(\u0026quot;M\u0026quot;);\n    case 3: System.out.print(\u0026quot;X\u0026quot;);\n        break;\n    default: System.out.print(\u0026quot;?\u0026quot;);\n}\nSystem.out.println();\nString nivel = \u0026quot;medio\u0026quot;;\nswitch (nivel) {\n    case \u0026quot;bajo\u0026quot;: System.out.print(1); break;\n    case \u0026quot;medio\u0026quot;: System.out.print(2);\n    default: System.out.print(3);\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMX\n23\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCon \u003ccode\u003edia = 2\u003c/code\u003e entra en \u003ccode\u003ecase 2\u003c/code\u003e, sigue a \u003ccode\u003ecase 3\u003c/code\u003e por no haber \u003ccode\u003ebreak\u003c/code\u003e y se detiene ahí. En el segundo switch, «medio» imprime 2 y continúa hasta \u003ccode\u003edefault\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elong n = 1;\nswitch (n) {\n    case 1: System.out.print(\u0026quot;uno\u0026quot;);\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eswitch\u003c/code\u003e no acepta \u003ccode\u003elong\u003c/code\u003e. Habría que usar \u003ccode\u003eint\u003c/code\u003e o convertir con \u003ccode\u003e(int) n\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint x = 0;\nif (x \u0026gt; 0);\n    System.out.print(\u0026quot;A\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eA\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl \u003ccode\u003e;\u003c/code\u003e cierra el if con un cuerpo vacío. La impresión queda fuera del if y se ejecuta aunque la condición sea falsa.\u003c/p\u003e\n","number":"05"},{"title":"Ciclos, break y continue","html":"\u003cp\u003e\u003ccode\u003ewhile\u003c/code\u003e revisa la condición antes de cada vuelta y puede no ejecutarse nunca. \u003ccode\u003edo/while\u003c/code\u003e ejecuta el cuerpo una vez antes de revisar y termina en \u003ccode\u003e;\u003c/code\u003e obligatorio. \u003ccode\u003efor\u003c/code\u003e agrupa inicialización, condición y actualización; las variables declaradas en su cabecera solo existen dentro del ciclo.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ebreak\u003c/code\u003e sale del ciclo (o switch) más cercano. \u003ccode\u003econtinue\u003c/code\u003e salta al final de la iteración actual. Con una etiqueta (\u003ccode\u003eexterno:\u003c/code\u003e) afectan al ciclo etiquetado.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003efor (int i = 0; i \u0026lt; 5; i++) {\n    if (i == 1) continue;\n    if (i == 4) break;\n    System.out.print(i);\n}\nSystem.out.println();\nint n = 10;\ndo {\n    System.out.print(n);\n} while (n \u0026lt; 5);\nSystem.out.println();\nexterno:\nfor (int i = 1; i \u0026lt;= 3; i++) {\n    for (int j = 1; j \u0026lt;= 3; j++) {\n        if (j == 2) continue externo;\n        if (i == 3) break externo;\n        System.out.print(\u0026quot;[\u0026quot; + i + j + \u0026quot;]\u0026quot;);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e023\n10\n[11][21]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl primer ciclo omite 1 y termina al llegar a 4. El do/while imprime 10 aunque la condición sea falsa. En el ciclo etiquetado, \u003ccode\u003econtinue externo\u003c/code\u003e pasa a la siguiente i y \u003ccode\u003ebreak externo\u003c/code\u003e termina ambos ciclos.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003efor (int i = 0; i \u0026lt; 3; i++);\nSystem.out.print(i);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ei\u003c/code\u003e se declaró en la cabecera del for y no existe fuera de él. Además, el \u003ccode\u003e;\u003c/code\u003e deja el ciclo con cuerpo vacío.\u003c/p\u003e\n","number":"06"},{"title":"Rangos completos y valores límite","html":"\u003cp\u003eLos enteros con signo de n bits abarcan de \u003ccode\u003e-2^(n-1)\u003c/code\u003e a \u003ccode\u003e2^(n-1)-1\u003c/code\u003e. \u003ccode\u003echar\u003c/code\u003e representa una unidad UTF-16 sin signo; no equivale a cualquier carácter Unicode completo.\u003c/p\u003e\n\u003cp\u003eEn \u003ccode\u003efloat\u003c/code\u003e y \u003ccode\u003edouble\u003c/code\u003e, \u003ccode\u003eMIN_VALUE\u003c/code\u003e significa el menor valor positivo distinto de cero. El finito más negativo es \u003ccode\u003e-MAX_VALUE\u003c/code\u003e. Los números flotantes también admiten infinito y NaN.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eboolean\u003c/code\u003e solo admite \u003ccode\u003etrue\u003c/code\u003e y \u003ccode\u003efalse\u003c/code\u003e: Java no define un tamaño de almacenamiento portable ni convierte automáticamente 0/1 a boolean.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTipo\u003c/th\u003e\n  \u003cth\u003eBits\u003c/th\u003e\n  \u003cth\u003eRango o límites finitos\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003ebyte\u003c/td\u003e\n  \u003ctd\u003e8\u003c/td\u003e\n  \u003ctd\u003e-128 a 127\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eshort\u003c/td\u003e\n  \u003ctd\u003e16\u003c/td\u003e\n  \u003ctd\u003e-32768 a 32767\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003echar\u003c/td\u003e\n  \u003ctd\u003e16 sin signo\u003c/td\u003e\n  \u003ctd\u003e0 a 65535\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eint\u003c/td\u003e\n  \u003ctd\u003e32\u003c/td\u003e\n  \u003ctd\u003e-2147483648 a 2147483647\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003elong\u003c/td\u003e\n  \u003ctd\u003e64\u003c/td\u003e\n  \u003ctd\u003e-9223372036854775808 a 9223372036854775807\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003efloat\u003c/td\u003e\n  \u003ctd\u003e32\u003c/td\u003e\n  \u003ctd\u003e±3.4028235E38 aprox.; mínimo positivo ≈1.4E-45\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003edouble\u003c/td\u003e\n  \u003ctd\u003e64\u003c/td\u003e\n  \u003ctd\u003e±1.7976931348623157E308 aprox.; mínimo positivo ≈4.9E-324\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eboolean\u003c/td\u003e\n  \u003ctd\u003eNo especificado por el lenguaje\u003c/td\u003e\n  \u003ctd\u003etrue / false\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint n = Integer.MAX_VALUE;\nSystem.out.println(n + 1);\nSystem.out.println((long) n + 1);\nSystem.out.println(Float.MIN_VALUE \u0026gt; 0);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e-2147483648\n2147483648\ntrue\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa suma int desborda; convertir antes de sumar permite usar long. MIN_VALUE flotante es positivo.\u003c/p\u003e\n","number":"07"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ex++\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e++x\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eEl primero entrega el valor anterior; el segundo, el nuevo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003e\u0026amp;\u0026amp;\u003c/code\u003e, \u003ccode\u003e\\|\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e\u0026amp;\u003c/code\u003e, \u003ccode\u003e\\|\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eLos dobles hacen cortocircuito; los simples evalúan ambos lados.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eCampo sin asignar\u003c/td\u003e\n  \u003ctd\u003eVariable local sin asignar\u003c/td\u003e\n  \u003ctd\u003eEl campo vale 0/null/false; la local impide compilar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ewhile\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003edo/while\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003edo/while\u003c/code\u003e ejecuta al menos una vez.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ebreak\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003econtinue\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ebreak\u003c/code\u003e sale del ciclo; \u003ccode\u003econtinue\u003c/code\u003e pasa a la siguiente iteración.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Cada variable local está asignada antes de leerse y en su alcance?\u003c/li\u003e\n\u003cli\u003e¿Hay una asignación que reduce el tipo sin cast (\u003ccode\u003eint\u003c/code\u003e → \u003ccode\u003ebyte\u003c/code\u003e, \u003ccode\u003edouble\u003c/code\u003e → \u003ccode\u003efloat\u003c/code\u003e)?\u003c/li\u003e\n\u003cli\u003e¿Algún \u003ccode\u003e;\u003c/code\u003e o la falta de llaves cambia qué controla un if o un ciclo?\u003c/li\u003e\n\u003cli\u003e¿El switch tiene \u003ccode\u003ebreak\u003c/code\u003e en cada caso o hay fall-through?\u003c/li\u003e\n\u003cli\u003e¿Hay \u003ccode\u003ex++\u003c/code\u003e/\u003ccode\u003e++x\u003c/code\u003e o cortocircuito que cambie el valor de una variable?\u003c/li\u003e\n\u003cli\u003e¿El valor cabe en el rango y la operación se hace como int o como long?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["int / long","32 bits / 64 bits; el cast debe preceder la operación"],["byte + byte","Resultado int"],["b += 1","Cast implícito del compuesto"],["\u0026\u0026 / \u0026","Cortocircuito / evalúa ambos operandos"],["x++ / ++x","Entrega el valor anterior / el nuevo"],["switch Java 8","String, enum, char, byte, short, int y wrappers compatibles; no long"]]},{"title":"Programación orientada a objetos","id":"programacion-orientada-a-objetos","group":"Fundamentos","scope":"1Z0-808/809","icon":"boxes","intro":"Una clase define estado (campos) y comportamiento (métodos). Una variable de tipo objeto no contiene el objeto: contiene una referencia a él. Casi todas las preguntas de POO se resuelven separando dos cosas: el tipo declarado de la referencia, que el compilador usa, y la clase real del objeto, que la JVM usa al ejecutar.","sections":[{"title":"Objetos, referencias y paso de parámetros","html":"\u003cp\u003e\u003ccode\u003enew\u003c/code\u003e crea un objeto y devuelve una referencia. Asignar una referencia a otra variable copia la referencia, no el objeto: ambas apuntan al mismo objeto.\u003c/p\u003e\n\u003cp\u003eJava siempre pasa los argumentos por valor. Con primitivos se copia el número; con objetos se copia la referencia. Por eso un método puede modificar el objeto recibido, pero reasignar el parámetro no cambia la variable del llamador.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Cuenta {\n    int saldo;\n}\npublic class Main {\n    static void depositar(Cuenta c, int monto) { c.saldo += monto; }\n    static void reemplazar(Cuenta c) { c = new Cuenta(); c.saldo = 999; }\n    static void duplicar(int n) { n = n * 2; }\n    public static void main(String[] args) {\n        Cuenta a = new Cuenta();\n        Cuenta b = a;\n        depositar(b, 100);\n        reemplazar(a);\n        int x = 5;\n        duplicar(x);\n        System.out.println(a.saldo + \u0026quot; \u0026quot; + (a == b) + \u0026quot; \u0026quot; + x);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e100 true 5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ea\u003c/code\u003e y \u003ccode\u003eb\u003c/code\u003e apuntan al mismo objeto, así que el depósito se ve desde \u003ccode\u003ea\u003c/code\u003e. \u003ccode\u003ereemplazar\u003c/code\u003e solo cambia su copia de la referencia, y \u003ccode\u003eduplicar\u003c/code\u003e su copia del int.\u003c/p\u003e\n","number":"01"},{"title":"Constructores y orden de inicialización","html":"\u003cp\u003eUn constructor se llama como la clase y no declara tipo de retorno. Si una clase no declara ninguno, el compilador agrega uno sin parámetros. Si declara alguno, ese constructor por defecto ya no existe.\u003c/p\u003e\n\u003cp\u003eLa primera línea de todo constructor es \u003ccode\u003ethis(...)\u003c/code\u003e o \u003ccode\u003esuper(...)\u003c/code\u003e. Si no se escribe, el compilador inserta \u003ccode\u003esuper()\u003c/code\u003e, que exige un constructor sin parámetros en la superclase.\u003c/p\u003e\n\u003cp\u003eOrden al crear un objeto: bloques y campos \u003ccode\u003estatic\u003c/code\u003e (una sola vez, al cargar la clase, primero la superclase), después, para cada objeto, inicializadores y constructor de la superclase y luego los de la subclase.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Base {\n    static { System.out.print(\u0026quot;[Base static]\u0026quot;); }\n    { System.out.print(\u0026quot;[Base init]\u0026quot;); }\n    Base() { System.out.print(\u0026quot;[Base()]\u0026quot;); }\n}\nclass Hija extends Base {\n    static { System.out.print(\u0026quot;[Hija static]\u0026quot;); }\n    { System.out.print(\u0026quot;[Hija init]\u0026quot;); }\n    Hija() { System.out.print(\u0026quot;[Hija()]\u0026quot;); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        new Hija();\n        System.out.println();\n        new Hija();\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[Base static][Hija static][Base init][Base()][Hija init][Hija()]\n[Base init][Base()][Hija init][Hija()]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLos bloques static aparecen solo la primera vez. En cada objeto, la parte de Base termina completa antes de que empiece la de Hija.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Persona {\n    Persona(String nombre) { }\n}\nclass Empleado extends Persona {\n    Empleado() { }\n}\npublic class Main {\n    public static void main(String[] args) { new Empleado(); }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eEmpleado()\u003c/code\u003e recibe un \u003ccode\u003esuper()\u003c/code\u003e implícito, pero Persona solo tiene un constructor con String. Se corrige con \u003ccode\u003esuper(\u0026quot;nombre\u0026quot;)\u003c/code\u003e como primera línea.\u003c/p\u003e\n","number":"02"},{"title":"Encapsulación y modificadores de acceso","html":"\u003cp\u003eEncapsular es ocultar los campos (\u003ccode\u003eprivate\u003c/code\u003e) y exponer métodos que controlan cómo se leen y modifican.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eModificador\u003c/th\u003e\n  \u003cth\u003eMisma clase\u003c/th\u003e\n  \u003cth\u003eMismo paquete\u003c/th\u003e\n  \u003cth\u003eSubclase en otro paquete\u003c/th\u003e\n  \u003cth\u003eCualquier clase\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eprivate\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e(sin modificador)\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eprotected\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí, a través de la herencia\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003epublic\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Producto {\n    private int precio;\n    int getPrecio() { return precio; }\n    void setPrecio(int precio) {\n        if (precio \u0026gt;= 0) this.precio = precio;\n    }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Producto p = new Producto();\n        p.setPrecio(50);\n        p.setPrecio(-10);\n        System.out.println(p.getPrecio());\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e50\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl setter rechaza el precio negativo. Escribir \u003ccode\u003ep.precio = -10\u003c/code\u003e desde Main no compilaría porque el campo es private.\u003c/p\u003e\n","number":"03"},{"title":"static: miembros de la clase","html":"\u003cp\u003eUn campo \u003ccode\u003estatic\u003c/code\u003e existe una sola vez y lo comparten todas las instancias. Un método \u003ccode\u003estatic\u003c/code\u003e no tiene \u003ccode\u003ethis\u003c/code\u003e: no puede usar campos ni métodos de instancia sin una referencia a un objeto.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Contador {\n    static int total = 0;\n    int propio = 0;\n    Contador() { total++; propio++; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Contador a = new Contador();\n        Contador b = new Contador();\n        System.out.println(Contador.total + \u0026quot; \u0026quot; + a.propio + \u0026quot; \u0026quot; + b.total);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e2 1 2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003etotal\u003c/code\u003e se incrementa en cada constructor y es el mismo para todos. \u003ccode\u003epropio\u003c/code\u003e es de cada objeto. \u003ccode\u003eb.total\u003c/code\u003e compila, pero lee el campo de la clase.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    int valor = 3;\n    public static void main(String[] args) {\n        System.out.print(valor);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003emain\u003c/code\u003e es static y \u003ccode\u003evalor\u003c/code\u003e pertenece a cada objeto. Se necesita \u003ccode\u003enew Main().valor\u003c/code\u003e.\u003c/p\u003e\n","number":"04"},{"title":"Herencia, sobrescritura y polimorfismo","html":"\u003cp\u003eUna subclase sobrescribe un método cuando declara la misma firma (nombre y parámetros). En ejecución, Java llama a la versión de la clase real del objeto, aunque la referencia sea de la superclase.\u003c/p\u003e\n\u003cp\u003eLos campos y los métodos \u003ccode\u003estatic\u003c/code\u003e no participan en ese mecanismo: se eligen según el tipo declarado de la referencia.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eLa sobrescritura no puede reducir la visibilidad (\u003ccode\u003epublic\u003c/code\u003e → sin modificador no compila).\u003c/li\u003e\n\u003cli\u003eEl tipo de retorno debe ser el mismo o un subtipo (retorno covariante).\u003c/li\u003e\n\u003cli\u003eNo puede declarar excepciones checked nuevas o más amplias que el método original.\u003c/li\u003e\n\u003cli\u003eUn método \u003ccode\u003efinal\u003c/code\u003e no se sobrescribe; una clase \u003ccode\u003efinal\u003c/code\u003e no se extiende.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003esuper.metodo()\u003c/code\u003e llama a la versión de la superclase.\u003c/li\u003e\n\u003cli\u003eUn cast de referencia compila si los tipos están relacionados, pero falla en ejecución con \u003ccode\u003eClassCastException\u003c/code\u003e si el objeto no es de ese tipo.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Animal {\n    String nombre = \u0026quot;animal\u0026quot;;\n    String sonido() { return \u0026quot;...\u0026quot;; }\n    static String tipo() { return \u0026quot;Animal\u0026quot;; }\n}\nclass Perro extends Animal {\n    String nombre = \u0026quot;perro\u0026quot;;\n    @Override String sonido() { return \u0026quot;guau\u0026quot;; }\n    static String tipo() { return \u0026quot;Perro\u0026quot;; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Animal a = new Perro();\n        System.out.println(a.sonido() + \u0026quot; \u0026quot; + a.nombre + \u0026quot; \u0026quot; + a.tipo());\n        System.out.println(((Perro) a).nombre);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eguau animal Animal\nperro\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003esonido()\u003c/code\u003e se despacha por el objeto real (Perro). \u003ccode\u003enombre\u003c/code\u003e y \u003ccode\u003etipo()\u003c/code\u003e se resuelven por el tipo declarado (Animal). Con el cast, el tipo declarado pasa a ser Perro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Animal { }\nclass Perro extends Animal { }\npublic class Main {\n    public static void main(String[] args) {\n        Animal a = new Animal();\n        Perro p = (Perro) a;\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eException in thread \u0026quot;main\u0026quot; java.lang.ClassCastException: Animal cannot be cast to Perro\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl compilador acepta el cast porque Perro es subclase de Animal. En ejecución el objeto es un Animal, no un Perro.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eclass Vehiculo {\n    public void arrancar() { }\n}\nclass Moto extends Vehiculo {\n    void arrancar() { }\n}\npublic class Main {\n    public static void main(String[] args) { }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa versión de Moto no tiene modificador (acceso de paquete), más restrictivo que public.\u003c/p\u003e\n","number":"05"},{"title":"Sobrecarga","html":"\u003cp\u003eSobrecargar es declarar varios métodos con el mismo nombre y distinta lista de parámetros. El compilador elige la versión usando los tipos declarados de los argumentos.\u003c/p\u003e\n\u003cp\u003eSi no hay coincidencia exacta, prueba en este orden: ampliación de primitivos (\u003ccode\u003ebyte\u003c/code\u003e → \u003ccode\u003eint\u003c/code\u003e), autoboxing (\u003ccode\u003eint\u003c/code\u003e → \u003ccode\u003eInteger\u003c/code\u003e) y, al final, varargs.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eCambiar solo el tipo de retorno no crea una sobrecarga: no compila.\u003c/li\u003e\n\u003cli\u003eCon \u003ccode\u003enull\u003c/code\u003e se elige el tipo más específico (String antes que Object). Si hay dos igual de específicos, la llamada es ambigua y no compila.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    static String f(int x) { return \u0026quot;int\u0026quot;; }\n    static String f(long x) { return \u0026quot;long\u0026quot;; }\n    static String f(Integer x) { return \u0026quot;Integer\u0026quot;; }\n    static String f(Object x) { return \u0026quot;Object\u0026quot;; }\n    static String f(int... x) { return \u0026quot;varargs\u0026quot;; }\n    public static void main(String[] args) {\n        byte b = 1;\n        Object o = \u0026quot;texto\u0026quot;;\n        System.out.println(f(b) + \u0026quot; \u0026quot; + f(5L) + \u0026quot; \u0026quot; + f(Integer.valueOf(5)) + \u0026quot; \u0026quot; + f(o) + \u0026quot; \u0026quot; + f());\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint long Integer Object varargs\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl byte se amplía a int antes de considerar boxing. \u003ccode\u003eo\u003c/code\u003e se declaró Object, así que se elige \u003ccode\u003ef(Object)\u003c/code\u003e aunque contenga un String.\u003c/p\u003e\n","number":"06"},{"title":"Clases abstractas e interfaces","html":"\u003cp\u003eUna clase \u003ccode\u003eabstract\u003c/code\u003e no se puede instanciar y puede tener métodos sin cuerpo. La primera clase concreta que la extienda debe implementarlos todos.\u003c/p\u003e\n\u003cp\u003eLos métodos abstractos de una interfaz son implícitamente \u003ccode\u003epublic abstract\u003c/code\u003e y sus campos \u003ccode\u003epublic static final\u003c/code\u003e. Desde Java 8 una interfaz también puede tener métodos \u003ccode\u003edefault\u003c/code\u003e (con cuerpo, se heredan) y \u003ccode\u003estatic\u003c/code\u003e (se llaman con el nombre de la interfaz y no se heredan).\u003c/p\u003e\n\u003cp\u003eSi una clase hereda dos \u003ccode\u003edefault\u003c/code\u003e con la misma firma, debe sobrescribir el método; puede elegir una versión con \u003ccode\u003eInterfaz.super.metodo()\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003einterface Saludo {\n    default String hola() { return \u0026quot;Hola\u0026quot;; }\n}\ninterface Bienvenida {\n    default String hola() { return \u0026quot;Bienvenido\u0026quot;; }\n}\nclass Recepcion implements Saludo, Bienvenida {\n    public String hola() { return Saludo.super.hola() + \u0026quot; y \u0026quot; + Bienvenida.super.hola(); }\n}\ninterface Util {\n    static int doble(int x) { return x * 2; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        System.out.println(new Recepcion().hola());\n        System.out.println(Util.doble(4));\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eHola y Bienvenido\n8\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSin el método \u003ccode\u003ehola()\u003c/code\u003e en Recepcion el código no compilaría por el conflicto entre los dos default.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003einterface Forma {\n    double area();\n}\nclass Cuadro implements Forma {\n    double area() { return 1; }\n}\npublic class Main {\n    public static void main(String[] args) { }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003earea()\u003c/code\u003e es public en la interfaz. La implementación debe declararse \u003ccode\u003epublic\u003c/code\u003e.\u003c/p\u003e\n","number":"07"},{"title":"Enums","html":"\u003cp\u003eUn enum define un conjunto fijo de constantes. Puede tener campos, constructores (siempre privados) y métodos.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003evalues()\u003c/code\u003e devuelve las constantes en orden; \u003ccode\u003eordinal()\u003c/code\u003e da la posición desde 0; \u003ccode\u003ename()\u003c/code\u003e y \u003ccode\u003etoString()\u003c/code\u003e dan el nombre.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003evalueOf(\u0026quot;TEXTO\u0026quot;)\u003c/code\u003e distingue mayúsculas y lanza \u003ccode\u003eIllegalArgumentException\u003c/code\u003e si no existe la constante.\u003c/li\u003e\n\u003cli\u003eEn un \u003ccode\u003ecase\u003c/code\u003e se escribe la constante sin el nombre del enum: \u003ccode\u003ecase MEDIANA:\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eenum Talla {\n    CHICA(1), MEDIANA(2), GRANDE(3);\n    private final int nivel;\n    Talla(int nivel) { this.nivel = nivel; }\n    int nivel() { return nivel; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Talla t = Talla.valueOf(\u0026quot;MEDIANA\u0026quot;);\n        System.out.println(t + \u0026quot; \u0026quot; + t.ordinal() + \u0026quot; \u0026quot; + t.nivel() + \u0026quot; \u0026quot; + Talla.values().length);\n        switch (t) {\n            case CHICA: System.out.println(\u0026quot;c\u0026quot;); break;\n            case MEDIANA: System.out.println(\u0026quot;m\u0026quot;); break;\n            default: System.out.println(\u0026quot;g\u0026quot;);\n        }\n        System.out.println(Talla.valueOf(\u0026quot;mediana\u0026quot;));\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMEDIANA 1 2 3\nm\nException in thread \u0026quot;main\u0026quot; java.lang.IllegalArgumentException: No enum constant Talla.mediana\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eordinal()\u003c/code\u003e es 1 porque MEDIANA es la segunda constante. La última línea falla: «mediana» no coincide en mayúsculas.\u003c/p\u003e\n","number":"08"},{"title":"String, StringBuilder, equals y final","html":"\u003cp\u003eString es inmutable: sus métodos devuelven un String nuevo. Si no se guarda el resultado, el original no cambia. StringBuilder sí se modifica a sí mismo.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e==\u003c/code\u003e compara referencias; \u003ccode\u003eequals\u003c/code\u003e compara contenido en String. Los literales iguales comparten el mismo objeto del pool; \u003ccode\u003enew String(...)\u003c/code\u003e crea otro.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003efinal\u003c/code\u003e en una variable impide reasignarla, pero el objeto al que apunta puede cambiar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eString a = \u0026quot;java\u0026quot;;\nString b = \u0026quot;java\u0026quot;;\nString c = new String(\u0026quot;java\u0026quot;);\nSystem.out.println((a == b) + \u0026quot; \u0026quot; + (a == c) + \u0026quot; \u0026quot; + a.equals(c));\nString s = \u0026quot;hola\u0026quot;;\ns.toUpperCase();\nSystem.out.println(s + \u0026quot; \u0026quot; + s.toUpperCase());\nStringBuilder sb = new StringBuilder(\u0026quot;ab\u0026quot;);\nsb.append(\u0026quot;c\u0026quot;).reverse();\nSystem.out.println(sb);\nfinal List\u0026lt;String\u0026gt; lista = new ArrayList\u0026lt;\u0026gt;();\nlista.add(\u0026quot;x\u0026quot;);\nSystem.out.println(lista);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003etrue false true\nhola HOLA\ncba\n[x]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003es.toUpperCase()\u003c/code\u003e sin asignar no modifica \u003ccode\u003es\u003c/code\u003e. StringBuilder se modifica en cada llamada. La lista final acepta \u003ccode\u003eadd\u003c/code\u003e; lo prohibido sería \u003ccode\u003elista = new ArrayList\u0026lt;\u0026gt;()\u003c/code\u003e.\u003c/p\u003e\n","number":"09"},{"title":"Optional y varargs","html":"\u003cp\u003e\u003ccode\u003eOptional\u003c/code\u003e representa un valor que puede faltar. \u003ccode\u003eOptional.of(x)\u003c/code\u003e exige un valor no nulo; \u003ccode\u003eOptional.ofNullable(x)\u003c/code\u003e acepta null y devuelve un Optional vacío.\u003c/p\u003e\n\u003cp\u003eUn parámetro varargs (\u003ccode\u003eString... xs\u003c/code\u003e) se recibe como arreglo, admite cero argumentos y debe ser el último.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003eorElse(valor)\u003c/code\u003e da una alternativa; \u003ccode\u003eget()\u003c/code\u003e sobre un Optional vacío lanza \u003ccode\u003eNoSuchElementException\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emap\u003c/code\u003e transforma el valor si existe y deja vacío un Optional vacío.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eOptional.of(null)\u003c/code\u003e lanza \u003ccode\u003eNullPointerException\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eOptional\u0026lt;String\u0026gt; vacio = Optional.ofNullable(null);\nOptional\u0026lt;String\u0026gt; nombre = Optional.of(\u0026quot;Ana\u0026quot;);\nSystem.out.println(vacio.isPresent() + \u0026quot; \u0026quot; + vacio.orElse(\u0026quot;sin nombre\u0026quot;));\nSystem.out.println(nombre.map(String::length).orElse(0) + \u0026quot; \u0026quot; + vacio.map(String::length).orElse(0));\nSystem.out.println(vacio.get());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003efalse sin nombre\n3 0\nException in thread \u0026quot;main\u0026quot; java.util.NoSuchElementException: No value present\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003emap\u003c/code\u003e sobre el vacío no ejecuta la función. \u003ccode\u003eget()\u003c/code\u003e sin valor lanza la excepción.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    static int contar(String... palabras) { return palabras.length; }\n    public static void main(String[] args) {\n        System.out.println(contar() + \u0026quot; \u0026quot; + contar(\u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;) + \u0026quot; \u0026quot; + contar(new String[] {\u0026quot;x\u0026quot;, \u0026quot;y\u0026quot;, \u0026quot;z\u0026quot;}));\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e0 2 3\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eVarargs acepta cero argumentos, varios sueltos o un arreglo ya construido.\u003c/p\u003e\n","number":"10"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSobrecarga\u003c/td\u003e\n  \u003ctd\u003eSobrescritura\u003c/td\u003e\n  \u003ctd\u003eSobrecarga: mismo nombre, otros parámetros, se decide al compilar. Sobrescritura: misma firma en la subclase, se decide al ejecutar.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eTipo declarado\u003c/td\u003e\n  \u003ctd\u003eClase real\u003c/td\u003e\n  \u003ctd\u003eEl tipo declarado decide qué compila, campos, static y sobrecarga; la clase real decide qué método sobrescrito se ejecuta.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003e==\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eequals\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e==\u003c/code\u003e compara referencias; \u003ccode\u003eequals\u003c/code\u003e puede comparar contenido.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003efinal\u003c/code\u003e variable\u003c/td\u003e\n  \u003ctd\u003eObjeto inmutable\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003efinal\u003c/code\u003e impide reasignar la variable, no modificar el objeto.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eClase abstracta\u003c/td\u003e\n  \u003ctd\u003eInterfaz\u003c/td\u003e\n  \u003ctd\u003eLa clase abstracta puede tener estado y constructores; una clase solo extiende una, pero implementa varias interfaces.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Qué tipo declarado tiene la referencia y qué clase real tiene el objeto?\u003c/li\u003e\n\u003cli\u003e¿Existe el método en el tipo declarado? Si no, no compila aunque exista en la subclase.\u003c/li\u003e\n\u003cli\u003e¿El constructor llama, explícita o implícitamente, a un \u003ccode\u003esuper(...)\u003c/code\u003e que existe?\u003c/li\u003e\n\u003cli\u003e¿Hay un método static usando miembros de instancia sin referencia?\u003c/li\u003e\n\u003cli\u003e¿La sobrescritura reduce visibilidad o cambia el retorno de forma incompatible?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Campo / método sobrescrito","Campo depende del tipo declarado; método del objeto real"],["static / instancia","Miembro de clase / miembro de objeto"],["overload / override","Resolución en compilación / despacho en ejecución"],["this() / super()","Deben ocupar la primera sentencia del constructor"],["final","Evita reasignar referencias, no mutar necesariamente objetos"]]},{"title":"Lambdas y clases anidadas","id":"lambdas-y-clases-anidadas","group":"Java 8 funcional","scope":"1Z0-808/809","icon":"lambda","intro":"Una lambda es una forma corta de escribir la implementación del único método abstracto de una interfaz funcional. Por sí sola no tiene tipo: lo toma del contexto (la variable o el parámetro al que se asigna), y ese tipo decide cuántos parámetros recibe, de qué tipo son y qué debe devolver.","sections":[{"title":"Qué es una lambda","html":"\u003cp\u003eUna interfaz funcional tiene exactamente un método abstracto. Puede tener métodos default y static, y los métodos públicos de Object (\u003ccode\u003eequals\u003c/code\u003e, \u003ccode\u003etoString\u003c/code\u003e) no cuentan. \u003ccode\u003e@FunctionalInterface\u003c/code\u003e hace que el compilador lo verifique.\u003c/p\u003e\n\u003cp\u003eUna lambda y una clase anónima pueden implementar la misma interfaz; la lambda es más breve.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e@FunctionalInterface\ninterface Operacion {\n    int aplicar(int a, int b);\n}\npublic class Main {\n    static int calcular(int a, int b, Operacion op) { return op.aplicar(a, b); }\n    public static void main(String[] args) {\n        Operacion suma = (a, b) -\u0026gt; a + b;\n        Operacion resta = new Operacion() {\n            public int aplicar(int a, int b) { return a - b; }\n        };\n        System.out.println(suma.aplicar(4, 3) + \u0026quot; \u0026quot; + resta.aplicar(4, 3) + \u0026quot; \u0026quot; + calcular(4, 3, (x, y) -\u0026gt; x * y));\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e7 1 12\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa misma interfaz implementada con una lambda, con una clase anónima y con una lambda pasada como argumento.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eObject o = () -\u0026gt; System.out.println(\u0026quot;hola\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eObject no es una interfaz funcional: la lambda no tiene tipo destino.\u003c/p\u003e\n","number":"01"},{"title":"Sintaxis válida e inválida","html":"\u003cp\u003eForma general: \u003ccode\u003e(parámetros) -\u0026gt; cuerpo\u003c/code\u003e. Con una expresión, su valor se devuelve sin \u003ccode\u003ereturn\u003c/code\u003e. Con llaves, el cuerpo es un bloque de sentencias: necesita \u003ccode\u003ereturn\u003c/code\u003e (si hay valor) y punto y coma.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eUn único parámetro sin tipo puede ir sin paréntesis: \u003ccode\u003es -\u0026gt; s.length()\u003c/code\u003e. Cero, varios o con tipo requieren paréntesis: \u003ccode\u003e() -\u0026gt; 1\u003c/code\u003e, \u003ccode\u003e(a, b) -\u0026gt; a + b\u003c/code\u003e, \u003ccode\u003e(String s) -\u0026gt; s.length()\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eO todos los parámetros llevan tipo o ninguno: \u003ccode\u003e(int x, y) -\u0026gt; x + y\u003c/code\u003e no compila.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ex -\u0026gt; { x + 1; }\u003c/code\u003e no compila: \u003ccode\u003ex + 1\u003c/code\u003e no es una sentencia. Debe ser \u003ccode\u003ex -\u0026gt; { return x + 1; }\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ex -\u0026gt; return x;\u003c/code\u003e no compila: \u003ccode\u003ereturn\u003c/code\u003e solo va dentro de llaves.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eFunction\u0026lt;String, Integer\u0026gt; a = s -\u0026gt; s.length();\nFunction\u0026lt;String, Integer\u0026gt; b = (String s) -\u0026gt; s.length();\nFunction\u0026lt;String, Integer\u0026gt; c = (s) -\u0026gt; { return s.length(); };\nBiFunction\u0026lt;Integer, Integer, Integer\u0026gt; d = (x, y) -\u0026gt; x * y;\nSupplier\u0026lt;String\u0026gt; e = () -\u0026gt; \u0026quot;listo\u0026quot;;\nRunnable f = () -\u0026gt; System.out.print(\u0026quot;[run] \u0026quot;);\nf.run();\nSystem.out.println(a.apply(\u0026quot;uno\u0026quot;) + \u0026quot; \u0026quot; + b.apply(\u0026quot;dos\u0026quot;) + \u0026quot; \u0026quot; + c.apply(\u0026quot;tres\u0026quot;) + \u0026quot; \u0026quot; + d.apply(2, 3) + \u0026quot; \u0026quot; + e.get());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[run] 3 3 4 6 listo\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eSeis formas válidas. Todas equivalen a implementar un método.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eBiFunction\u0026lt;Integer, Integer, Integer\u0026gt; f = (Integer x, y) -\u0026gt; x + y;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eMezcla un parámetro con tipo y otro sin tipo.\u003c/p\u003e\n","number":"02"},{"title":"Captura de variables","html":"\u003cp\u003eUna lambda puede usar variables locales del método que la contiene solo si son \u003ccode\u003efinal\u003c/code\u003e o efectivamente finales (nunca se reasignan, ni antes ni después de la lambda).\u003c/p\u003e\n\u003cp\u003eLos campos de instancia y static sí pueden modificarse, y el contenido de un objeto capturado también (agregar a una lista capturada es válido).\u003c/p\u003e\n\u003cp\u003eLos parámetros de la lambda no pueden repetir el nombre de una variable local visible.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.util.*;\n\npublic class Main {\n    private int contador = 0;\n    void ejecutar() {\n        String prefijo = \u0026quot;n=\u0026quot;;\n        List\u0026lt;String\u0026gt; registro = new ArrayList\u0026lt;\u0026gt;();\n        Runnable r = () -\u0026gt; {\n            contador++;\n            registro.add(prefijo + contador);\n        };\n        r.run();\n        r.run();\n        System.out.println(registro + \u0026quot; \u0026quot; + this.contador);\n    }\n    public static void main(String[] args) { new Main().ejecutar(); }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[n=1, n=2] 2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003econtador\u003c/code\u003e es un campo y puede cambiar. \u003ccode\u003eregistro\u003c/code\u003e no se reasigna; solo se modifica su contenido.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint total = 0;\nRunnable r = () -\u0026gt; System.out.print(total);\ntotal = 5;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa reasignación posterior hace que \u003ccode\u003etotal\u003c/code\u003e deje de ser efectivamente final.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint x = 1;\nFunction\u0026lt;Integer, Integer\u0026gt; f = x -\u0026gt; x + 1;\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl parámetro \u003ccode\u003ex\u003c/code\u003e choca con la variable local \u003ccode\u003ex\u003c/code\u003e.\u003c/p\u003e\n","number":"03"},{"title":"Referencias a métodos","html":"\u003cp\u003eUna referencia a método (\u003ccode\u003e::\u003c/code\u003e) es una lambda abreviada que solo llama a un método existente. Hay cuatro formas:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eForma\u003c/th\u003e\n  \u003cth\u003eEjemplo\u003c/th\u003e\n  \u003cth\u003eLambda equivalente\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMétodo static\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eInteger::parseInt\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003es -\u0026gt; Integer.parseInt(s)\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMétodo de un objeto concreto\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eSystem.out::println\u003c/code\u003e, \u003ccode\u003esaludo::concat\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ex -\u0026gt; System.out.println(x)\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMétodo de instancia de un tipo (el primer parámetro es el receptor)\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eString::length\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003es -\u0026gt; s.length()\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eConstructor\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eArrayList::new\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e() -\u0026gt; new ArrayList\u0026lt;\u0026gt;()\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eFunction\u0026lt;String, Integer\u0026gt; convertir = Integer::parseInt;\nFunction\u0026lt;String, Integer\u0026gt; largo = String::length;\nString saludo = \u0026quot;Hola, \u0026quot;;\nFunction\u0026lt;String, String\u0026gt; saludar = saludo::concat;\nBiFunction\u0026lt;String, String, Boolean\u0026gt; empieza = String::startsWith;\nSupplier\u0026lt;List\u0026lt;String\u0026gt;\u0026gt; nueva = ArrayList::new;\nList\u0026lt;String\u0026gt; lista = nueva.get();\nlista.add(saludar.apply(\u0026quot;Ana\u0026quot;));\nConsumer\u0026lt;Object\u0026gt; imprimir = System.out::println;\nimprimir.accept(convertir.apply(\u0026quot;42\u0026quot;) + largo.apply(\u0026quot;java\u0026quot;));\nimprimir.accept(lista + \u0026quot; \u0026quot; + empieza.apply(\u0026quot;java\u0026quot;, \u0026quot;ja\u0026quot;));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e46\n[Hola, Ana] true\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e42 + 4 se suma como números. En \u003ccode\u003eString::startsWith\u003c/code\u003e, el primer argumento («java») es el receptor y el segundo («ja») el parámetro.\u003c/p\u003e\n","number":"04"},{"title":"Clases anidadas","html":"\u003cp\u003eHay cuatro tipos de clases dentro de otra: anidada \u003ccode\u003estatic\u003c/code\u003e (no necesita instancia externa), interna o miembro (necesita una instancia externa y ve sus campos privados), local (declarada dentro de un método) y anónima (se declara y se instancia en una sola expresión).\u003c/p\u003e\n\u003cp\u003eUna clase interna se crea con \u003ccode\u003eexterna.new Interna()\u003c/code\u003e. Dentro de ella, \u003ccode\u003eExterna.this.campo\u003c/code\u003e accede al campo de la externa cuando hay un nombre repetido.\u003c/p\u003e\n\u003cp\u003eEn una lambda, \u003ccode\u003ethis\u003c/code\u003e es el objeto de la clase que la contiene. En una clase anónima, \u003ccode\u003ethis\u003c/code\u003e es la propia instancia anónima.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    private String nombre = \u0026quot;externa\u0026quot;;\n    static class Anidada {\n        String hola() { return \u0026quot;anidada estática\u0026quot;; }\n    }\n    class Interna {\n        private String nombre = \u0026quot;interna\u0026quot;;\n        String hola() { return nombre + \u0026quot; de \u0026quot; + Main.this.nombre; }\n    }\n    public static void main(String[] args) {\n        Main externa = new Main();\n        Main.Interna interna = externa.new Interna();\n        Main.Anidada anidada = new Main.Anidada();\n        Runnable anonima = new Runnable() {\n            @Override public void run() { System.out.println(\u0026quot;anónima sin nombre: \u0026quot; + getClass().getSimpleName().isEmpty()); }\n        };\n        System.out.println(interna.hola());\n        System.out.println(anidada.hola());\n        anonima.run();\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003einterna de externa\nanidada estática\nanónima sin nombre: true\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa anidada static se crea sin instancia externa; la interna necesita \u003ccode\u003eexterna.new\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epublic class Main {\n    class Interna { }\n    public static void main(String[] args) {\n        Interna i = new Interna();\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEn un método static no hay \u003ccode\u003ethis\u003c/code\u003e, y una clase interna necesita una instancia de Main.\u003c/p\u003e\n","number":"05"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ex -\u0026gt; x + 1\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ex -\u0026gt; { x + 1; }\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eLa expresión devuelve el valor; el bloque necesita \u003ccode\u003ereturn\u003c/code\u003e.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ethis\u003c/code\u003e en lambda\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ethis\u003c/code\u003e en clase anónima\u003c/td\u003e\n  \u003ctd\u003eObjeto externo contra la instancia anónima.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eClase anidada static\u003c/td\u003e\n  \u003ctd\u003eClase interna\u003c/td\u003e\n  \u003ctd\u003eLa interna necesita una instancia de la clase externa.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eString::length\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003etexto::length\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eEl primero recibe el String como parámetro; el segundo usa un String fijo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Cuál es el tipo destino y su método abstracto (parámetros, retorno, excepciones)?\u003c/li\u003e\n\u003cli\u003e¿Los paréntesis, tipos, llaves, \u003ccode\u003ereturn\u003c/code\u003e y \u003ccode\u003e;\u003c/code\u003e de la lambda son válidos?\u003c/li\u003e\n\u003cli\u003e¿Alguna variable local capturada se reasigna en algún punto?\u003c/li\u003e\n\u003cli\u003e¿Algún parámetro de la lambda repite el nombre de una variable local?\u003c/li\u003e\n\u003cli\u003eEn clases anidadas: ¿hay una instancia externa disponible?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Lambda","Exige tipo destino funcional"],["Captura","Variable local final o efectivamente final"],["String::length","El receptor es el primer argumento de la función"],["this","En lambda: contexto exterior; en clase anónima: instancia anónima"]]},{"title":"Interfaces funcionales","id":"interfaces-funcionales","group":"Java 8 funcional","scope":"1Z0-809","icon":"function","intro":"El paquete `java.util.function` trae interfaces funcionales listas para usar. No hace falta memorizarlas todas: basta con las cuatro básicas, sus variantes de dos argumentos y la regla para nombrar las primitivas. Para identificar cuál corresponde a una lambda, mira cuántos argumentos recibe y qué devuelve.","sections":[{"title":"Las cuatro básicas y sus variantes","html":"\u003cp\u003eCada una tiene un único método abstracto con un nombre distinto. Llamar al método equivocado (\u003ccode\u003esupplier.apply()\u003c/code\u003e) no compila.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eInterfaz\u003c/th\u003e\n  \u003cth\u003eMétodo\u003c/th\u003e\n  \u003cth\u003eRecibe\u003c/th\u003e\n  \u003cth\u003eDevuelve\u003c/th\u003e\n  \u003cth\u003eUso\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSupplier\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eget()\u003c/td\u003e\n  \u003ctd\u003enada\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eProducir un valor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eConsumer\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eaccept(T)\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003evoid\u003c/td\u003e\n  \u003ctd\u003eHacer algo con un valor\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eBiConsumer\u0026lt;T,U\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eaccept(T,U)\u003c/td\u003e\n  \u003ctd\u003eT, U\u003c/td\u003e\n  \u003ctd\u003evoid\u003c/td\u003e\n  \u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePredicate\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003etest(T)\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eboolean\u003c/td\u003e\n  \u003ctd\u003eEvaluar una condición\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eBiPredicate\u0026lt;T,U\u0026gt;\u003c/td\u003e\n  \u003ctd\u003etest(T,U)\u003c/td\u003e\n  \u003ctd\u003eT, U\u003c/td\u003e\n  \u003ctd\u003eboolean\u003c/td\u003e\n  \u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFunction\u0026lt;T,R\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapply(T)\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eR\u003c/td\u003e\n  \u003ctd\u003eTransformar\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eBiFunction\u0026lt;T,U,R\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapply(T,U)\u003c/td\u003e\n  \u003ctd\u003eT, U\u003c/td\u003e\n  \u003ctd\u003eR\u003c/td\u003e\n  \u003ctd\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eUnaryOperator\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapply(T)\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eFunction con entrada y salida del mismo tipo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eBinaryOperator\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapply(T,T)\u003c/td\u003e\n  \u003ctd\u003eT, T\u003c/td\u003e\n  \u003ctd\u003eT\u003c/td\u003e\n  \u003ctd\u003eCombinar dos valores del mismo tipo\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cul\u003e\n\u003cli\u003eNo existe BiSupplier: un Supplier no recibe argumentos.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSupplier\u0026lt;String\u0026gt; proveedor = () -\u0026gt; \u0026quot;dato\u0026quot;;\nConsumer\u0026lt;String\u0026gt; consumidor = s -\u0026gt; System.out.print(\u0026quot;[\u0026quot; + s + \u0026quot;]\u0026quot;);\nFunction\u0026lt;String, Integer\u0026gt; funcion = String::length;\nPredicate\u0026lt;String\u0026gt; predicado = s -\u0026gt; s.isEmpty();\nUnaryOperator\u0026lt;String\u0026gt; mayus = String::toUpperCase;\nBinaryOperator\u0026lt;Integer\u0026gt; mayor = (a, b) -\u0026gt; a \u0026gt; b ? a : b;\nBiFunction\u0026lt;String, Integer, String\u0026gt; repetir = (s, n) -\u0026gt; {\n    String r = \u0026quot;\u0026quot;;\n    for (int i = 0; i \u0026lt; n; i++) r += s;\n    return r;\n};\nconsumidor.accept(proveedor.get());\nSystem.out.println(\u0026quot; \u0026quot; + funcion.apply(\u0026quot;cuatro\u0026quot;) + \u0026quot; \u0026quot; + predicado.test(\u0026quot;\u0026quot;) + \u0026quot; \u0026quot; + mayus.apply(\u0026quot;abc\u0026quot;) + \u0026quot; \u0026quot; + mayor.apply(3, 8) + \u0026quot; \u0026quot; + repetir.apply(\u0026quot;ja\u0026quot;, 3));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[dato] 6 true ABC 8 jajaja\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCada variable se usa con el método de su interfaz: get, accept, apply y test.\u003c/p\u003e\n","number":"01"},{"title":"Componer funciones","html":"\u003cp\u003eVarias interfaces traen métodos default para combinarse sin escribir otra lambda.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ef.andThen(g)\u003c/code\u003e: primero f, después g con el resultado. \u003ccode\u003ef.compose(g)\u003c/code\u003e: primero g, después f.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eFunction.identity()\u003c/code\u003e devuelve su entrada.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ep.and(q)\u003c/code\u003e, \u003ccode\u003ep.or(q)\u003c/code\u003e (con cortocircuito) y \u003ccode\u003ep.negate()\u003c/code\u003e. En Java 8 no existe \u003ccode\u003ePredicate.not\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eConsumer.andThen\u003c/code\u003e ejecuta ambos consumidores con el mismo argumento, en orden.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eBiFunction\u003c/code\u003e tiene \u003ccode\u003eandThen\u003c/code\u003e (aplica una Function al resultado), pero no \u003ccode\u003ecompose\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eFunction\u0026lt;Integer, Integer\u0026gt; doble = x -\u0026gt; x * 2;\nFunction\u0026lt;Integer, Integer\u0026gt; masTres = x -\u0026gt; x + 3;\nSystem.out.println(doble.andThen(masTres).apply(5) + \u0026quot; \u0026quot; + doble.compose(masTres).apply(5));\nPredicate\u0026lt;String\u0026gt; largo = s -\u0026gt; s.length() \u0026gt; 3;\nPredicate\u0026lt;String\u0026gt; conA = s -\u0026gt; s.startsWith(\u0026quot;a\u0026quot;);\nSystem.out.println(largo.and(conA).test(\u0026quot;arbol\u0026quot;) + \u0026quot; \u0026quot; + largo.negate().test(\u0026quot;arbol\u0026quot;) + \u0026quot; \u0026quot; + largo.or(conA).test(\u0026quot;ave\u0026quot;));\nConsumer\u0026lt;StringBuilder\u0026gt; agregarX = sb -\u0026gt; sb.append(\u0026quot;x\u0026quot;);\nConsumer\u0026lt;StringBuilder\u0026gt; agregarY = sb -\u0026gt; sb.append(\u0026quot;y\u0026quot;);\nStringBuilder sb = new StringBuilder();\nagregarX.andThen(agregarY).andThen(agregarX).accept(sb);\nSystem.out.println(sb);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e13 16\ntrue false true\nxyx\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eandThen: 5 × 2 = 10, + 3 = 13. compose: 5 + 3 = 8, × 2 = 16. «ave» no es largo, pero sí empieza con
