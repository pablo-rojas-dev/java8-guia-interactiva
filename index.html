«a», así que el \u003ccode\u003eor\u003c/code\u003e da true.\u003c/p\u003e\n","number":"02"},{"title":"Interfaces para primitivos","html":"\u003cp\u003eExisten versiones para \u003ccode\u003eint\u003c/code\u003e, \u003ccode\u003elong\u003c/code\u003e y \u003ccode\u003edouble\u003c/code\u003e que evitan el boxing. El nombre indica qué cambia, y el método termina en \u003ccode\u003eAsInt\u003c/code\u003e, \u003ccode\u003eAsLong\u003c/code\u003e, \u003ccode\u003eAsDouble\u003c/code\u003e cuando devuelve un primitivo.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eInterfaz\u003c/th\u003e\n  \u003cth\u003eMétodo\u003c/th\u003e\n  \u003cth\u003eFirma\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntPredicate\u003c/td\u003e\n  \u003ctd\u003etest\u003c/td\u003e\n  \u003ctd\u003eint → boolean\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntFunction\u0026lt;R\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapply\u003c/td\u003e\n  \u003ctd\u003eint → R\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eToIntFunction\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eapplyAsInt\u003c/td\u003e\n  \u003ctd\u003eT → int\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntUnaryOperator\u003c/td\u003e\n  \u003ctd\u003eapplyAsInt\u003c/td\u003e\n  \u003ctd\u003eint → int\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntBinaryOperator\u003c/td\u003e\n  \u003ctd\u003eapplyAsInt\u003c/td\u003e\n  \u003ctd\u003e(int, int) → int\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntSupplier\u003c/td\u003e\n  \u003ctd\u003egetAsInt\u003c/td\u003e\n  \u003ctd\u003e() → int\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIntConsumer\u003c/td\u003e\n  \u003ctd\u003eaccept\u003c/td\u003e\n  \u003ctd\u003eint → void\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eBooleanSupplier\u003c/td\u003e\n  \u003ctd\u003egetAsBoolean\u003c/td\u003e\n  \u003ctd\u003e() → boolean\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDoubleSupplier\u003c/td\u003e\n  \u003ctd\u003egetAsDouble\u003c/td\u003e\n  \u003ctd\u003e() → double\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eIntPredicate par = n -\u0026gt; n % 2 == 0;\nIntUnaryOperator cuadrado = n -\u0026gt; n * n;\nIntBinaryOperator suma = (a, b) -\u0026gt; a + b;\nToIntFunction\u0026lt;String\u0026gt; largo = String::length;\nIntFunction\u0026lt;String\u0026gt; estrellas = n -\u0026gt; new String(new char[n]).replace('\\0', '*');\nDoubleSupplier pi = () -\u0026gt; 3.14;\nBooleanSupplier siempre = () -\u0026gt; true;\nSystem.out.println(par.test(4) + \u0026quot; \u0026quot; + cuadrado.applyAsInt(5) + \u0026quot; \u0026quot; + suma.applyAsInt(2, 3) + \u0026quot; \u0026quot; + largo.applyAsInt(\u0026quot;hola\u0026quot;) + \u0026quot; \u0026quot; + estrellas.apply(3) + \u0026quot; \u0026quot; + pi.getAsDouble() + \u0026quot; \u0026quot; + siempre.getAsBoolean());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003etrue 25 5 4 *** 3.14 true\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eIntFunction\u003c/code\u003e devuelve un objeto, por eso su método es \u003ccode\u003eapply\u003c/code\u003e. Las demás que devuelven primitivos usan \u003ccode\u003eapplyAsX\u003c/code\u003e o \u003ccode\u003egetAsX\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eIntSupplier s = () -\u0026gt; 1;\nSystem.out.println(s.get());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl método de IntSupplier es \u003ccode\u003egetAsInt()\u003c/code\u003e, no \u003ccode\u003eget()\u003c/code\u003e.\u003c/p\u003e\n","number":"03"},{"title":"Reconocer la interfaz por la forma de la lambda","html":"\u003cp\u003eCuando el examen pregunta qué interfaz acepta una lambda, cuenta los parámetros y mira si el cuerpo produce un valor, y de qué tipo.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003e() -\u0026gt; valor\u003c/code\u003e → Supplier. \u003ccode\u003ex -\u0026gt; { println(x); }\u003c/code\u003e → Consumer.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ex -\u0026gt; condición\u003c/code\u003e → Predicate. \u003ccode\u003ex -\u0026gt; otro valor\u003c/code\u003e → Function (o UnaryOperator si el tipo no cambia).\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003e(a, b) -\u0026gt; a + b\u003c/code\u003e con el mismo tipo → BinaryOperator; con tipos distintos → BiFunction.\u003c/li\u003e\n\u003cli\u003eUna lambda que devuelve un valor puede asignarse a un Consumer si su cuerpo es una llamada a método (el valor se descarta), pero no si es un valor suelto: \u003ccode\u003eConsumer\u0026lt;String\u0026gt; c = s -\u0026gt; s.length();\u003c/code\u003e compila; \u003ccode\u003eConsumer\u0026lt;String\u0026gt; c = s -\u0026gt; 5;\u003c/code\u003e no.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ePredicate\u0026lt;String\u0026gt; p = s -\u0026gt; s.length();\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUn Predicate debe devolver boolean y \u003ccode\u003es.length()\u003c/code\u003e es int.\u003c/p\u003e\n","number":"04"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eandThen\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ecompose\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ef.andThen(g)\u003c/code\u003e aplica f primero; \u003ccode\u003ef.compose(g)\u003c/code\u003e aplica g primero.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFunction\u0026lt;T,T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eUnaryOperator\u0026lt;T\u0026gt;\u003c/td\u003e\n  \u003ctd\u003eUn UnaryOperator es una Function, pero no al revés.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eget()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003egetAsInt()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eSupplier contra IntSupplier.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eapply\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eapplyAsInt\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eDevuelve objeto contra devuelve int.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Cuántos parámetros tiene la lambda y qué devuelve?\u003c/li\u003e\n\u003cli\u003e¿Se llama al método correcto de la interfaz (get, accept, test, apply, applyAsInt…)?\u003c/li\u003e\n\u003cli\u003eEn \u003ccode\u003eandThen\u003c/code\u003e/\u003ccode\u003ecompose\u003c/code\u003e, ¿cuál se aplica primero?\u003c/li\u003e\n\u003cli\u003e¿Se usa algo que no existe en Java 8, como \u003ccode\u003ePredicate.not\u003c/code\u003e?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Predicate\u003cT\u003e","test(T) → boolean"],["Function\u003cT,R\u003e","apply(T) → R"],["Consumer\u003cT\u003e","accept(T) → void"],["Supplier\u003cT\u003e","get() → T"],["andThen / compose","Primero la función actual / primero la función argumento"]]},{"title":"Streams y reducción","id":"streams-y-reduccion","group":"Java 8 funcional","scope":"1Z0-809","icon":"stream","intro":"Un stream describe una serie de pasos sobre una fuente de datos (colección, arreglo, rango). Se arma con operaciones intermedias, que solo preparan el recorrido, y termina con una operación terminal, que lo ejecuta y produce un resultado. Sin terminal no se procesa nada, y un stream ya usado no se puede volver a usar.","sections":[{"title":"Fuente, intermedias y terminal","html":"\u003cp\u003eFuentes comunes: \u003ccode\u003ecoleccion.stream()\u003c/code\u003e, \u003ccode\u003eStream.of(...)\u003c/code\u003e, \u003ccode\u003eArrays.stream(arreglo)\u003c/code\u003e, \u003ccode\u003eIntStream.range(a, b)\u003c/code\u003e (sin incluir b) y \u003ccode\u003erangeClosed(a, b)\u003c/code\u003e (incluye b). \u003ccode\u003eStream.iterate\u003c/code\u003e y \u003ccode\u003eStream.generate\u003c/code\u003e son infinitos y necesitan \u003ccode\u003elimit\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eLas intermedias son perezosas: se ejecutan cuando una terminal pide elementos. Cada elemento pasa por toda la cadena antes de que entre el siguiente.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eStream\u0026lt;String\u0026gt; s = Stream.of(\u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;, \u0026quot;c\u0026quot;).peek(x -\u0026gt; System.out.print(\u0026quot;[\u0026quot; + x + \u0026quot;]\u0026quot;));\nSystem.out.println(\u0026quot;antes de la terminal\u0026quot;);\nlong n = s.filter(x -\u0026gt; !x.equals(\u0026quot;b\u0026quot;)).count();\nSystem.out.println();\nSystem.out.println(n);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eantes de la terminal\n[a][b][c]\n2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl \u003ccode\u003epeek\u003c/code\u003e no imprime nada hasta que \u003ccode\u003ecount()\u003c/code\u003e recorre el stream.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eStream\u0026lt;Integer\u0026gt; s = Stream.of(1, 2, 3);\nSystem.out.println(s.count());\nSystem.out.println(s.count());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e3\nException in thread \u0026quot;main\u0026quot; java.lang.IllegalStateException: stream has already been operated upon or closed\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDespués de una terminal el stream queda consumido.\u003c/p\u003e\n","number":"01"},{"title":"Operaciones intermedias","html":"\u003cp\u003eDevuelven otro stream y pueden encadenarse.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eOperación\u003c/th\u003e\n  \u003cth\u003eQué hace\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003efilter(Predicate)\u003c/td\u003e\n  \u003ctd\u003eDeja pasar los elementos que cumplen la condición\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003emap(Function)\u003c/td\u003e\n  \u003ctd\u003eTransforma cada elemento en otro\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eflatMap(Function a Stream)\u003c/td\u003e\n  \u003ctd\u003eTransforma cada elemento en un stream y los une en uno\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003edistinct()\u003c/td\u003e\n  \u003ctd\u003eQuita duplicados (según equals)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003esorted() / sorted(Comparator)\u003c/td\u003e\n  \u003ctd\u003eOrdena (orden natural o el indicado)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003elimit(n) / skip(n)\u003c/td\u003e\n  \u003ctd\u003eToma los primeros n / descarta los primeros n\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003epeek(Consumer)\u003c/td\u003e\n  \u003ctd\u003eEjecuta una acción sin cambiar los elementos (útil para depurar)\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003emapToInt, mapToObj, boxed\u003c/td\u003e\n  \u003ctd\u003eCambian entre streams de objetos y de primitivos\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;String\u0026gt; palabras = Arrays.asList(\u0026quot;java\u0026quot;, \u0026quot;stream\u0026quot;, \u0026quot;lambda\u0026quot;, \u0026quot;java\u0026quot;, \u0026quot;api\u0026quot;);\nList\u0026lt;String\u0026gt; r = palabras.stream()\n    .distinct()\n    .filter(p -\u0026gt; p.length() \u0026gt; 3)\n    .map(String::toUpperCase)\n    .sorted(Comparator.reverseOrder())\n    .skip(1)\n    .limit(2)\n    .collect(Collectors.toList());\nSystem.out.println(r);\nList\u0026lt;List\u0026lt;Integer\u0026gt;\u0026gt; anidada = Arrays.asList(Arrays.asList(1, 2), Arrays.asList(3), Arrays.\u0026lt;Integer\u0026gt;asList());\nSystem.out.println(anidada.stream().flatMap(List::stream).map(x -\u0026gt; x * 10).collect(Collectors.toList()));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[LAMBDA, JAVA]\n[10, 20, 30]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003edistinct → java, stream, lambda, api; filter → java, stream, lambda; mayúsculas y orden inverso → STREAM, LAMBDA, JAVA; skip(1) y limit(2) → LAMBDA, JAVA. flatMap aplana las tres listas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eStream.of(1, 2, 3, 4, 5)\n    .filter(n -\u0026gt; { System.out.print(\u0026quot;f\u0026quot; + n + \u0026quot; \u0026quot;); return n % 2 == 1; })\n    .map(n -\u0026gt; { System.out.print(\u0026quot;m\u0026quot; + n + \u0026quot; \u0026quot;); return n * 10; })\n    .limit(2)\n    .forEach(n -\u0026gt; System.out.print(\u0026quot;=\u0026quot; + n + \u0026quot;|\u0026quot;));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ef1 m1 =10|f2 f3 m3 =30|\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCada elemento recorre toda la cadena antes del siguiente. Al obtener dos resultados, \u003ccode\u003elimit\u003c/code\u003e corta y 4 y 5 nunca se evalúan.\u003c/p\u003e\n","number":"02"},{"title":"Operaciones terminales","html":"\u003cp\u003eEjecutan el recorrido y devuelven un resultado que ya no es un stream (o void, en \u003ccode\u003eforEach\u003c/code\u003e).\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003ereduce(identidad, operación)\u003c/code\u003e devuelve un valor; \u003ccode\u003ereduce(operación)\u003c/code\u003e devuelve un \u003ccode\u003eOptional\u003c/code\u003e porque el stream podría estar vacío.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003emin\u003c/code\u003e, \u003ccode\u003emax\u003c/code\u003e, \u003ccode\u003efindFirst\u003c/code\u003e y \u003ccode\u003efindAny\u003c/code\u003e devuelven Optional.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eanyMatch\u003c/code\u003e, \u003ccode\u003eallMatch\u003c/code\u003e y \u003ccode\u003enoneMatch\u003c/code\u003e hacen cortocircuito. Con un stream vacío, \u003ccode\u003eallMatch\u003c/code\u003e y \u003ccode\u003enoneMatch\u003c/code\u003e dan true y \u003ccode\u003eanyMatch\u003c/code\u003e da false.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003ecount()\u003c/code\u003e devuelve long.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; nums = Arrays.asList(4, 8, 15, 16, 23, 42);\nSystem.out.println(nums.stream().reduce(0, Integer::sum));\nSystem.out.println(nums.stream().reduce(Integer::sum));\nSystem.out.println(nums.stream().max(Comparator.naturalOrder()).get() + \u0026quot; \u0026quot; + nums.stream().min(Integer::compare).get());\nSystem.out.println(nums.stream().filter(n -\u0026gt; n \u0026gt; 100).findFirst());\nSystem.out.println(nums.stream().anyMatch(n -\u0026gt; n % 2 == 1) + \u0026quot; \u0026quot; + nums.stream().allMatch(n -\u0026gt; n \u0026gt; 0) + \u0026quot; \u0026quot; + nums.stream().noneMatch(n -\u0026gt; n \u0026gt; 40));\nSystem.out.println(Stream.\u0026lt;Integer\u0026gt;empty().allMatch(n -\u0026gt; n \u0026gt; 100) + \u0026quot; \u0026quot; + Stream.\u0026lt;Integer\u0026gt;empty().anyMatch(n -\u0026gt; n \u0026gt; 100));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e108\nOptional[108]\n42 4\nOptional.empty\ntrue true false\ntrue false\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eObserva la diferencia entre las dos formas de reduce y el resultado de allMatch y anyMatch con un stream vacío.\u003c/p\u003e\n","number":"03"},{"title":"Collectors","html":"\u003cp\u003e\u003ccode\u003ecollect\u003c/code\u003e junta los elementos en una estructura. La clase \u003ccode\u003eCollectors\u003c/code\u003e ofrece las recetas comunes.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003etoList()\u003c/code\u003e, \u003ccode\u003etoSet()\u003c/code\u003e, \u003ccode\u003ejoining(separador, prefijo, sufijo)\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003etoMap(clave, valor)\u003c/code\u003e lanza \u003ccode\u003eIllegalStateException\u003c/code\u003e si dos elementos producen la misma clave; se evita con una función de mezcla: \u003ccode\u003etoMap(clave, valor, (a, b) -\u0026gt; a)\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003egroupingBy(clasificador)\u003c/code\u003e crea un \u003ccode\u003eMap\u0026lt;K, List\u0026lt;T\u0026gt;\u0026gt;\u003c/code\u003e; acepta un collector secundario como \u003ccode\u003ecounting()\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003epartitioningBy(predicado)\u003c/code\u003e crea un Map con las claves false y true, siempre ambas.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003eaveragingInt\u003c/code\u003e, \u003ccode\u003esummingInt\u003c/code\u003e, \u003ccode\u003ecounting\u003c/code\u003e calculan valores agregados.\u003c/li\u003e\n\u003cli\u003eEn Java 8 no existe \u003ccode\u003estream.toList()\u003c/code\u003e; se usa \u003ccode\u003ecollect(Collectors.toList())\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;String\u0026gt; nombres = Arrays.asList(\u0026quot;Ana\u0026quot;, \u0026quot;Beto\u0026quot;, \u0026quot;Alma\u0026quot;, \u0026quot;Carlos\u0026quot;, \u0026quot;Bea\u0026quot;);\nSystem.out.println(nombres.stream().collect(Collectors.joining(\u0026quot;, \u0026quot;, \u0026quot;[\u0026quot;, \u0026quot;]\u0026quot;)));\nSystem.out.println(nombres.stream().collect(Collectors.groupingBy(n -\u0026gt; n.charAt(0))));\nMap\u0026lt;Integer, Long\u0026gt; porLargo = nombres.stream().collect(Collectors.groupingBy(String::length, TreeMap::new, Collectors.counting()));\nSystem.out.println(porLargo);\nSystem.out.println(nombres.stream().collect(Collectors.partitioningBy(n -\u0026gt; n.length() \u0026gt; 3)));\nMap\u0026lt;String, Integer\u0026gt; largos = nombres.stream().collect(Collectors.toMap(n -\u0026gt; n, String::length));\nSystem.out.println(largos.get(\u0026quot;Carlos\u0026quot;) + \u0026quot; \u0026quot; + nombres.stream().collect(Collectors.averagingInt(String::length)));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[Ana, Beto, Alma, Carlos, Bea]\n{A=[Ana, Alma], B=[Beto, Bea], C=[Carlos]}\n{3=2, 4=2, 6=1}\n{false=[Ana, Bea], true=[Beto, Alma, Carlos]}\n6 4.0\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003egroupingBy con TreeMap y counting cuenta cuántos nombres hay de cada longitud. averagingInt siempre devuelve double.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eMap\u0026lt;Integer, String\u0026gt; porLargo = Stream.of(\u0026quot;uno\u0026quot;, \u0026quot;dos\u0026quot;, \u0026quot;tres\u0026quot;).collect(Collectors.toMap(String::length, s -\u0026gt; s));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eException in thread \u0026quot;main\u0026quot; java.lang.IllegalStateException: Duplicate key uno\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e«uno» y «dos» tienen longitud 3. Sin función de mezcla, toMap falla.\u003c/p\u003e\n","number":"04"},{"title":"Streams de primitivos","html":"\u003cp\u003e\u003ccode\u003eIntStream\u003c/code\u003e, \u003ccode\u003eLongStream\u003c/code\u003e y \u003ccode\u003eDoubleStream\u003c/code\u003e tienen \u003ccode\u003esum()\u003c/code\u003e, \u003ccode\u003eaverage()\u003c/code\u003e y \u003ccode\u003esummaryStatistics()\u003c/code\u003e. \u003ccode\u003eaverage()\u003c/code\u003e devuelve \u003ccode\u003eOptionalDouble\u003c/code\u003e; \u003ccode\u003emax()\u003c/code\u003e y \u003ccode\u003emin()\u003c/code\u003e devuelven \u003ccode\u003eOptionalInt\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eUn \u003ccode\u003eStream\u0026lt;Integer\u0026gt;\u003c/code\u003e no tiene \u003ccode\u003esum()\u003c/code\u003e: primero se convierte con \u003ccode\u003emapToInt\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSystem.out.println(IntStream.range(1, 5).sum() + \u0026quot; \u0026quot; + IntStream.rangeClosed(1, 5).sum());\nSystem.out.println(IntStream.of(3, 5, 10).average().getAsDouble() + \u0026quot; \u0026quot; + IntStream.empty().max());\nList\u0026lt;String\u0026gt; palabras = Arrays.asList(\u0026quot;sol\u0026quot;, \u0026quot;luna\u0026quot;, \u0026quot;mar\u0026quot;);\nIntSummaryStatistics st = palabras.stream().mapToInt(String::length).summaryStatistics();\nSystem.out.println(st.getSum() + \u0026quot; \u0026quot; + st.getMin() + \u0026quot; \u0026quot; + st.getMax() + \u0026quot; \u0026quot; + st.getAverage());\nSystem.out.println(IntStream.rangeClosed(1, 3).mapToObj(i -\u0026gt; \u0026quot;#\u0026quot; + i).collect(Collectors.joining()));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e10 15\n6.0 OptionalInt.empty\n10 3 4 3.3333333333333335\n#1#2#3\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003erange(1, 5)\u003c/code\u003e suma 1 a 4; \u003ccode\u003erangeClosed(1, 5)\u003c/code\u003e incluye el 5.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSystem.out.println(Stream.of(1, 2, 3).sum());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eStream\u0026lt;Integer\u0026gt; no tiene \u003ccode\u003esum()\u003c/code\u003e. Se escribe \u003ccode\u003eStream.of(1, 2, 3).mapToInt(n -\u0026gt; n).sum()\u003c/code\u003e.\u003c/p\u003e\n","number":"05"},{"title":"Trazar filter, map, distinct, sorted y collect","html":"\u003cp\u003eEscribe la secuencia después de cada operación intermedia. \u003ccode\u003efilter\u003c/code\u003e conserva elementos, \u003ccode\u003emap\u003c/code\u003e los transforma, \u003ccode\u003edistinct\u003c/code\u003e elimina duplicados y \u003ccode\u003esorted\u003c/code\u003e ordena. \u003ccode\u003ecollect\u003c/code\u003e y \u003ccode\u003ereduce\u003c/code\u003e son terminales.\u003c/p\u003e\n\u003cp\u003eEl orden de las operaciones importa: dos objetos diferentes pueden transformarse al mismo valor y solo entonces ser duplicados. Un stream se consume una vez y no debe reutilizarse tras su terminal.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; resultado = Stream.of(\u0026quot;bb\u0026quot;, \u0026quot;a\u0026quot;, \u0026quot;bb\u0026quot;, \u0026quot;ccc\u0026quot;, \u0026quot;a\u0026quot;)\n    .filter(s -\u0026gt; s.length() \u0026gt; 1)\n    .map(String::length)\n    .distinct()\n    .sorted()\n    .collect(Collectors.toList());\nSystem.out.println(resultado);\nSystem.out.println(resultado.stream().reduce(0, Integer::sum));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[2, 3]\n5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa traza es bb,bb,ccc → 2,2,3 → 2,3. collect genera una lista y un stream nuevo reduce esa lista.\u003c/p\u003e\n","number":"06"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003emap\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eflatMap\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eUno a uno contra uno a varios aplanados.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003epeek\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eforEach\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003epeek\u003c/code\u003e es intermedia y perezosa; \u003ccode\u003eforEach\u003c/code\u003e es terminal.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003elimit\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eTerminal\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003elimit\u003c/code\u003e es intermedia (de cortocircuito).\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ereduce(id, op)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003ereduce(op)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eValor contra Optional.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003erange(a, b)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003erangeClosed(a, b)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eExcluye b contra incluye b.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003egroupingBy\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003epartitioningBy\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eClaves calculadas contra solo true/false.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Hay operación terminal? Sin ella, las intermedias (y sus peek) no se ejecutan.\u003c/li\u003e\n\u003cli\u003e¿Se reutiliza un stream ya consumido, aunque sea por haber encadenado una intermedia?\u003c/li\u003e\n\u003cli\u003eSigue cada elemento por toda la cadena; atención a \u003ccode\u003elimit\u003c/code\u003e y a los cortocircuitos.\u003c/li\u003e\n\u003cli\u003e¿La terminal devuelve Optional, long u otro tipo?\u003c/li\u003e\n\u003cli\u003eEn \u003ccode\u003etoMap\u003c/code\u003e, ¿pueden repetirse claves?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["filter / map","Filtra / transforma"],["intermedia / terminal","Perezosa / dispara ejecución"],["findFirst / findAny","Orden de encuentro / cualquiera"],["map / flatMap","1→1 / aplana múltiples elementos"],["reduce / collect","Acumula valores / reúne resultados mutables"]]},{"title":"Concurrencia","id":"concurrencia","group":"Avanzado","scope":"1Z0-809","icon":"threads","intro":"Un hilo es una secuencia de ejecución independiente dentro del mismo programa. Varios hilos comparten la memoria de los objetos, así que el orden en que avanzan no está garantizado y el acceso a datos compartidos necesita sincronización. En el examen se pregunta sobre todo qué método crea un hilo, cuál espera, qué devuelve cada tarea y qué está garantizado frente a lo que solo es posible.","sections":[{"title":"Crear y esperar hilos","html":"\u003cp\u003eUn \u003ccode\u003eThread\u003c/code\u003e ejecuta un \u003ccode\u003eRunnable\u003c/code\u003e. \u003ccode\u003estart()\u003c/code\u003e crea el hilo nuevo y llama a \u003ccode\u003erun()\u003c/code\u003e desde él. Llamar a \u003ccode\u003erun()\u003c/code\u003e directamente es una llamada normal: se ejecuta en el hilo actual.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ejoin()\u003c/code\u003e bloquea el hilo actual hasta que el otro termina. \u003ccode\u003eThread.sleep(ms)\u003c/code\u003e pausa el hilo actual. Un hilo no puede iniciarse dos veces.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eSe puede extender \u003ccode\u003eThread\u003c/code\u003e y sobrescribir \u003ccode\u003erun()\u003c/code\u003e, o pasar un \u003ccode\u003eRunnable\u003c/code\u003e (lo habitual, admite lambda).\u003c/li\u003e\n\u003cli\u003eLa JVM termina cuando no quedan hilos no daemon vivos, aunque \u003ccode\u003emain\u003c/code\u003e ya haya terminado.\u003c/li\u003e\n\u003cli\u003e\u003ccode\u003einterrupt()\u003c/code\u003e solo pide al hilo que se detenga; el hilo debe revisarlo. Si está en \u003ccode\u003esleep\u003c/code\u003e o \u003ccode\u003ejoin\u003c/code\u003e, recibe \u003ccode\u003eInterruptedException\u003c/code\u003e.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eThread t = new Thread(() -\u0026gt; System.out.println(\u0026quot;en \u0026quot; + Thread.currentThread().getName()), \u0026quot;trabajador\u0026quot;);\nt.run();\nt.start();\nt.join();\nSystem.out.println(\u0026quot;main termina; vivo=\u0026quot; + t.isAlive());\nt.start();\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003een main\nen trabajador\nmain termina; vivo=false\nException in thread \u0026quot;main\u0026quot; java.lang.IllegalThreadStateException\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003erun()\u003c/code\u003e se ejecutó en main; \u003ccode\u003estart()\u003c/code\u003e, en el hilo «trabajador». \u003ccode\u003ejoin\u003c/code\u003e garantiza que el mensaje de trabajador aparezca antes. El segundo \u003ccode\u003estart()\u003c/code\u003e falla.\u003c/p\u003e\n","number":"01"},{"title":"Condiciones de carrera y synchronized","html":"\u003cp\u003e\u003ccode\u003econtador++\u003c/code\u003e no es atómico: lee, suma y escribe. Si dos hilos lo hacen a la vez, pueden leer el mismo valor y perder incrementos. El resultado sin sincronizar es variable y normalmente menor al esperado.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003esynchronized\u003c/code\u003e (en un método o en un bloque \u003ccode\u003esynchronized (objeto)\u003c/code\u003e) deja que solo un hilo a la vez entre con el mismo monitor. Dos bloques con monitores distintos no se excluyen entre sí. El monitor es reentrante: un hilo que ya lo tiene puede volver a entrar.\u003c/p\u003e\n\u003cp\u003eLas clases atómicas (\u003ccode\u003eAtomicInteger\u003c/code\u003e, \u003ccode\u003eAtomicLong\u003c/code\u003e) hacen esas operaciones de forma segura sin bloques synchronized. \u003ccode\u003evolatile\u003c/code\u003e solo garantiza visibilidad, no atomicidad.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.util.concurrent.atomic.AtomicInteger;\n\nclass Contador {\n    private int valor = 0;\n    synchronized void incrementar() { valor++; }\n    synchronized int valor() { return valor; }\n}\npublic class Main {\n    public static void main(String[] args) throws InterruptedException {\n        Contador c = new Contador();\n        AtomicInteger atomico = new AtomicInteger();\n        Runnable tarea = () -\u0026gt; {\n            for (int i = 0; i \u0026lt; 10_000; i++) {\n                c.incrementar();\n                atomico.incrementAndGet();\n            }\n        };\n        Thread a = new Thread(tarea);\n        Thread b = new Thread(tarea);\n        a.start();\n        b.start();\n        a.join();\n        b.join();\n        System.out.println(c.valor() + \u0026quot; \u0026quot; + atomico.get());\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e20000 20000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCon synchronized o AtomicInteger se cuentan los 20 000 incrementos. Sin ellos, el total podría ser menor y cambiar en cada ejecución.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eAtomicInteger n = new AtomicInteger(5);\nSystem.out.println(n.getAndIncrement() + \u0026quot; \u0026quot; + n.incrementAndGet() + \u0026quot; \u0026quot; + n.addAndGet(10) + \u0026quot; \u0026quot; + n.get());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e5 7 17 17\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003egetAndIncrement\u003c/code\u003e devuelve el valor anterior (como \u003ccode\u003en++\u003c/code\u003e); \u003ccode\u003eincrementAndGet\u003c/code\u003e y \u003ccode\u003eaddAndGet\u003c/code\u003e, el nuevo (como \u003ccode\u003e++n\u003c/code\u003e).\u003c/p\u003e\n","number":"02"},{"title":"ExecutorService, Callable y Future","html":"\u003cp\u003eUn \u003ccode\u003eExecutorService\u003c/code\u003e administra un grupo de hilos que ejecutan tareas. Se crea con \u003ccode\u003eExecutors\u003c/code\u003e: \u003ccode\u003enewSingleThreadExecutor()\u003c/code\u003e, \u003ccode\u003enewFixedThreadPool(n)\u003c/code\u003e, \u003ccode\u003enewCachedThreadPool()\u003c/code\u003e, \u003ccode\u003enewScheduledThreadPool(n)\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eexecute(Runnable)\u003c/code\u003e no devuelve nada. \u003ccode\u003esubmit(...)\u003c/code\u003e acepta Runnable o Callable y devuelve un \u003ccode\u003eFuture\u003c/code\u003e. \u003ccode\u003eFuture.get()\u003c/code\u003e espera el resultado (bloquea); con Runnable devuelve null.\u003c/p\u003e\n\u003cp\u003eSi la tarea lanza una excepción, \u003ccode\u003eget()\u003c/code\u003e lanza \u003ccode\u003eExecutionException\u003c/code\u003e y la original queda en \u003ccode\u003egetCause()\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eshutdown()\u003c/code\u003e deja de aceptar tareas nuevas pero termina las ya enviadas, sin esperar. \u003ccode\u003eawaitTermination\u003c/code\u003e espera. \u003ccode\u003eshutdownNow()\u003c/code\u003e intenta interrumpir las que corren. Enviar una tarea después de cerrar lanza \u003ccode\u003eRejectedExecutionException\u003c/code\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003e\u003c/th\u003e\n  \u003cth\u003eRunnable\u003c/th\u003e\n  \u003cth\u003eCallable\u0026lt;V\u0026gt;\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMétodo\u003c/td\u003e\n  \u003ctd\u003evoid run()\u003c/td\u003e\n  \u003ctd\u003eV call() throws Exception\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eDevuelve valor\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePuede lanzar checked\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eCon submit\u003c/td\u003e\n  \u003ctd\u003eFuture\u0026lt;?\u0026gt; (get da null)\u003c/td\u003e\n  \u003ctd\u003eFuture\u0026lt;V\u0026gt;\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eExecutorService pool = Executors.newFixedThreadPool(2);\ntry {\n    Future\u0026lt;Integer\u0026gt; suma = pool.submit(() -\u0026gt; 2 + 3);\n    Future\u0026lt;?\u0026gt; sinValor = pool.submit(() -\u0026gt; System.out.println(\u0026quot;runnable\u0026quot;));\n    System.out.println(sinValor.get());\n    System.out.println(suma.get());\n    Future\u0026lt;Integer\u0026gt; falla = pool.submit(() -\u0026gt; 10 / 0);\n    try {\n        falla.get();\n    } catch (ExecutionException e) {\n        System.out.println(\u0026quot;causa: \u0026quot; + e.getCause());\n    }\n    List\u0026lt;Callable\u0026lt;String\u0026gt;\u0026gt; tareas = Arrays.asList(() -\u0026gt; \u0026quot;a\u0026quot;, () -\u0026gt; \u0026quot;b\u0026quot;);\n    for (Future\u0026lt;String\u0026gt; f : pool.invokeAll(tareas)) System.out.print(f.get());\n    System.out.println();\n} finally {\n    pool.shutdown();\n}\nSystem.out.println(pool.isShutdown() + \u0026quot; \u0026quot; + pool.awaitTermination(1, TimeUnit.SECONDS));\ntry {\n    pool.submit(() -\u0026gt; \u0026quot;tarde\u0026quot;);\n} catch (RejectedExecutionException e) {\n    System.out.println(\u0026quot;rechazada\u0026quot;);\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003erunnable\nnull\n5\ncausa: java.lang.ArithmeticException: / by zero\nab\ntrue true\nrechazada\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003e() -\u0026gt; 2 + 3\u003c/code\u003e devuelve valor, así que es Callable. \u003ccode\u003e() -\u0026gt; System.out.println(...)\u003c/code\u003e no devuelve nada, así que es Runnable y su Future da null. El shutdown va en finally para no dejar hilos vivos.\u003c/p\u003e\n","number":"03"},{"title":"Colecciones concurrentes y CyclicBarrier","html":"\u003cp\u003eLas colecciones normales no son seguras con varios hilos. \u003ccode\u003eConcurrentHashMap\u003c/code\u003e permite lecturas y escrituras concurrentes (no acepta claves ni valores null). \u003ccode\u003eCopyOnWriteArrayList\u003c/code\u003e copia el arreglo en cada modificación: un recorrido ve una foto fija y no lanza \u003ccode\u003eConcurrentModificationException\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eCyclicBarrier(n, accion)\u003c/code\u003e hace esperar a los hilos que llaman \u003ccode\u003eawait()\u003c/code\u003e hasta que llegan n; entonces ejecuta la acción y los libera. Se puede reutilizar. Si el pool tiene menos hilos que n, los hilos esperan para siempre.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; lista = new CopyOnWriteArrayList\u0026lt;\u0026gt;(Arrays.asList(1, 2, 3));\nfor (Integer n : lista) {\n    lista.add(n * 10);\n}\nSystem.out.println(lista);\nMap\u0026lt;String, Integer\u0026gt; mapa = new ConcurrentHashMap\u0026lt;\u0026gt;();\nmapa.put(\u0026quot;a\u0026quot;, 1);\nmapa.merge(\u0026quot;a\u0026quot;, 5, Integer::sum);\nSystem.out.println(mapa);\nCyclicBarrier barrera = new CyclicBarrier(2, () -\u0026gt; System.out.println(\u0026quot;todos llegaron\u0026quot;));\nExecutorService pool = Executors.newFixedThreadPool(2);\nfor (int i = 0; i \u0026lt; 2; i++) {\n    pool.submit(() -\u0026gt; { barrera.await(); return null; });\n}\npool.shutdown();\npool.awaitTermination(1, TimeUnit.SECONDS);\nSystem.out.println(\u0026quot;fin\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[1, 2, 3, 10, 20, 30]\n{a=6}\ntodos llegaron\nfin\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl for-each recorre la copia original (1, 2, 3), por eso no entra en un ciclo infinito. La acción de la barrera corre cuando llega el segundo hilo.\u003c/p\u003e\n","number":"04"},{"title":"Problemas de vivacidad","html":"\u003cp\u003eAdemás de las condiciones de carrera, hay tres problemas clásicos:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eInterbloqueo (deadlock): dos hilos esperan cada uno un monitor que tiene el otro; ninguno avanza.\u003c/li\u003e\n\u003cli\u003eInanición (starvation): un hilo nunca obtiene el recurso porque otros lo acaparan.\u003c/li\u003e\n\u003cli\u003eLivelock: los hilos siguen activos, pero reaccionan entre sí sin avanzar.\u003c/li\u003e\n\u003cli\u003eCondición de carrera: el resultado depende del orden en que se intercalan los hilos.\u003c/li\u003e\n\u003c/ul\u003e\n","number":"05"},{"title":"Leer una tarea concurrente paso a paso","html":"\u003cp\u003e\u003ccode\u003eRunnable.run()\u003c/code\u003e no devuelve valor; \u003ccode\u003eCallable.call()\u003c/code\u003e devuelve un resultado y puede declarar excepciones checked. \u003ccode\u003esubmit\u003c/code\u003e entrega un \u003ccode\u003eFuture\u003c/code\u003e; \u003ccode\u003eget\u003c/code\u003e espera y recupera el resultado.\u003c/p\u003e\n\u003cp\u003eUna tarea enviada puede estar pendiente o ejecutándose: no supongas que terminó justo después de submit. \u003ccode\u003eshutdown\u003c/code\u003e impide nuevos envíos, pero no espera por sí solo a que todo termine.\u003c/p\u003e\n\u003cp\u003eSi la tarea falla, \u003ccode\u003eFuture.get()\u003c/code\u003e puede lanzar \u003ccode\u003eExecutionException\u003c/code\u003e; si se interrumpe la espera, \u003ccode\u003eInterruptedException\u003c/code\u003e. Usa finally para cerrar el ejecutor.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eExecutorService pool = Executors.newSingleThreadExecutor();\ntry {\n    Future\u0026lt;Integer\u0026gt; resultado = pool.submit(() -\u0026gt; 6 * 7);\n    System.out.println(resultado.get());\n} finally {\n    pool.shutdown();\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e42\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eget permite afirmar el resultado sin depender de que el hilo principal sea más lento que la tarea.\u003c/p\u003e\n","number":"06"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003estart()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003erun()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eCrea un hilo nuevo contra ejecutar en el hilo actual.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eshutdown()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eawaitTermination()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eDeja de aceptar tareas contra esperar a que terminen.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eexecute\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003esubmit\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eSin resultado contra Future.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003egetAndIncrement\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eincrementAndGet\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eValor anterior contra valor nuevo.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eConcurrencia\u003c/td\u003e\n  \u003ctd\u003eParalelismo\u003c/td\u003e\n  \u003ctd\u003eVarias tareas avanzan intercaladas; en paralelo corren a la vez en varios núcleos.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Se llama a \u003ccode\u003estart()\u003c/code\u003e o a \u003ccode\u003erun()\u003c/code\u003e? ¿Se inicia el mismo Thread dos veces?\u003c/li\u003e\n\u003cli\u003e¿Hay \u003ccode\u003ejoin()\u003c/code\u003e, \u003ccode\u003eget()\u003c/code\u003e o \u003ccode\u003eawaitTermination\u003c/code\u003e que garantice un orden? Si no, la salida puede variar.\u003c/li\u003e\n\u003cli\u003e¿La tarea es Runnable o Callable? ¿Qué devuelve \u003ccode\u003eget()\u003c/code\u003e?\u003c/li\u003e\n\u003cli\u003e¿Hay datos compartidos sin synchronized ni clases atómicas?\u003c/li\u003e\n\u003cli\u003e¿Se envían tareas después de \u003ccode\u003eshutdown()\u003c/code\u003e?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["start() / run()","Inicia hilo / ejecuta el método en el hilo actual"],["volatile","Visibilidad; no garantiza atomicidad de ++"],["submit / execute","submit devuelve Future; execute no"],["shutdown / shutdownNow","Deja finalizar pendientes / intenta interrumpir"],["synchronized","Monitor para exclusión y visibilidad"]]},{"title":"Streams paralelos","id":"streams-paralelos","group":"Avanzado","scope":"1Z0-809","icon":"parallel","intro":"Un stream paralelo divide la fuente en partes, las procesa en varios hilos (el ForkJoinPool común) y combina los resultados. Cambia cómo se ejecuta, no qué calcula: el resultado es el mismo que en secuencial solo si las operaciones respetan ciertas reglas. Tampoco garantiza que sea más rápido.","sections":[{"title":"Crear y consultar un stream paralelo","html":"\u003cp\u003e\u003ccode\u003ecoleccion.parallelStream()\u003c/code\u003e crea uno paralelo; \u003ccode\u003estream.parallel()\u003c/code\u003e convierte uno existente y \u003ccode\u003esequential()\u003c/code\u003e lo vuelve secuencial. \u003ccode\u003eisParallel()\u003c/code\u003e indica el modo.\u003c/p\u003e\n\u003cp\u003eEl modo aplica a todo el pipeline: si se llama a \u003ccode\u003eparallel()\u003c/code\u003e y luego a \u003ccode\u003esequential()\u003c/code\u003e, gana la última llamada.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; nums = Arrays.asList(1, 2, 3, 4);\nSystem.out.println(nums.stream().isParallel() + \u0026quot; \u0026quot; + nums.parallelStream().isParallel());\nStream\u0026lt;Integer\u0026gt; s = nums.stream().parallel().map(n -\u0026gt; n * 2).sequential();\nSystem.out.println(s.isParallel());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003efalse true\nfalse\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl último cambio de modo (\u003ccode\u003esequential\u003c/code\u003e) decide cómo se ejecuta todo el pipeline.\u003c/p\u003e\n","number":"01"},{"title":"Orden de encuentro","html":"\u003cp\u003eUna lista tiene un orden de encuentro; un HashSet no. En paralelo, \u003ccode\u003eforEach\u003c/code\u003e procesa los elementos en el orden en que terminan los hilos, que puede variar. \u003ccode\u003eforEachOrdered\u003c/code\u003e respeta el orden de encuentro.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ecollect(Collectors.toList())\u003c/code\u003e, \u003ccode\u003efindFirst()\u003c/code\u003e, \u003ccode\u003elimit\u003c/code\u003e y \u003ccode\u003esorted\u003c/code\u003e respetan el orden aunque el stream sea paralelo. \u003ccode\u003efindAny()\u003c/code\u003e puede devolver cualquier elemento.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; nums = IntStream.rangeClosed(1, 8).boxed().collect(Collectors.toList());\nnums.parallelStream().map(n -\u0026gt; n * 10).forEachOrdered(n -\u0026gt; System.out.print(\u0026quot;[\u0026quot; + n + \u0026quot;]\u0026quot;));\nSystem.out.println();\nSystem.out.println(nums.parallelStream().map(n -\u0026gt; n * 10).collect(Collectors.toList()));\nSystem.out.println(nums.parallelStream().filter(n -\u0026gt; n \u0026gt; 4).findFirst().get());\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[10][20][30][40][50][60][70][80]\n[10, 20, 30, 40, 50, 60, 70, 80]\n5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEstas tres salidas están garantizadas. Con \u003ccode\u003eforEach\u003c/code\u003e en lugar de \u003ccode\u003eforEachOrdered\u003c/code\u003e, el orden podría cambiar en cada ejecución; con \u003ccode\u003efindAny\u003c/code\u003e, podría salir cualquier número mayor que 4.\u003c/p\u003e\n","number":"02"},{"title":"Reducción correcta","html":"\u003cp\u003eEn paralelo, \u003ccode\u003ereduce\u003c/code\u003e aplica la identidad en cada parte y luego combina los resultados parciales. Para que el resultado sea el mismo que en secuencial, la operación debe ser asociativa (\u003ccode\u003e(a op b) op c == a op (b op c)\u003c/code\u003e) y la identidad neutra (\u003ccode\u003eidentidad op x == x\u003c/code\u003e).\u003c/p\u003e\n\u003cp\u003eLa suma con identidad 0 y la concatenación con \u0026quot;\u0026quot; cumplen. La resta no es asociativa. \u003ccode\u003ereduce(10, Integer::sum)\u003c/code\u003e da 10 + suma en secuencial, pero en paralelo suma 10 por cada parte: el resultado depende de cuántas partes se formen.\u003c/p\u003e\n\u003cp\u003eLa forma de tres argumentos, \u003ccode\u003ereduce(identidad, acumulador, combinador)\u003c/code\u003e, permite cambiar de tipo: el acumulador agrega un elemento a un parcial y el combinador une dos parciales.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;String\u0026gt; palabras = Arrays.asList(\u0026quot;uno\u0026quot;, \u0026quot;dos\u0026quot;, \u0026quot;tres\u0026quot;, \u0026quot;cuatro\u0026quot;);\nint letras = palabras.parallelStream().reduce(0, (total, p) -\u0026gt; total + p.length(), Integer::sum);\nSystem.out.println(letras);\nSystem.out.println(palabras.parallelStream().reduce(\u0026quot;\u0026quot;, String::concat));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e16\nunodostrescuatro\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa concatenación es asociativa y la lista tiene orden, así que el resultado coincide con el secuencial.\u003c/p\u003e\n","number":"03"},{"title":"Efectos laterales","html":"\u003cp\u003eModificar una colección externa desde un stream paralelo (por ejemplo \u003ccode\u003eforEach(lista::add)\u003c/code\u003e con un ArrayList) puede perder elementos o lanzar excepciones. Se usa \u003ccode\u003ecollect\u003c/code\u003e, que crea contenedores parciales por hilo y los combina.\u003c/p\u003e\n\u003cp\u003eSi se necesita un mapa compartido, \u003ccode\u003eCollectors.toConcurrentMap\u003c/code\u003e o \u003ccode\u003egroupingByConcurrent\u003c/code\u003e usan un ConcurrentMap.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; pares = IntStream.rangeClosed(1, 1000).parallel()\n    .filter(n -\u0026gt; n % 2 == 0)\n    .boxed()\n    .collect(Collectors.toList());\nSystem.out.println(pares.size() + \u0026quot; \u0026quot; + pares.get(0) + \u0026quot; \u0026quot; + pares.get(499));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e500 2 1000\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ecollect reúne los resultados de cada hilo sin perder elementos y respetando el orden.\u003c/p\u003e\n","number":"04"},{"title":"Identidad y asociatividad antes de calcular","html":"\u003cp\u003eEn \u003ccode\u003ereduce(identidad, operador)\u003c/code\u003e, la identidad debe dejar intacto cualquier elemento: para suma es 0 y para producto 1. La operación debe ser asociativa; la resta no lo es.\u003c/p\u003e\n\u003cp\u003eCon identidad 10 y suma, una reducción secuencial puede dar 10 + suma, pero en paralelo la identidad puede intervenir en varias particiones. No memorices un resultado dependiente de cómo se repartió el trabajo.\u003c/p\u003e\n\u003cp\u003eNo uses una lista compartida con add desde forEach paralelo. Usa collect con un colector adecuado. forEach no garantiza orden; forEachOrdered respeta el orden de encuentro cuando existe.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; datos = Arrays.asList(1, 2, 3, 4);\nSystem.out.println(datos.parallelStream().reduce(0, Integer::sum));\nSystem.out.println(datos.parallelStream().map(n -\u0026gt; n * 2).sorted().collect(Collectors.toList()));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e10\n[2, 4, 6, 8]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eLa identidad 0 y la suma cumplen el contrato; collect evita una lista externa compartida.\u003c/p\u003e\n","number":"05"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eforEach\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eforEachOrdered\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eSin orden garantizado en paralelo contra orden de encuentro.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003efindAny\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003efindFirst\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eCualquier elemento contra el primero en orden.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eparallelStream()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eparallel()\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eMétodo de Collection contra método de Stream.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eResultado posible\u003c/td\u003e\n  \u003ctd\u003eResultado garantizado\u003c/td\u003e\n  \u003ctd\u003eUna salida que puede ocurrir no es la respuesta si el contrato no la asegura.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Qué llamada final define el modo: \u003ccode\u003eparallel()\u003c/code\u003e o \u003ccode\u003esequential()\u003c/code\u003e?\u003c/li\u003e\n\u003cli\u003e¿La terminal respeta el orden (\u003ccode\u003eforEachOrdered\u003c/code\u003e, \u003ccode\u003efindFirst\u003c/code\u003e, \u003ccode\u003ecollect\u003c/code\u003e) o no (\u003ccode\u003eforEach\u003c/code\u003e, \u003ccode\u003efindAny\u003c/code\u003e)?\u003c/li\u003e\n\u003cli\u003eEn \u003ccode\u003ereduce\u003c/code\u003e, ¿la identidad es neutra y la operación asociativa?\u003c/li\u003e\n\u003cli\u003e¿Se modifica una colección externa desde el stream?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["forEach / forEachOrdered","Sin orden garantizado / conserva orden de encuentro cuando lo hay"],["findAny","No garantiza cuál valor devuelve"],["reduce","Identidad y operación asociativa"],["side effects","Evitar mutaciones compartidas no sincronizadas"]]},{"title":"Arrays, colecciones y genéricos","id":"arrays-colecciones-y-genericos","group":"Fundamentos","scope":"1Z0-808/809","icon":"collection","intro":"Un arreglo tiene tamaño fijo y puede guardar primitivos. Las colecciones (`List`, `Set`, `Map`) crecen según se necesita y guardan referencias a objetos; los primitivos entran mediante autoboxing (`int` → `Integer`). Cada interfaz tiene un contrato distinto sobre orden, duplicados y acceso, y los genéricos indican qué tipo de elementos acepta cada una.","sections":[{"title":"Arreglos","html":"\u003cp\u003eSe declaran como \u003ccode\u003eint[] a\u003c/code\u003e, \u003ccode\u003eint a[]\u003c/code\u003e o con inicializador \u003ccode\u003eint[] a = {1, 2}\u003c/code\u003e. \u003ccode\u003enew int[3]\u003c/code\u003e llena con valores por defecto. El tamaño se lee con el campo \u003ccode\u003elength\u003c/code\u003e (sin paréntesis).\u003c/p\u003e\n\u003cp\u003eLa clase \u003ccode\u003eArrays\u003c/code\u003e ofrece utilidades: \u003ccode\u003etoString\u003c/code\u003e, \u003ccode\u003esort\u003c/code\u003e, \u003ccode\u003ebinarySearch\u003c/code\u003e (solo en arreglos ordenados; si no encuentra el valor devuelve \u003ccode\u003e-(punto de inserción) - 1\u003c/code\u003e) y \u003ccode\u003easList\u003c/code\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003ccode\u003earreglo.length\u003c/code\u003e, \u003ccode\u003etexto.length()\u003c/code\u003e y \u003ccode\u003elista.size()\u003c/code\u003e: campo, método de String y método de colección.\u003c/li\u003e\n\u003cli\u003eUn arreglo bidimensional es un arreglo de arreglos y sus filas pueden tener distinto tamaño.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eint[] numeros = new int[3];\nString[] nombres = new String[2];\nint[][] tabla = {{1, 2}, {3, 4, 5}};\nSystem.out.println(Arrays.toString(numeros) + \u0026quot; \u0026quot; + Arrays.toString(nombres));\nSystem.out.println(tabla.length + \u0026quot; \u0026quot; + tabla[1].length + \u0026quot; \u0026quot; + tabla[1][2]);\nint[] desorden = {5, 1, 4};\nArrays.sort(desorden);\nSystem.out.println(Arrays.toString(desorden) + \u0026quot; \u0026quot; + Arrays.binarySearch(desorden, 4) + \u0026quot; \u0026quot; + Arrays.binarySearch(desorden, 3));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[0, 0, 0] [null, null]\n2 3 5\n[1, 4, 5] 1 -2\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl 3 no está; se insertaría en la posición 1, así que \u003ccode\u003ebinarySearch\u003c/code\u003e devuelve -1 - 1 = -2.\u003c/p\u003e\n","number":"01"},{"title":"List","html":"\u003cp\u003eUna \u003ccode\u003eList\u003c/code\u003e conserva el orden de inserción, permite duplicados y da acceso por índice desde 0. \u003ccode\u003eArrayList\u003c/code\u003e es la implementación habitual.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eremove\u003c/code\u003e está sobrecargado: \u003ccode\u003eremove(int)\u003c/code\u003e elimina por índice y \u003ccode\u003eremove(Object)\u003c/code\u003e elimina el primer elemento igual. Con \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e, \u003ccode\u003eremove(1)\u003c/code\u003e usa el índice; para quitar el valor 1 se escribe \u003ccode\u003eremove(Integer.valueOf(1))\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eArrays.asList\u003c/code\u003e devuelve una lista de tamaño fijo respaldada por el arreglo: permite \u003ccode\u003eset\u003c/code\u003e, pero \u003ccode\u003eadd\u003c/code\u003e y \u003ccode\u003eremove\u003c/code\u003e lanzan \u003ccode\u003eUnsupportedOperationException\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Integer\u0026gt; lista = new ArrayList\u0026lt;\u0026gt;(Arrays.asList(10, 20, 30, 20));\nlista.remove(1);\nlista.remove(Integer.valueOf(20));\nlista.add(0, 5);\nlista.set(1, 99);\nSystem.out.println(lista + \u0026quot; \u0026quot; + lista.size() + \u0026quot; \u0026quot; + lista.indexOf(30) + \u0026quot; \u0026quot; + lista.contains(20));\nList\u0026lt;String\u0026gt; fija = Arrays.asList(\u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;);\nfija.set(0, \u0026quot;z\u0026quot;);\nSystem.out.println(fija);\nfija.add(\u0026quot;c\u0026quot;);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[5, 99, 30] 3 2 false\n[z, b]\nException in thread \u0026quot;main\u0026quot; java.lang.UnsupportedOperationException\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePaso a paso: [10, 20, 30, 20] → quita índice 1 → [10, 30, 20] → quita el valor 20 → [10, 30] → agrega 5 al inicio → [5, 10, 30] → reemplaza índice 1 → [5, 99, 30].\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;String\u0026gt; nombres = new ArrayList\u0026lt;\u0026gt;(Arrays.asList(\u0026quot;Ana\u0026quot;, \u0026quot;Beto\u0026quot;, \u0026quot;Alma\u0026quot;));\nfor (String n : nombres) {\n    if (n.startsWith(\u0026quot;A\u0026quot;)) nombres.remove(n);\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eException in thread \u0026quot;main\u0026quot; java.util.ConcurrentModificationException\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNo se modifica una colección mientras se recorre con for-each. Se usa \u003ccode\u003enombres.removeIf(n -\u0026gt; n.startsWith(\u0026quot;A\u0026quot;))\u003c/code\u003e o \u003ccode\u003eIterator.remove()\u003c/code\u003e.\u003c/p\u003e\n","number":"02"},{"title":"Set y Map","html":"\u003cp\u003eUn \u003ccode\u003eSet\u003c/code\u003e no admite duplicados (según \u003ccode\u003eequals\u003c/code\u003e/\u003ccode\u003ehashCode\u003c/code\u003e): \u003ccode\u003eadd\u003c/code\u003e devuelve false si el elemento ya estaba. \u003ccode\u003eHashSet\u003c/code\u003e no garantiza orden, \u003ccode\u003eLinkedHashSet\u003c/code\u003e conserva el de inserción y \u003ccode\u003eTreeSet\u003c/code\u003e ordena.\u003c/p\u003e\n\u003cp\u003eUn \u003ccode\u003eMap\u003c/code\u003e asocia claves únicas con valores y no extiende \u003ccode\u003eCollection\u003c/code\u003e. \u003ccode\u003eput\u003c/code\u003e sobre una clave existente reemplaza el valor y devuelve el anterior; \u003ccode\u003eget\u003c/code\u003e de una clave ausente devuelve null. \u003ccode\u003eHashMap\u003c/code\u003e acepta una clave null; \u003ccode\u003eTreeMap\u003c/code\u003e no.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eMétodos de Java 8 en Map: \u003ccode\u003egetOrDefault\u003c/code\u003e, \u003ccode\u003eputIfAbsent\u003c/code\u003e, \u003ccode\u003emerge\u003c/code\u003e, \u003ccode\u003ecomputeIfAbsent\u003c/code\u003e, \u003ccode\u003eforEach\u003c/code\u003e.\u003c/li\u003e\n\u003cli\u003eEl orden natural de String pone las mayúsculas antes que las minúsculas («Z» \u0026lt; «a»).\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eSet\u0026lt;String\u0026gt; ordenado = new TreeSet\u0026lt;\u0026gt;(Arrays.asList(\u0026quot;pera\u0026quot;, \u0026quot;Manzana\u0026quot;, \u0026quot;uva\u0026quot;, \u0026quot;pera\u0026quot;));\nSystem.out.println(ordenado + \u0026quot; \u0026quot; + ordenado.add(\u0026quot;uva\u0026quot;));\nSet\u0026lt;String\u0026gt; insercion = new LinkedHashSet\u0026lt;\u0026gt;(Arrays.asList(\u0026quot;c\u0026quot;, \u0026quot;a\u0026quot;, \u0026quot;b\u0026quot;, \u0026quot;a\u0026quot;));\nSystem.out.println(insercion);\nMap\u0026lt;String, Integer\u0026gt; stock = new TreeMap\u0026lt;\u0026gt;();\nstock.put(\u0026quot;pan\u0026quot;, 3);\nSystem.out.println(stock.put(\u0026quot;pan\u0026quot;, 5) + \u0026quot; \u0026quot; + stock.get(\u0026quot;pan\u0026quot;) + \u0026quot; \u0026quot; + stock.get(\u0026quot;leche\u0026quot;));\nstock.merge(\u0026quot;pan\u0026quot;, 2, Integer::sum);\nstock.putIfAbsent(\u0026quot;leche\u0026quot;, 1);\nSystem.out.println(stock + \u0026quot; \u0026quot; + stock.getOrDefault(\u0026quot;queso\u0026quot;, 0));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[Manzana, pera, uva] false\n[c, a, b]\n3 5 null\n{leche=1, pan=7} 0\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eput\u003c/code\u003e devuelve el valor anterior (3). \u003ccode\u003emerge\u003c/code\u003e suma 2 al 5 existente. TreeMap ordena por clave.\u003c/p\u003e\n","number":"03"},{"title":"Ordenar: Comparable y Comparator","html":"\u003cp\u003e\u003ccode\u003eComparable\u0026lt;T\u0026gt;\u003c/code\u003e define el orden natural de una clase con \u003ccode\u003ecompareTo\u003c/code\u003e (negativo, cero o positivo). \u003ccode\u003eComparator\u0026lt;T\u0026gt;\u003c/code\u003e define un orden externo con \u003ccode\u003ecompare\u003c/code\u003e, útil para ordenar de varias formas.\u003c/p\u003e\n\u003cp\u003eJava 8 agrega \u003ccode\u003eComparator.comparing\u003c/code\u003e, \u003ccode\u003ethenComparing\u003c/code\u003e, \u003ccode\u003ereversed\u003c/code\u003e, \u003ccode\u003enaturalOrder\u003c/code\u003e y \u003ccode\u003ereverseOrder\u003c/code\u003e. Se ordena con \u003ccode\u003eCollections.sort(lista)\u003c/code\u003e o \u003ccode\u003elista.sort(comparador)\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.util.*;\n\nclass Producto implements Comparable\u0026lt;Producto\u0026gt; {\n    String nombre;\n    int precio;\n    Producto(String nombre, int precio) { this.nombre = nombre; this.precio = precio; }\n    public int compareTo(Producto otro) { return nombre.compareTo(otro.nombre); }\n    public String toString() { return nombre + \u0026quot;:\u0026quot; + precio; }\n}\npublic class Main {\n    public static void main(String[] args) {\n        List\u0026lt;Producto\u0026gt; ps = new ArrayList\u0026lt;\u0026gt;(Arrays.asList(\n            new Producto(\u0026quot;té\u0026quot;, 20), new Producto(\u0026quot;café\u0026quot;, 30), new Producto(\u0026quot;agua\u0026quot;, 20)));\n        Collections.sort(ps);\n        System.out.println(ps);\n        ps.sort(Comparator.comparing((Producto p) -\u0026gt; p.precio)\n            .thenComparing(p -\u0026gt; p.nombre, Comparator.reverseOrder()));\n        System.out.println(ps);\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e[agua:20, café:30, té:20]\n[té:20, agua:20, café:30]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePrimero por orden natural (nombre). Después por precio ascendente y, a igual precio, por nombre descendente.\u003c/p\u003e\n","number":"04"},{"title":"Genéricos y comodines","html":"\u003cp\u003eLos genéricos fijan en compilación el tipo de los elementos: \u003ccode\u003eList\u0026lt;String\u0026gt;\u003c/code\u003e no acepta un Integer y no requiere cast al leer. El operador diamante \u003ccode\u003e\u0026lt;\u0026gt;\u003c/code\u003e infiere el tipo a la derecha. No se usan primitivos: \u003ccode\u003eList\u0026lt;int\u0026gt;\u003c/code\u003e no compila.\u003c/p\u003e\n\u003cp\u003eLos genéricos son invariantes: \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e no es subtipo de \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e. Los comodines dan flexibilidad: \u003ccode\u003e? extends T\u003c/code\u003e sirve para leer como T (no se puede agregar), y \u003ccode\u003e? super T\u003c/code\u003e sirve para agregar T (al leer solo se obtiene Object).\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.util.*;\n\nclass Caja\u0026lt;T\u0026gt; {\n    private T valor;\n    Caja(T valor) { this.valor = valor; }\n    T get() { return valor; }\n}\npublic class Main {\n    static \u0026lt;T\u0026gt; T primero(List\u0026lt;T\u0026gt; lista) { return lista.get(0); }\n    static double sumar(List\u0026lt;? extends Number\u0026gt; numeros) {\n        double total = 0;\n        for (Number n : numeros) total += n.doubleValue();\n        return total;\n    }\n    static void llenar(List\u0026lt;? super Integer\u0026gt; destino) { destino.add(1); destino.add(2); }\n    public static void main(String[] args) {\n        Caja\u0026lt;String\u0026gt; c = new Caja\u0026lt;\u0026gt;(\u0026quot;hola\u0026quot;);\n        System.out.println(c.get().length() + \u0026quot; \u0026quot; + primero(Arrays.asList('x', 'y')));\n        List\u0026lt;Number\u0026gt; numeros = new ArrayList\u0026lt;\u0026gt;();\n        llenar(numeros);\n        System.out.println(numeros + \u0026quot; \u0026quot; + sumar(Arrays.asList(1, 2.5)));\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e4 x\n[1, 2] 3.5\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003ellenar\u003c/code\u003e acepta una lista de Number porque Number es supertipo de Integer. \u003ccode\u003esumar\u003c/code\u003e acepta cualquier lista de subtipos de Number.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;? extends Number\u0026gt; numeros = new ArrayList\u0026lt;Integer\u0026gt;();\nnumeros.add(1);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCon \u003ccode\u003e? extends Number\u003c/code\u003e el compilador no sabe si la lista es de Integer, Double u otro tipo, así que no permite agregar.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eTrampa\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eList\u0026lt;Number\u0026gt; numeros = new ArrayList\u0026lt;Integer\u0026gt;();\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eResultado\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eNo compila\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eAunque Integer es un Number, \u003ccode\u003eArrayList\u0026lt;Integer\u0026gt;\u003c/code\u003e no es un \u003ccode\u003eList\u0026lt;Number\u0026gt;\u003c/code\u003e.\u003c/p\u003e\n","number":"05"},{"title":"Arreglos y cadenas: contenido frente a identidad","html":"\u003cp\u003e\u003ccode\u003earreglo.toString()\u003c/code\u003e no lista sus elementos. Un \u003ccode\u003echar[]\u003c/code\u003e usa una representación como \u003ccode\u003e[C@...\u003c/code\u003e; el sufijo depende del hash y no se predice en el examen.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eArrays.toString(a)\u003c/code\u003e representa un arreglo con corchetes y separadores. \u003ccode\u003eArrays.deepToString(a)\u003c/code\u003e recorre arreglos anidados.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003enew String(char[])\u003c/code\u003e y \u003ccode\u003eString.valueOf(char[])\u003c/code\u003e forman texto a partir de caracteres. \u003ccode\u003etexto.toCharArray()\u003c/code\u003e produce un arreglo independiente. \u003ccode\u003eString.join\u003c/code\u003e une cadenas usando un separador.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eSystem.out.println(char[])\u003c/code\u003e tiene una sobrecarga que imprime caracteres, pero concatenarlo con un String usa la representación de objeto. Primero identifica qué sobrecarga se elige.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · dentro de main\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eString original = \u0026quot;java\u0026quot;;\nchar[] letras = original.toCharArray();\nletras[0] = 'J';\nSystem.out.println(original);\nSystem.out.println(new String(letras));\nSystem.out.println(Arrays.toString(letras));\nSystem.out.println(Arrays.deepToString(new int[][] {{1, 2}, {3}}));\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ejava\nJava\n[J, a, v, a]\n[[1, 2], [3]]\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEl String original conserva su contenido. Cada método representa los datos de una manera distinta.\u003c/p\u003e\n","number":"06"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eremove(int)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eremove(Object)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003ePor índice contra por valor.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eCollection\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eCollections\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eInterfaz contra clase de utilidades.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eArrays.asList\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003enew ArrayList\u0026lt;\u0026gt;(...)\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eTamaño fijo y respaldada por el arreglo, contra lista independiente.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eHashSet / HashMap\u003c/td\u003e\n  \u003ctd\u003eTreeSet / TreeMap\u003c/td\u003e\n  \u003ctd\u003eSin orden garantizado contra ordenados por clave.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003e? extends T\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003e? super T\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003ePara leer como T contra para agregar T.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Qué implementación es (Array, Linked, Hash, Tree) y qué orden garantiza?\u003c/li\u003e\n\u003cli\u003eEn \u003ccode\u003eList\u0026lt;Integer\u0026gt;\u003c/code\u003e, ¿\u003ccode\u003eremove\u003c/code\u003e recibe un int (índice) o un Integer (valor)?\u003c/li\u003e\n\u003cli\u003e¿La lista viene de \u003ccode\u003eArrays.asList\u003c/code\u003e y se intenta cambiar su tamaño?\u003c/li\u003e\n\u003cli\u003e¿Se modifica la colección dentro de un for-each?\u003c/li\u003e\n\u003cli\u003e¿El tipo genérico permite esa asignación o ese \u003ccode\u003eadd\u003c/code\u003e?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["Array / ArrayList","longitud fija / lista redimensionable"],["List / Set","Permite duplicados / no"],["Map","Claves a valores; no es Collection"],["? extends / ? super","Lectura flexible / escritura de subtipos compatibles"],["Comparable / Comparator","Orden natural / orden externo"]]},{"title":"Excepciones y recursos","id":"excepciones-y-recursos","group":"Fundamentos","scope":"1Z0-808/809","icon":"shield","intro":"Una excepción interrumpe el flujo normal y sube por la pila de llamadas hasta encontrar un `catch` compatible. El compilador solo exige manejar las excepciones checked; las demás se descubren al ejecutar. Por eso conviene leer en dos pasos: ¿compila el manejo de excepciones? y, si compila, ¿qué camino sigue la ejecución?","sections":[{"title":"Jerarquía: checked y unchecked","html":"\u003cp\u003e\u003ccode\u003eThrowable\u003c/code\u003e tiene dos ramas: \u003ccode\u003eError\u003c/code\u003e (problemas graves de la JVM, como \u003ccode\u003eStackOverflowError\u003c/code\u003e) y \u003ccode\u003eException\u003c/code\u003e. Dentro de Exception, \u003ccode\u003eRuntimeException\u003c/code\u003e y sus subclases son unchecked. El resto de Exception es checked.\u003c/p\u003e\n\u003cp\u003eRegla de «capturar o declarar»: si un método puede lanzar una checked, debe envolverla en try/catch o declararla con \u003ccode\u003ethrows\u003c/code\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eTipo\u003c/th\u003e\n  \u003cth\u003eChecked\u003c/th\u003e\n  \u003cth\u003eCausa típica\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eIOException, FileNotFoundException\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eEntrada/salida\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eSQLException\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eJDBC\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eException\u003c/td\u003e\n  \u003ctd\u003eSí\u003c/td\u003e\n  \u003ctd\u003eClase base general\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eArithmeticException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eDivisión entera entre cero\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNullPointerException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eUsar una referencia null\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eArrayIndexOutOfBoundsException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eÍndice fuera del arreglo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eClassCastException\u003c/td\u003e\n  \u003ctd\u003eNo\u003c/td\u003e\n  \u003ctd\u003eCast a un tipo que el objeto no es\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eNumberFormatException\u003c/t
