 ejecución."},{"id":"J8-234","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"cast y overflow","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"System.out.print((byte)(127+1));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"-128","explain":"128 convertido a byte se ajusta al rango de ocho bits, dando -128."},{"key":"B","text":"128","explain":"128 excede byte."},{"key":"C","text":"-129","explain":"-129 está fuera del rango byte."},{"key":"D","text":"ArithmeticException","explain":"El cast no lanza ArithmeticException."}],"answer":"A","general":"128 convertido a byte se ajusta al rango de ocho bits, dando -128."},{"id":"J8-235","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Operador condicional","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime y qué rama se ejecuta?","code":"boolean ok=false;System.out.print(ok?5:7);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"5","explain":"La condición false descarta el valor 5."},{"key":"B","text":"7","explain":"Se elige el valor 7."},{"key":"C","text":"No compila","explain":"Ambas ramas son del mismo tipo int."},{"key":"D","text":"12","explain":"El ternario escoge una sola rama, no suma valores."}],"answer":"B","general":"Se elige el valor 7."},{"id":"J8-236","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Override en constructor","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime al crear Hija?","code":"class Padre { Padre() { print(); } void print() { System.out.print(\"P\"); } }\nclass Hija extends Padre { int v=2; @Override void print() { System.out.print(v); } }\npublic class Main { public static void main(String[] args) { new Hija(); } }","codeContext":"Archivo Main.java completo","options":[{"key":"A","text":"2","explain":"El inicializador del campo v en Hija aún no se ejecuta cuando el constructor de Padre despacha al override."},{"key":"B","text":"0","explain":"El método sobrescrito ve el campo hijo con valor por defecto 0 durante la construcción de la base."},{"key":"C","text":"1","explain":"v=1 solo está en Padre y no es el campo usado."},{"key":"D","text":"No compila","explain":"La llamada virtual desde constructor base es legal, aunque arriesgada."}],"answer":"B","general":"El método sobrescrito ve el campo hijo con valor por defecto 0 durante la construcción de la base."},{"id":"J8-237","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Sobrecarga y null","type":"Codigo","difficulty":"Muy alta","question":"¿Qué invocación se selecciona?","code":"class A{void f(Object x){}void f(String x){}void f(Integer x){}}new A().f(null);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"f(Object)","explain":"String es candidato, pero no más específico que Integer."},{"key":"B","text":"f(String)","explain":"Integer también es candidato de la misma prioridad."},{"key":"C","text":"f(Integer)","explain":"Las dos sobrecargas con tipos incompatibles causan ambigüedad."},{"key":"D","text":"No compila","explain":"null es convertible a ambas clases hermanas y no hay método único más específico."}],"answer":"D","general":"null es convertible a ambas clases hermanas y no hay método único más específico."},{"id":"J8-238","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"StringBuilder capacidad","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"StringBuilder b=new StringBuilder(\"ab\");b.append(\"c\");System.out.print(b.length());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"3","explain":"capacity no se muestra aquí: length es el número real de caracteres."},{"key":"B","text":"4","explain":"Se añadieron 3 caracteres en total."},{"key":"C","text":"16","explain":"La capacidad interna no es longitud."},{"key":"D","text":"No compila","explain":"StringBuilder tiene length()."}],"answer":"A","general":"capacity no se muestra aquí: length es el número real de caracteres."},{"id":"J8-239","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Cadena internada","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"String a=\"x\";String b=new String(\"x\");System.out.print((a==b)+\" \"+(a==b.intern()));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"true true","explain":"new String crea referencia diferente a la del pool, por lo que a==b es false."},{"key":"B","text":"false true","explain":"b.intern() devuelve referencia canónica de \"x\", igual al literal a."},{"key":"C","text":"true false","explain":"intern hace que el segundo resultado sea true."},{"key":"D","text":"false false","explain":"El segundo resultado no es false."}],"answer":"B","general":"b.intern() devuelve referencia canónica de \"x\", igual al literal a."},{"id":"J8-240","scope":"1Z0-809","area":"Lambdas y clases anidadas","subtopic":"Captura de lista","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.util.List\u003cInteger\u003e xs=new java.util.ArrayList\u003c\u003e();xs.add(1);Runnable r=()-\u003exs.add(2);r.run();System.out.print(xs);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"[1, 2]","explain":"La referencia lista es efectivamente final y puede mutarse su contenido."},{"key":"B","text":"[1]","explain":"La lambda añade 2."},{"key":"C","text":"No compila","explain":"No se reasigna lista y la captura es legal."},{"key":"D","text":"ConcurrentModificationException","explain":"No se itera al mismo tiempo que se modifica."}],"answer":"A","general":"La referencia lista es efectivamente final y puede mutarse su contenido."},{"id":"J8-241","scope":"1Z0-809","area":"Lambdas y clases anidadas","subtopic":"Referencia de método","type":"Codigo","difficulty":"Muy alta","question": e duplicada","explain":"Dos cadenas tienen longitud 1; la colisión provoca IllegalStateException."},{"key":"C","text":"Genera {1=a,1=b}","explain":"Un Map no admite dos entradas con la misma clave."},{"key":"D","text":"No compila","explain":"El colector compila."}],"answer":"B","general":"Dos cadenas tienen longitud 1; la colisión provoca IllegalStateException."},{"id":"J8-244","scope":"1Z0-809","area":"Streams y reducción","subtopic":"Optional orElse","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.util.concurrent.atomic.AtomicInteger x=new java.util.concurrent.atomic.AtomicInteger();String r=java.util.Optional.of(\"OK\").orElse(\"ALT\"+x.incrementAndGet());System.out.print(r+x.get());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"OK1","explain":"orElse evalúa el argumento alternativo antes de entrar al método incluso con Optional presente."},{"key":"B","text":"OK0","explain":"incremento se ejecuta aunque el valor de Optional exista."},{"key":"C","text":"ALT1","explain":"No se utiliza ALT, ya que está presente OK."},{"key":"D","text":"ALT0","explain":"La variable contador cambia a 1."}],"answer":"A","general":"orElse evalúa el argumento alternativo antes de entrar al método incluso con Optional presente."},{"id":"J8-245","scope":"1Z0-809","area":"Streams y reducción","subtopic":"orElseGet perezoso","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.util.concurrent.atomic.AtomicInteger x=new java.util.concurrent.atomic.AtomicInteger();String r=java.util.Optional.of(\"OK\").orElseGet(()-\u003e\"ALT\"+x.incrementAndGet());System.out.print(r+x.get());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"ALT1","explain":"La alternativa no se usa al estar presente OK."},{"key":"B","text":"OK1","explain":"Supplier no se ejecuta, contador sigue 0."},{"key":"C","text":"OK0","explain":"orElseGet invoca el Supplier solo para Optional vacío."},{"key":"D","text":"No compila","explain":"El método admite Supplier\u003cString\u003e."}],"answer":"C","general":"orElseGet invoca el Supplier solo para Optional vacío."},{"id":"J8-246","scope":"1Z0-809","area":"Streams y reducción","subtopic":"toMap merge","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime el tamaño del mapa tras fusionar claves duplicadas por longitud?","code":"java.util.Map\u003cInteger,String\u003e m=java.util.stream.Stream.of(\"a\",\"b\",\"cc\").collect(java.util.stream.Collectors.toMap(String::length,s-\u003es,(x,y)-\u003ex+y));System.out.print(m.size());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"3","explain":"Las longitudes distintas son 1 y 2."},{"key":"B","text":"2","explain":"La función de merge permite que dos claves de longitud 1 coexistan combinadas en una sola entrada."},{"key":"C","text":"1","explain":"Hay dos claves, no una."},{"key":"D","text":"IllegalStateException","explain":"No hay error porque se proporciona función de combinación."}],"answer":"B","general":"La función de merge permite que dos claves de longitud 1 coexistan combinadas en una sola entrada."},{"id":"J8-247","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Covarianza de arreglos","type":"Codigo","difficulty":"Muy alta","question":"¿Qué sucede?","code":"Number[] a=new Integer[2];a[0]=3.5;","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"No compila","explain":"Number[] puede referirse a Integer[] por covarianza de arreglos."},{"key":"B","text":"ArrayStoreException","explain":"En tiempo de ejecución el arreglo real es Integer[]; no admite Double."},{"key":"C","text":"Guarda 3 en el arreglo","explain":"El array no cambia su tipo real."},{"key":"D","text":"ClassCastException","explain":"No es un cast de referencia; falla la asignación al array."}],"answer":"B","general":"En tiempo de ejecución el arreglo real es Integer[]; no admite Double."},{"id":"J8-248","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Comparación con StringBuilder","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"StringBuilder x=new StringBuilder(\"a\"),y=new StringBuilder(\"a\");System.out.print(x.equals(y));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"true","explain":"StringBuilder hereda equals(Object) basado en identidad, no comparación de contenido."},{"key":"B","text":"false","explain":"Dos builders distintos no son equals aunque tengan el mismo contenido."},{"key":"C","text":"No compila","explain":"Ambos objetos se pueden comparar por equals."},{"key":"D","text":"NullPointerException","explain":"No hay null."}],"answer":"B","general":"Dos builders distintos no son equals aunque tengan el mismo contenido."},{"id":"J8-249","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Collections.binarySearch","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime si el elemento buscado no existe?","code":"java.util.List\u003cInteger\u003e a=java.util.Arrays.asList(1,3,5);System.out.print(java.util.Collections.binarySearch(a,4));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"-3","explain":"Para lista [1,3,5] el 4 tendría insertion point 2 y resultado -3."},{"key":"B","text":"-2","explain":"-2 indicaría insertion point 1."},{"key":"C","text":"2","explain":"Una búsqueda no encontrada devuelve índice negativo codificado."},{"key":"D","text":"No compila","explain":"El método funciona sobre lista ordenada."}],"answer":"A","general":"Para lista [1,3,5] el 4 tendría insertion point 2 y resultado -3."},{"id":"J8-250","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Collections.sort","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.util.List\u003cInteger\u003e a=java.util.Arrays.asList(3,1,2);java.util.Collections.sort(a);System.out.print(a);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"[2, 1, 3]","explain":"Collections.sort puede reemplazar elementos de una lista fija creada con Arrays.asList."},{"key":"B","text":"[1, 2, 3]","explain":"El orden natural ascendente deja [1,2,3]."},{"key":"C","text":"[3, 2, 1]","explain":"No usa orden descendente."},{"key":"D","text":"UnsupportedOperationException","explain":"Arrays.asList admite set y ordenación, aunque no add."}],"answer":"B","general":"El orden natural ascendente deja [1,2,3]."},{"id":"J8-251","scope":"1Z0-809","area":"Concurrencia","subtopic":"Future resultado","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime después de get()?","code":"java.util.concurrent.ExecutorService e=java.util.concurrent.Executors.newSingleThreadExecutor();try{java.util.concurrent.Future\u003cInteger\u003e f=e.submit(()-\u003e7+1);System.out.print(f.get());}finally{e.shutdown();}","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"7","explain":"Callable retorna 8, no 7."},{"key":"B","text":"8","explain":"Future.get espera resultado de la tarea y devuelve 8."},{"key":"C","text":"null","explain":"El Callable no retorna null."},{"key":"D","text":"No compila","explain":"El código es válido usando ExecutorService de Java 8."}],"answer":"B","general":"Future.get espera resultado de la tarea y devuelve 8."},{"id":"J8-252","scope":"1Z0-809","area":"Concurrencia","subtopic":"AtomicInteger","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime después de dos llamadas?","code":"java.util.concurrent.atomic.AtomicInteger x=new java.util.concurrent.atomic.AtomicInteger(1);System.out.print(x.getAndIncrement()+\" \"+x.get());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"1 1","explain":"getAndIncrement devuelve valor anterior: 1, luego estado 2."},{"key":"B","text":"1 2","explain":"La impresión combina valor anterior 1 y estado final 2."},{"key":"C","text":"2 1","explain":"El primer retorno no es 2."},{"key":"D","text":"2 2","explain":"getAndIncrement no devuelve el valor actualizado."}],"answer":"B","general":"La impresión combina valor anterior 1 y estado final 2."},{"id":"J8-253","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"finally retorno","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"class X{int f(){try{return 1;}finally{return 2;}}}System.out.print(new X().f());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"1","explain":"El return de try no conserva el valor si finally también retorna."},{"key":"B","text":"2","explain":"El retorno de finally reemplaza al de try."},{"key":"C","text":"12","explain":"No se concatena ninguna cadena."},{"key":"D","text":"No compila","explain":"Java permite return dentro de finally."}],"answer":"B","general":"El retorno de finally reemplaza al de try."},{"id":"J8-254","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"catch y finally","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"try{System.out.print(\"T\");throw new IllegalArgumentException();}catch(IllegalArgumentException e){System.out.print(\"C\");}finally{System.out.print(\"F\");}","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"TCF","explain":"El try imprime T antes de lanzar, luego catch imprime C y finalmente F."},{"key":"B","text":"TF","explain":"Se omitiría catch incorrectamente."},{"key":"C","text":"CF","explain":"Se omite T antes de lanzar."},{"key":"D","text":"C","explain":"finally también se ejecuta."}],"answer":"A","general":"El try imprime T antes de lanzar, luego catch imprime C y finalmente F."},{"id":"J8-255","scope":"1Z0-809","area":"Fechas y horas Java 8","subtopic":"plusMonths fin de mes","type":"Codigo","difficulty":"Muy alta","question":"¿Qué fecha imprime?","code":"System.out.print(java.time.LocalDate.of(2023,1,31).plusMonths(1));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"2023-03-03","explain":"plusMonths ajusta a fin del mes destino, no transporta días sobrantes."},{"key":"B","text":"2023-02-31","explain":"Febrero no tiene día 31."},{"key":"C","text":"2023-02-28","explain":"Febrero de 2023 termina el 28."},{"key":"D","text":"DateTimeException","explain":"No arroja DateTimeException por este ajuste."}],"answer":"C","general":"Febrero de 2023 termina el 28."},{"id":"J8-256","scope":"1Z0-809","area":"Fechas y horas Java 8","subtopic":"LocalTime rollover","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"System.out.print(java.time.LocalTime.of(23,59).plusMinutes(2));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"24:01","explain":"LocalTime envuelve al cruzar la medianoche, no usa hora 24."},{"key":"B","text":"00:01","explain":"Dos minutos después de 23:59 es 00:01."},{"key":"C","text":"23:61","explain":"Minuto 61 no existe."},{"key":"D","text":"DateTimeException","explain":"La suma es válida."}],"answer":"B","general":"Dos minutos después de 23:59 es 00:01."},{"id":"J8-257","scope":"1Z0-809","area":"Entrada/salida y NIO.2","subtopic":"Path normalize código","type":"Codigo","difficulty":"Muy alta","question":"En Unix, ¿qué imprime?","code":"System.out.print(java.nio.file.Paths.get(\"a/b/../c\").normalize());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"a/b/c","explain":"b/.. se cancela en normalización léxica."},{"key":"B","text":"a/c","explain":"El resultado preserva a y c."},{"key":"C","text":"c","explain":"a no desaparece."},{"key":"D","text":"No compila","explain":"Path.normalize existe en Java 8."}],"answer":"B","general":"El resultado preserva a y c."},{"id":"J8-258","scope":"1Z0-809","area":"Entrada/salida y NIO.2","subtopic":"BufferedReader EOF","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.io.BufferedReader r=new java.io.BufferedReader(new java.io.StringReader(\"\"));System.out.print(r.readLine());","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"null","explain":"El primer readLine encuentra EOF y retorna null."},{"key":"B","text":"\"\" (cadena vacía)","explain":"No hay línea vacía en una fuente de cero caracteres."},{"key":"C","text":"-1","explain":"-1 es de read() individual."},{"key":"D","text":"IOException","explain":"EOF no implica IOException."}],"answer":"A","general":"El primer readLine encuentra EOF y retorna null."},{"id":"J8-259","scope":"Complementario","area":"Acceso a bases de datos con JDBC","subtopic":"Tres valores y SQL","type":"Teorica","difficulty":"Muy alta","question":"En SQL, ¿qué filas supera WHERE salario \u003c\u003e 100 si salario contiene (100, 200, NULL)?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Solo 200","explain":"200 produce true en \u003c\u003e 100; 100 false y NULL UNKNOWN."},{"key":"B","text":"200 y NULL","explain":"NULL no cumple el predicado."},{"key":"C","text":"100 y NULL","explain":"100 falla la desigualdad."},{"key":"D","text":"Las tres","explain":"Hay filas excluidas. "}],"answer":"A","general":"200 produce true en \u003c\u003e 100; 100 false y NULL UNKNOWN."},{"id":"J8-260","scope":"Complementario","area":"Acceso a bases de datos con JDBC","subtopic":"PreparedStatement JDBC","type":"Teorica","difficulty":"Muy alta","question":"Se prepara SELECT * FROM t WHERE id=? y se llama ps.setInt(0,5). ¿Cuál diagnóstico es correcto?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Se vincula primer parámetro","explain":"El índice 0 no es un parámetro JDBC válido."},{"key":"B","text":"Es índice inválido; JDBC empieza en 1","explain":"Los marcadores inician en 1, el driver reportará error."},{"key":"C","text":"Se convierte en columna cero","explain":"No se utiliza para columnas en este método."},{"key":"D","text":"Siempre se ejecuta UPDATE","explain":"La sentencia es SELECT. "}],"answer":"B","general":"Los marcadores inician en 1, el driver reportará error."}],"references":[{"label":"Oracle Java SE 8 — Tutorials, Lambda y APIs","url":"https://docs.oracle.com/javase/tutorial/extra/certification/javase-8-upgrade.html"},{"label":"Oracle University — catálogo de certificaciones","url":"https://www.oracle.com/a/ocom/docs/ou-certification-catalog.pdf"},{"label":"OCA Java SE 8 — índice de objetivos","url":"https://www.oreilly.com/library/view/oca-java-se/9781260011388/contents.html"},{"label":"OCP Java SE 8 — índice de objetivos","url":"https://www.wiley.com/en-us/ocp-oracle-certified-professional-java-se-8-programmer-ii-study-guide-exam-1z0-809-p-9781119067894"}]}</script>
<script>
(()=>{'use strict';
const DATA=JSON.parse(document.querySelector('#study-data').textContent);
const CH=DATA.chapters, QS=DATA.questions, BY_ID=Object.fromEntries(CH.map(x=>[x.id,x]));
const STORE='java8-academy-v1';
const DEFAULT={done:{},history:[],session:null};
let canSave=true;let state=readSaved();let view='home',activeLesson=null,libraryGroup='Todos',search='',quizFilter={scope:'Todos',area:'Todos',type:'Todos',mode:'study',count:'10'},resultSession=null,toastTimer=null;
function readSaved(){try{const v=localStorage.getItem(STORE);if(v){const x=JSON.parse(v);if(x&&typeof x==='object'&&x.done&&Array.isArray(x.history))return {...DEFAULT,...x};}}catch(e){canSave=false;}return structuredCopy(DEFAULT);}
function structuredCopy(o){return JSON.parse(JSON.stringify(o));}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));canSave=true;}catch(e){canSave=false;}const el=document.querySelector('#saveStatus');if(el)el.textContent=canSave?'Progreso guardado en este navegador':'Exporta el progreso para conservarlo';}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function inline(x){return esc(x).replace(/`([^`]+)`/g,'<code>$1</code>');}
function clip(s,n){return s.length>n?s.slice(0,n-1).trim()+'…':s;}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function shortDate(iso){try{return new Date(iso).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return '—';}}
function pct(a,b){return b?Math.round(a*100/b):0;}
function questionCount(area){return QS.filter(q=>q.area===area).length;}
function doneCount(c){return c.sections.reduce((n,_,i)=>n+(state.done[c.id+':'+i]?1:0),0);}
function overallDone(){return CH.reduce((a,c)=>a+doneCount(c),0);}
function allSections(){return CH.reduce((a,c)=>a+c.sections.length,0);}
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2300);}
function colorCode(raw,lang='java'){
 const regex=/("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\/\/[^\n]*|\/\*[\s\S]*?\*\/|@[A-Za-z_][\w]*|\b(?:public|private|protected|static|final|abstract|class|interface|enum|extends|implements|void|new|return|throw|throws|try|catch|finally|if|else|switch|case|default|break|continue|for|while|do|instanceof|synchronized|volatile|transient|native|assert|package|import|this|super|true|false|null|int|long|double|float|char|boolean|byte|short|SELECT|FROM|WHERE|JOIN|INNER|LEFT|RIGHT|GROUP|BY|HAVING|ORDER|DESC|ASC|NULL|NOT|AND|OR|AS|INSERT|UPDATE|DELETE|INTO|VALUES)\b|\b[A-Z][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?[fFdDlL]?\b)/g;
 let out='',last=0;for(const m of raw.matchAll(regex)){const idx=m.index;out+=esc(raw.slice(last,idx));const v=m[0];let cl;if(v.startsWith('"')||v.startsWith("'"))cl='tok-str';else if(v.startsWith('//')||v.startsWith('/*'))cl='tok-comment';else if(v.startsWith('@'))cl='tok-ann';else if(/^\d/.test(v))cl='tok-num';else if(/^[A-Z][a-z]/.test(v))cl='tok-type';else cl='tok-key';out+='<span class="'+cl+'">'+esc(v)+'</span>';last=idx+v.length;}out+=esc(raw.slice(last));return out;
}
function highlightProse(root){root.querySelectorAll('pre code').forEach(el=>{if(el.dataset.highlighted)return;el.dataset.highlighted='yes';el.innerHTML=colorCode(el.textContent);});}
function progressBar(val,wide=false){return '<div class="progress-track '+(wide?'track-wide':'')+'"><div class="progress-fill" style="width:'+Math.min(100,Math.max(0,val))+'%"></div></div>';}
function groupScope(group){return group==='Complementario'?'Complementario':group==='Fundamentos'?'1Z0-808 / 809':'1Z0-809';}
function cardChapter(c){const d=doneCount(c),total=c.sections.length,p=pct(d,total);return `<article class="card lesson-card"><div class="module-top"><span class="circle-icon">${icon(c.icon)}</span><span class="tag ${c.group==='Complementario'?'compl':'scope'}">${esc(c.scope)}</span></div><div><div class="group-label">${esc(c.group)} · ${total} apartados</div><h3>${esc(c.title)}</h3></div><p>${esc(clip(c.intro.replace(/`/g,''),170))}</p><div class="module-bottom"><span>${questionCount(c.title)} preguntas</span><strong>${p}% visto</strong></div>${progressBar(p)}<button class="btn soft sm block" data-lesson="${esc(c.id)}">Abrir módulo ↗</button></article>`;}
function groupChapters(group){return CH.filter(c=>group==='Todos'||c.group===group);}
function icon(x){return ({terminal:'⌘',boxes:'⬡',lambda:'λ',function:'ƒ',stream:'≋',threads:'☷',parallel:'⇉',collection:'▦',shield:'◇',database:'▤',workflow:'◇',check:'✓',globe:'◎',calendar:'▣',folder:'▥'})[x]||'•';}
function setView(v){view=v;activeLesson=null;search='';document.querySelector('#globalSearch').value='';render();window.scrollTo(0,0);}
function setLesson(id){if(!BY_ID[id])return;activeLesson=id;view='lesson';search='';document.querySelector('#globalSearch').value='';render();window.scrollTo(0,0);}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===(view==='lesson'?'library':view)));const root=document.getElementById('content');if(view==='home')root.innerHTML=home();else if(view==='library')root.innerHTML=library();else if(view==='lesson')root.innerHTML=lesson();else if(view==='cheats')root.innerHTML=cheats();else if(view==='quiz')root.innerHTML=state.session&&!state.session.done?quizQuestion():quizSetup();else if(view==='quiz-result')root.innerHTML=quizResult();else if(view==='progress')root.innerHTML=progress();highlightProse(root);saveLabel();}
function saveLabel(){const el=document.querySelector('#saveStatus');if(el)el.textContent=canSave?'Progreso local opcional · exportación disponible':'El archivo local puede no conservar progreso';}
function home(){const d=overallDone(),total=allSections(),h=state.history,last=h[h.length-1],perc=pct(d,total);const next=CH.filter(c=>doneCount(c)<c.sections.length).sort((a,b)=>doneCount(b)-doneCount(a))[0]||CH[0];return `
<div class="hero"><div><div class="eyebrow">Tu centro de preparación</div><h1>Domina Java 8.<br>Una regla a la vez.</h1><p>Explicaciones paso a paso, fichas de repaso y 260 reactivos difíciles con cuatro justificaciones. Funciona sin Internet y no necesita instalar nada.</p><div class="buttons"><button class="btn light" data-view="library">Explorar el temario →</button><button class="btn" style="background:#ffffff13;color:#fff;border-color:#ffffff55" data-view="quiz">Empezar un quiz</button></div></div><div class="hero-art" aria-hidden="true"><pre>{ java }
  → 8
  λ + ∑</pre></div></div>
<div class="grid"><div class="card stat"><div><div class="number">16</div><div class="hint">Módulos de estudio</div></div><span class="glyph">▤</span></div><div class="card stat"><div><div class="number">${d} <span style="font-size:17px;color:var(--muted)">/ ${total}</span></div><div class="hint">Apartados repasados</div></div><span class="glyph">✓</span></div><div class="card stat"><div><div class="number">260</div><div class="hint">Preguntas con explicaciones</div></div><span class="glyph">▣</span></div></div>
<div class="section-title"><h2>Tu punto de partida</h2><span class="section-note">Seguimiento en este navegador</span></div>
<div class="grid two"><div class="panel"><div class="group-label">Cobertura de teoría</div><div style="font-size:29px;font-weight:800">${perc}%</div>${progressBar(perc,true)}<p class="muted" style="margin-top:13px;font-size:13px">Marca apartados como estudiados al terminar su lectura. No equivale a dominar el tema.</p><button class="btn soft sm" data-lesson="${esc(next.id)}">${d?'Continuar:':'Comenzar:'} ${esc(next.title)} →</button></div><div class="panel"><div class="group-label">Práctica de examen</div><div style="font-size:29px;font-weight:800">${h.length} <span class="muted" style="font-size:15px">cuestionarios</span></div><p class="muted" style="font-size:13px">${last?'Último resultado: '+last.correct+'/'+last.count+' ('+pct(last.correct,last.count)+'%).':'Todavía no has completado un quiz.'}</p><p class="muted" style="font-size:13px">Elige modo estudio para aprender de inmediato o modo examen para recibir las soluciones al terminar.</p><button class="btn primary sm" data-view="quiz">Configurar un quiz →</button></div></div>
<div class="section-title"><h2>Rutas de aprendizaje</h2><button class="btn sm" data-view="library">Ver 16 módulos</button></div><div class="grid">${['Fundamentos','Java 8 funcional','Avanzado'].map(g=>{const cs=groupChapters(g);return `<div class="card"><span class="group-label">${esc(g)}</span><h3 style="margin:10px 0">${cs.length} módulos</h3><p class="muted" style="font-size:13px">${esc(cs.map(x=>x.title).join(' · '))}</p><button class="btn sm soft" data-open-group="${esc(g)}">Explorar →</button></div>`}).join('')}</div>
<div class="notice" style="margin-top:22px"><strong>Consejo de examen:</strong> ante cualquier fragmento, verifica primero si <strong>compila</strong>, después traza la ejecución, y al final decide la salida o excepción. Los temas complementarios se separan de los objetivos Java SE 8.</div><div class="sources"><strong>Base documental:</strong> temario proporcionado y banco propio de 260 preguntas. Se ampliaron fechas y NIO.2 para cubrir objetivos de Java SE 8; algunos ejemplos pueden requerir bibliotecas de terceros como controladores JDBC. <div style="margin-top:9px">${DATA.references.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)} ↗</a>`).join('')}</div></div>`;}
function library(){let list=groupChapters(libraryGroup);const q=search.toLowerCase();if(q)list=list.filter(c=>(c.title+' '+c.intro+' '+c.sections.map(s=>s.title).join(' ')).toLowerCase().includes(q));return `<div class="eyebrow">Biblioteca · 16 módulos</div><h1>Temario completo</h1><p class="subtitle">Estudia los fundamentos, Java 8 funcional y los temas avanzados. Los temas complementarios del archivo original están señalados por separado.</p><div class="filterbar">${['Todos','Fundamentos','Java 8 funcional','Avanzado','Complementario'].map(g=>`<button class="btn sm ${g===libraryGroup?'primary':''}" data-open-group="${esc(g)}">${esc(g)}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(cardChapter).join('')}</div>`:'<div class="empty">No hay módulos que coincidan con la búsqueda.</div>'}`;}
function lesson(){const c=BY_ID[activeLesson]||CH[0],d=doneCount(c),p=pct(d,c.sections.length);const h=c.sections.map((s,i)=>`<a href="#part-${i}" data-expand="${i}"><span class="subsection-tag">${s.number}</span> ${esc(s.title)}</a>`).join('');return `<button class="btn sm" data-view="library">← Temario</button><div style="margin:20px 0 17px"><div class="eyebrow">${esc(c.group)} · ${esc(c.scope)}</div><h1>${esc(c.title)}</h1><p class="subtitle">${inline(c.intro)}</p></div><div class="lessons-columns"><div class="lesson-content"><div class="panel lesson-intro"><div class="module-bottom"><strong>${d} de ${c.sections.length} apartados repasados</strong><strong>${p}%</strong></div><div style="margin-top:10px">${progressBar(p,true)}</div><p class="muted" style="font-size:12px;margin:13px 0 0">Origen: ${esc(c.origin)}. Lee las explicaciones, resuelve ejemplos y marca cada apartado al terminar.</p></div>${c.sections.map((s,i)=>`<details class="panel lesson-part" id="part-${i}" ${i===0?'open':''}><summary><span><span class="subsection-tag">${s.number}</span>${esc(s.title)}</span><span class="chev">›</span></summary><div class="body">${s.html}<div style="padding-top:15px;border-top:1px solid var(--border);display:flex;justify-content:flex-end"><button class="btn sm ${state.done[c.id+':'+i]?'soft':''}" data-done="${esc(c.id)}:${i}">${state.done[c.id+':'+i]?'✓ Apartado repasado':'✓ Marcar como repasado'}</button></div></div></details>`).join('')}
<div class="lesson-cta"><div><strong>¿Listo para evaluar este módulo?</strong><p class="muted" style="margin:4px 0;font-size:13px">${questionCount(c.title)} reactivos disponibles con alternativas difíciles.</p></div><button class="btn primary" data-quiz-area="${esc(c.title)}">Practicar este tema →</button></div></div><aside class="panel lesson-side"><h4>En este módulo</h4>${h}<div style="margin-top:15px">${progressBar(p)}</div><small class="muted">${d}/${c.sections.length} completados</small><div style="margin-top:15px"><button class="btn sm block" data-cheat-topic="${esc(c.id)}">Abrir cheatsheet</button></div></aside></div>`;}
function cheats(){const q=search.toLowerCase();let list=CH.filter(c=>(c.title+' '+c.memory.map(y=>y.join(' ')).join(' ')).toLowerCase().includes(q));return `<div class="eyebrow">Repaso rápido</div><h1>Cheatsheets de Java 8</h1><p class="subtitle">Reglas contrastadas y trampas frecuentes. Úsalas antes del quiz y luego intenta recordarlas sin mirarlas.</p><div class="grid two">${list.map(c=>`<section class="panel"><div class="module-top"><div class="group-label">${esc(c.group)}</div><span class="tag ${c.group==='Complementario'?'compl':'scope'}">${esc(c.scope)}</span></div><h3 style="margin:10px 0 15px">${esc(c.title)}</h3><div class="cheat-grid">${c.memory.map(([a,b])=>`<div class="cheat-line"><strong>${inline(a)}</strong><p>${inline(b)}</p></div>`).join('')}</div><details style="margin-top:15px"><summary class="btn sm" style="display:list-item">Más comparaciones y checklist</summary><div class="cheat-full">${c.confusions}${c.checklist?'<h4>Antes de responder</h4>'+c.checklist:''}</div></details><div class="buttons" style="margin-top:17px"><button class="btn soft sm" data-lesson="${esc(c.id)}">Abrir teoría</button><button class="btn sm" data-quiz-area="${esc(c.title)}">Practicar (${questionCount(c.title)})</button></div></section>`).join('')}</div>${list.length?'':'<div class="empty">No se encontraron fichas con ese término.</div>'}`;}
function quizSetup(){const available=filteredQuestions().length;const groups=Object.entries(QS.reduce((a,q)=>(a[q.area]=(a[q.area]||0)+1,a),{})).sort((a,b)=>a[0].localeCompare(b[0],'es'));return `<div class="quiz-setup"><div class="eyebrow">Práctica adaptativa por filtros</div><h1>Configura tu cuestionario</h1><p class="subtitle">Elige tema, nivel, modalidad y cantidad. Las preguntas y las cuatro alternativas se mezclan en cada intento. No repite automáticamente el mismo orden.</p>${state.session&&state.session.done?'<div class="notice">Tienes una sesión completada. Puedes iniciar otra en cualquier momento.</div>':''}<div class="panel" style="margin:20px 0"><div class="form-grid"><div class="field"><label for="filterArea">Tema</label><select id="filterArea"><option value="Todos">Todos los temas (260)</option>${groups.map(([name,n])=>`<option value="${esc(name)}" ${quizFilter.area===name?'selected':''}>${esc(name)} (${n})</option>`).join('')}</select></div><div class="field"><label for="filterScope">Alcance</label><select id="filterScope"><option ${quizFilter.scope==='Todos'?'selected':''}>Todos</option><option value="808" ${quizFilter.scope==='808'?'selected':''}>Java SE 8 Programmer I (808)</option><option value="809" ${quizFilter.scope==='809'?'selected':''}>Java SE 8 Programmer II (809)</option><option value="Complementario" ${quizFilter.scope==='Complementario'?'selected':''}>Solo complementario</option></select></div><div class="field"><label for="filterType">Tipo de reactivo</label><select id="filterType"><option value="Todos" ${quizFilter.type==='Todos'?'selected':''}>Teoría y código</option><option value="Codigo" ${quizFilter.type==='Codigo'?'selected':''}>Solo con código</option><option value="Teorica" ${quizFilter.type==='Teorica'?'selected':''}>Solo teóricas</option></select></div><div class="field"><label for="filterCount">Número de preguntas</label><select id="filterCount">${['5','10','20','40','all'].map(n=>`<option value="${n}" ${quizFilter.count===n?'selected':''}>${n==='all'?'Todas las disponibles':n+' preguntas'}</option>`).join('')}</select></div></div><div class="group-label" style="margin-top:25px">Modalidad</div><div class="grid two" style="margin:10px 0 19px"><label class="rule" style="cursor:pointer"><input type="radio" name="mode" value="study" ${quizFilter.mode==='study'?'checked':''}> <strong>Modo estudio</strong><p class="muted" style="margin:5px 0 0">Retroalimentación y cuatro justificaciones después de comprobar cada pregunta.</p></label><label class="rule" style="cursor:pointer"><input type="radio" name="mode" value="exam" ${quizFilter.mode==='exam'?'checked':''}> <strong>Modo examen</strong><p class="muted" style="margin:5px 0 0">Sin mostrar respuestas hasta finalizar y recibir la calificación.</p></label></div><div class="module-bottom"><span id="availableCount">${available} reactivos disponibles con estos filtros</span><button class="btn primary" id="startQuiz" ${!available?'disabled':''}>Iniciar cuestionario →</button></div></div><div class="notice"><strong>Cómo interpretar resultados:</strong> la puntuación mide tu desempeño en este banco de práctica, no un porcentaje oficial de aprobación. Las opciones incluyen trampas de compilación, tipos, sobrecarga, streams y excepciones.</div></div>`;}
function filteredQuestions(){return QS.filter(q=>(quizFilter.area==='Todos'||q.area===quizFilter.area)&&(quizFilter.type==='Todos'||q.type===quizFilter.type)&&(quizFilter.scope==='Todos'||(quizFilter.scope==='Complementario'?q.scope==='Complementario':q.scope.includes(quizFilter.scope))));}
function startQuiz(){const pool=filteredQuestions();if(!pool.length){notify('No hay reactivos para estos filtros.');return;}const n=quizFilter.count==='all'?pool.length:Math.min(parseInt(quizFilter.count,10),pool.length);const chosen=shuffle(pool).slice(0,n),orders={};chosen.forEach(q=>orders[q.id]=shuffle(q.options.map(x=>x.key)));state.session={ids:chosen.map(q=>q.id),orders,mode:quizFilter.mode,index:0,answers:{},done:false,recorded:false,created:new Date().toISOString()};resultSession=null;save();render();window.scrollTo(0,0);}
function currentQ(){const s=state.session;return s?QS.find(q=>q.id===s.ids[s.index]):null;}
function quizQuestion(){const s=state.session,q=currentQ();if(!q)return quizSetup();const a=s.answers[q.id]||{},order=s.orders[q.id]||['A','B','C','D'],options=order.map((k,i)=>{const o=q.options.find(x=>x.key===k),chosen=a.key===k,checked=s.mode==='study'&&a.checked;let cls=chosen?' selected':'';if(checked){if(k===q.answer)cls=' correct';else if(chosen)cls=' wrong';}return `<button type="button" class="option${cls}" data-choice="${k}" ${checked?'disabled':''} aria-pressed="${chosen}"><span class="letter">${'ABCD'[i]}</span><span>${inline(o.text)}</span></button>`;}).join('');const checked=s.mode==='study'&&a.checked;return `<div class="quiz-shell"><button class="btn sm" id="quitQuiz">← Salir del cuestionario</button><div class="panel quiz-card" style="margin-top:17px"><div class="quiz-count"><div><span class="eyebrow">${s.mode==='study'?'Modo estudio':'Modo examen'}</span><h3 style="margin:5px 0 0">Pregunta ${s.index+1} de ${s.ids.length}</h3></div><span class="tag ${q.scope==='Complementario'?'compl':'scope'}">${esc(q.scope)}</span></div>${progressBar(pct(s.index,s.ids.length),true)}<div class="quicktiles"><span class="pill">${esc(q.area)}</span><span class="pill">${esc(q.subtopic)}</span><span class="pill">${q.type==='Codigo'?'Código':'Teoría'}</span></div><h2>${inline(q.question)}</h2>${q.code?`<div class="quiz-code"><button class="copy" data-copy-code="${esc(q.id)}">Copiar código</button><pre><code>${colorCode(q.code)}</code></pre></div>`:''}${q.codeContext&&q.codeContext!=='No aplica'?`<p class="muted" style="font-size:12px">${esc(q.codeContext)}</p>`:''}<div role="group" aria-label="Selecciona una opción">${options}</div>${checked?`<div class="feedback ${a.key===q.answer?'ok':'bad'}"><strong>${a.key===q.answer?'✓ Respuesta acertada':'✕ Respuesta incorrecta'}</strong><p style="margin:7px 0">${inline(q.general||q.options.find(x=>x.key===q.answer).explain)}</p><div class="explain"><strong>Justificación de las cuatro opciones</strong>${order.map((k,i)=>{const op=q.options.find(x=>x.key===k);return `<p class="explain-item"><strong>${'ABCD'[i]}.</strong> ${k===q.answer?'<span class="status-dot dot-ok"></span>':''}${inline(op.explain)}</p>`;}).join('')}</div></div>`:''}<div class="quiz-footer"><span class="muted" style="font-size:12px">${s.mode==='study'?'Analiza cada distractor antes de avanzar.':'Las soluciones se muestran al terminar el examen.'}</span><button class="btn primary" id="quizNext" ${!a.key?'disabled':''}>${s.mode==='study'&&!checked?'Comprobar respuesta':s.index===s.ids.length-1?'Finalizar y ver resultado':'Siguiente pregunta →'}</button></div></div></div>`;}
function choose(k){const s=state.session,q=currentQ();if(!s||!q||s.mode==='study'&&s.answers[q.id]?.checked)return;s.answers[q.id]={key:k,checked:false};save();render();}
function quizAdvance(){const s=state.session,q=currentQ();if(!s||!q)return;const a=s.answers[q.id];if(!a||!a.key){notify('Elige una alternativa para continuar.');return;}if(s.mode==='study'&&!a.checked){a.checked=true;save();render();return;}if(s.index<s.ids.length-1){s.index++;save();render();window.scrollTo(0,0);}else{finishQuiz();}}
function finishQuiz(){const s=state.session;if(!s)return;s.done=true;const total=s.ids.length,correct=s.ids.reduce((n,id)=>n+(s.answers[id]?.key===QS.find(q=>q.id===id)?.answer?1:0),0);if(!s.recorded){state.history.push({date:new Date().toISOString(),count:total,correct,mode:s.mode,areas:[...new Set(s.ids.map(id=>QS.find(q=>q.id===id).area))],items:s.ids.map(id=>{const q=QS.find(x=>x.id===id);return {id,area:q.area,answer:s.answers[id]?.key||'',correct:q.answer};})});s.recorded=true;}resultSession=structuredCopy(s);save();view='quiz-result';render();window.scrollTo(0,0);}
function quizResult(){const s=resultSession||state.session;if(!s)return '<div class="empty">No hay resultados disponibles.</div>';const qs=s.ids.map(id=>QS.find(q=>q.id===id)),correct=qs.filter(q=>s.answers[q.id]?.key===q.answer).length,total=qs.length,p=pct(correct,total),wrong=total-correct;return `<div class="quiz-shell"><div class="panel result-hero"><div class="eyebrow">Cuestionario finalizado</div><h1>Resultado de práctica</h1><div class="score">${p}%</div><p class="muted">${correct} respuestas correctas de ${total}</p>${progressBar(p,true)}<div class="result-grid"><div class="result-mini"><strong>${correct}</strong><div class="muted" style="font-size:12px">Aciertos</div></div><div class="result-mini"><strong>${wrong}</strong><div class="muted" style="font-size:12px">Errores</div></div><div class="result-mini"><strong>${s.mode==='exam'?'Examen':'Estudio'}</strong><div class="muted" style="font-size:12px">Modalidad</div></div></div><div class="buttons" style="justify-content:center"><button class="btn primary" id="newQuiz">Nuevo quiz</button><button class="btn" id="exportResults">Exportar resultados CSV</button></div></div><div class="panel" style="margin-top:17px"><h2>Revisión de respuestas</h2><p class="muted" style="font-size:13px">Abre cada pregunta para consultar las cuatro justificaciones originales. Las letras corresponden al banco original, no al orden aleatorio mostrado.</p>${qs.map((q,i)=>{const mine=s.answers[q.id]?.key||'—',ok=mine===q.answer;return `<details class="review-item" ${!ok?'open':''}><summary><span class="status-dot ${ok?'dot-ok':'dot-bad'}"></span> ${i+1}. ${esc(clip(q.question,125))} <span class="pill" style="float:right">${ok?'Acierto':'Error'}</span></summary><div class="review-detail">${q.code?`<pre><code>${colorCode(q.code)}</code></pre>`:''}<p><strong>Elegiste:</strong> ${esc(mine)} · ${esc(q.options.find(o=>o.key===mine)?.text||'Sin respuesta')}</p><p><strong>Correcta:</strong> ${esc(q.answer)} · ${esc(q.options.find(o=>o.key===q.answer).text)}</p>${q.options.map(o=>`<div class="explain-item"><strong>${o.key}: </strong>${inline(o.explain)}</div>`).join('')}</div></details>`;}).join('')}</div></div>`;}
function progress(){const h=state.history,done=overallDone(),total=allSections(),totalQuestions=h.reduce((n,x)=>n+x.count,0),correct=h.reduce((n,x)=>n+x.correct,0),bar=CH.map(c=>{const related=h.flatMap(z=>z.items||[]).filter(x=>x.area===c.title),a=related.length,good=related.filter(x=>x.answer===x.correct).length;return {c,reads:pct(doneCount(c),c.sections.length),qCount:a,qPct:pct(good,a)};});return `<div class="eyebrow">Avances</div><h1>Mi progreso</h1><p class="subtitle">La cobertura registra apartados leídos; el rendimiento cuenta aciertos en cuestionarios completados. No sustituyen un simulacro real.</p><div class="grid"><div class="card stat"><div><div class="number">${pct(done,total)}%</div><div class="hint">Cobertura de teoría</div></div><span class="glyph">▤</span></div><div class="card stat"><div><div class="number">${h.length}</div><div class="hint">Quizzes completos</div></div><span class="glyph">▣</span></div><div class="card stat"><div><div class="number">${totalQuestions?pct(correct,totalQuestions)+'%':'—'}</div><div class="hint">Precisión acumulada · ${totalQuestions} respuestas</div></div><span class="glyph">◉</span></div></div><div class="grid two" style="margin-top:20px"><div class="panel"><h3>Cobertura por módulo</h3><div class="bars">${bar.map(x=>`<div class="bar"><span>${esc(x.c.title)}</span>${progressBar(x.reads)}<strong>${x.reads}%</strong></div>`).join('')}</div></div><div class="panel"><h3>Historial de cuestionarios</h3>${h.length?`<div class="history-row" style="font-weight:750;color:var(--muted)"><span>Fecha</span><span>Modalidad</span><span>Resultado</span></div>${h.slice().reverse().slice(0,20).map(x=>`<div class="history-row"><span>${shortDate(x.date)}</span><span>${x.mode==='study'?'Estudio':'Examen'} · ${x.count} preguntas</span><strong>${pct(x.correct,x.count)}%</strong></div>`).join('')}`:'<div class="empty">Aún no has completado un cuestionario.</div>'}<p class="muted" style="font-size:12px;margin-top:16px">Los resultados de 260 preguntas no permiten garantizar el resultado de un examen oficial.</p></div></div><div class="panel" style="margin-top:20px"><h3>Respaldo y privacidad</h3><p class="muted" style="font-size:13px">La información se intenta guardar en este navegador. Si abres el HTML desde una ruta local, algunos navegadores no conservan <code>localStorage</code>. Exporta un respaldo JSON para evitar perder tus avances. No se envía nada a servidores.</p><div class="buttons"><button class="btn primary" id="exportProgress">Descargar progreso (.json)</button><button class="btn" id="importProgress">Importar progreso (.json)</button><button class="btn danger" id="clearProgress">Borrar progreso local</button></div></div>`;}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},3000);}
function exportProgress(){download('java8_progreso_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({kind:'java8-academy-progress',version:1,exported:new Date().toISOString(),state},null,2),'application/json;charset=utf-8');notify('Respaldo JSON preparado.');}
function exportResults(){const s=resultSession||state.session;if(!s){notify('Sin resultados.');return;}const lines=[['ID','Area','Pregunta','Respuesta_elegida','Respuesta_correcta','Acierto']];s.ids.forEach(id=>{const q=QS.find(x=>x.id===id),answer=s.answers[id]?.key||'';lines.push([id,q.area,q.question,answer,q.answer,+(answer===q.answer)]);});const csv=lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('java8_resultados_'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+csv,'text/csv;charset=utf-8');}
function importProgress(file){const fr=new FileReader();fr.onload=()=>{try{const v=JSON.parse(String(fr.result));if(v.kind!=='java8-academy-progress'||!v.state||typeof v.state.done!=='object'||!Array.isArray(v.state.history))throw Error('Formato de respaldo inválido');if(!confirm('¿Reemplazar tu progreso local con el del archivo?'))return;state={...DEFAULT,done:v.state.done,history:v.state.history,session:v.state.session||null};resultSession=null;save();view='progress';render();notify('Progreso restaurado.');}catch(e){notify('No se pudo importar este respaldo.');}};fr.readAsText(file);}
const root=document.getElementById('content');document.addEventListener('click',(ev)=>{const t=ev.target.closest('button,a[data-expand]');if(!t)return;if(t.matches('[data-view]')){setView(t.dataset.view);return;}if(t.matches('[data-open-group]')){libraryGroup=t.dataset.openGroup;setView('library');return;}if(t.matches('[data-lesson]')){setLesson(t.dataset.lesson);return;}if(t.matches('[data-cheat-topic]')){setView('cheats');const c=BY_ID[t.dataset.cheatTopic];if(c){search=c.title;document.getElementById('globalSearch').value=c.title;render();}return;}if(t.matches('[data-quiz-area]')){quizFilter={scope:'Todos',area:t.dataset.quizArea,type:'Todos',mode:'study',count:'10'};state.session=null;save();setView('quiz');return;}if(t.matches('[data-done]')){const k=t.dataset.done;state.done[k]=!state.done[k];save();const y=window.scrollY;render();window.scrollTo(0,y);return;}if(t.matches('[data-expand]')){const n=t.dataset.expand;const el=document.querySelector('#part-'+n);if(el)el.open=true;return;}if(t.id==='startQuiz'){startQuiz();return;}if(t.id==='quitQuiz'){if(confirm('¿Abandonar este quiz? El intento actual no se contará en el historial.')){state.session=null;resultSession=null;save();setView('quiz');}return;}if(t.matches('[data-choice]')){choose(t.dataset.choice);return;}if(t.id==='quizNext'){quizAdvance();return;}if(t.id==='newQuiz'){state.session=null;resultSession=null;save();setView('quiz');return;}if(t.id==='exportProgress'){exportProgress();return;}if(t.id==='importProgress'){document.querySelector('#importFile').click();return;}if(t.id==='clearProgress'){if(confirm('¿Borrar todo el progreso y el historial guardados en este navegador?')){state=structuredCopy(DEFAULT);save();render();notify('Progreso reiniciado.');}return;}if(t.id==='exportResults'){exportResults();return;}if(t.matches('[data-copy-code]')){const q=QS.find(q=>q.id===t.dataset.copyCode);if(q&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(q.code).then(()=>notify('Código copiado.'),()=>notify('No se pudo copiar; selecciona el texto.'));}else notify('Selecciona el código para copiarlo.');return;}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='filterArea')quizFilter.area=t.value;else if(t.id==='filterScope')quizFilter.scope=t.value;else if(t.id==='filterType')quizFilter.type=t.value;else if(t.id==='filterCount')quizFilter.count=t.value;else if(t.name==='mode')quizFilter.mode=t.value;else if(t.id==='importFile'&&t.files[0]){importProgress(t.files[0]);t.value='';return;}else return;if(view==='quiz'&&!state.session){const count=filteredQuestions().length;const e=document.querySelector('#availableCount'),btn=document.querySelector('#startQuiz');if(e)e.textContent=count+' reactivos disponibles con estos filtros';if(btn)btn.disabled=!count;}});
document.querySelector('#globalSearch').addEventListener('input',e=>{search=e.target.value.toLowerCase().trim();if(view==='home'||view==='lesson'||view==='progress'||view==='quiz'||view==='quiz-result'){view='library';libraryGroup='Todos';}render();});
document.addEventListener('keydown',e=>{if((view==='quiz')&&state.session&&!state.session.done&&!e.ctrlKey&&!e.metaKey&&['1','2','3','4'].includes(e.key)&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){const s=state.session,q=currentQ(),order=s.orders[q.id];choose(order[Number(e.key)-1]);}});
render();
})();
</script>
