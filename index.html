try (Connection con = DriverManager.getConnection(\u0026quot;jdbc:h2:mem:tienda\u0026quot;);\n             Statement st = con.createStatement()) {\n            st.executeUpdate(\u0026quot;CREATE TABLE producto (id INT PRIMARY KEY, nombre VARCHAR(20), precio INT)\u0026quot;);\n            int filas = st.executeUpdate(\u0026quot;INSERT INTO producto VALUES (1, 'pan', 10), (2, 'leche', 25), (3, 'queso', 80)\u0026quot;);\n            System.out.println(\u0026quot;insertadas: \u0026quot; + filas);\n            try (ResultSet rs = st.executeQuery(\u0026quot;SELECT nombre, precio FROM producto WHERE precio \u0026gt; 20 ORDER BY precio\u0026quot;)) {\n                while (rs.next()) {\n                    System.out.println(rs.getString(1) + \u0026quot; \u0026quot; + rs.getInt(\u0026quot;precio\u0026quot;));\n                }\n            }\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003einsertadas: 3\nleche 25\nqueso 80\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEjecutado con H2 en memoria (\u003ccode\u003ejdbc:h2:mem:\u003c/code\u003e), que implementa la API JDBC estándar. Las columnas se leen por posición (desde 1) o por nombre.\u003c/p\u003e\n","number":"01"},{"title":"PreparedStatement","html":"\u003cp\u003e\u003ccode\u003econ.prepareStatement(sql)\u003c/code\u003e recibe el SQL con marcadores \u003ccode\u003e?\u003c/code\u003e para los valores. Se asignan con \u003ccode\u003esetInt\u003c/code\u003e, \u003ccode\u003esetString\u003c/code\u003e, etc., cuyo primer argumento es la posición del marcador, empezando en 1. No se escriben comillas alrededor del \u003ccode\u003e?\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eEl driver envía los valores separados del SQL, lo que evita la inyección SQL y permite reutilizar la sentencia con otros valores. Los marcadores sirven para valores, no para nombres de tablas o columnas.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws SQLException {\n        try (Connection con = DriverManager.getConnection(\u0026quot;jdbc:h2:mem:clientes\u0026quot;);\n             Statement st = con.createStatement()) {\n            st.executeUpdate(\u0026quot;CREATE TABLE cliente (id INT, nombre VARCHAR(20))\u0026quot;);\n            try (PreparedStatement ps = con.prepareStatement(\u0026quot;INSERT INTO cliente VALUES (?, ?)\u0026quot;)) {\n                ps.setInt(1, 1);\n                ps.setString(2, \u0026quot;Ana\u0026quot;);\n                ps.executeUpdate();\n                ps.setInt(1, 2);\n                ps.setString(2, \u0026quot;O'Brien\u0026quot;);\n                ps.executeUpdate();\n            }\n            try (PreparedStatement ps = con.prepareStatement(\u0026quot;SELECT nombre FROM cliente WHERE id = ?\u0026quot;)) {\n                ps.setInt(1, 2);\n                try (ResultSet rs = ps.executeQuery()) {\n                    System.out.println(rs.next() ? rs.getString(\u0026quot;nombre\u0026quot;) : \u0026quot;sin datos\u0026quot;);\n                }\n            }\n            try (PreparedStatement ps = con.prepareStatement(\u0026quot;UPDATE cliente SET nombre = ? WHERE id \u0026gt; ?\u0026quot;)) {\n                ps.setString(1, \u0026quot;X\u0026quot;);\n                ps.setInt(2, 5);\n                System.out.println(\u0026quot;actualizadas: \u0026quot; + ps.executeUpdate());\n            }\n            try (PreparedStatement ps = con.prepareStatement(\u0026quot;SELECT * FROM cliente WHERE id = ?\u0026quot;)) {\n                ps.setInt(0, 1);\n            } catch (SQLException e) {\n                System.out.println(\u0026quot;índice 0: SQLException\u0026quot;);\n            }\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eO'Brien\nactualizadas: 0\níndice 0: SQLException\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEjecutado con H2 en memoria (\u003ccode\u003ejdbc:h2:mem:\u003c/code\u003e), que implementa la API JDBC estándar. El apóstrofo de O'Brien no rompe nada porque es un valor, no parte del SQL. Un UPDATE que no coincide con filas devuelve 0. Los parámetros empiezan en 1.\u003c/p\u003e\n","number":"02"},{"title":"Recorrer un ResultSet","html":"\u003cp\u003eEl cursor empieza antes de la primera fila. \u003ccode\u003enext()\u003c/code\u003e avanza y devuelve false cuando no hay más filas. Leer una columna antes del primer \u003ccode\u003enext()\u003c/code\u003e o después del último lanza \u003ccode\u003eSQLException\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003ePor defecto el cursor solo avanza (\u003ccode\u003eTYPE_FORWARD_ONLY\u003c/code\u003e). Volver a ejecutar un Statement cierra el ResultSet anterior que había producido.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws SQLException {\n        try (Connection con = DriverManager.getConnection(\u0026quot;jdbc:h2:mem:cursor\u0026quot;);\n             Statement st = con.createStatement();\n             ResultSet rs = st.executeQuery(\u0026quot;SELECT 'a' AS letra\u0026quot;)) {\n            try {\n                rs.getString(1);\n            } catch (SQLException e) {\n                System.out.println(\u0026quot;antes de next(): SQLException\u0026quot;);\n            }\n            System.out.println(rs.next() + \u0026quot; \u0026quot; + rs.getString(1) + \u0026quot; \u0026quot; + rs.next());\n            System.out.println(st.execute(\u0026quot;SELECT 1\u0026quot;) + \u0026quot; \u0026quot; + st.execute(\u0026quot;CREATE TABLE t (x INT)\u0026quot;));\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eantes de next(): SQLException\ntrue a false\ntrue false\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEjecutado con H2 en memoria (\u003ccode\u003ejdbc:h2:mem:\u003c/code\u003e), que implementa la API JDBC estándar. \u003ccode\u003eexecute\u003c/code\u003e devuelve true para el SELECT y false para la sentencia que no produce filas.\u003c/p\u003e\n","number":"03"},{"title":"Transacciones","html":"\u003cp\u003ePor defecto la conexión está en autocommit: cada sentencia se confirma sola. Para agrupar varias, se llama \u003ccode\u003esetAutoCommit(false)\u003c/code\u003e, se ejecutan las sentencias y se confirma con \u003ccode\u003ecommit()\u003c/code\u003e o se deshace con \u003ccode\u003erollback()\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eEjemplo\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eJava 8 · Main.java\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003eimport java.sql.*;\n\npublic class Main {\n    public static void main(String[] args) throws SQLException {\n        try (Connection con = DriverManager.getConnection(\u0026quot;jdbc:h2:mem:banco\u0026quot;);\n             Statement st = con.createStatement()) {\n            st.executeUpdate(\u0026quot;CREATE TABLE cuenta (id INT, saldo INT)\u0026quot;);\n            con.setAutoCommit(false);\n            st.executeUpdate(\u0026quot;INSERT INTO cuenta VALUES (1, 100)\u0026quot;);\n            con.commit();\n            st.executeUpdate(\u0026quot;UPDATE cuenta SET saldo = 0 WHERE id = 1\u0026quot;);\n            con.rollback();\n            try (ResultSet rs = st.executeQuery(\u0026quot;SELECT saldo FROM cuenta WHERE id = 1\u0026quot;)) {\n                rs.next();\n                System.out.println(rs.getInt(\u0026quot;saldo\u0026quot;));\n            }\n        }\n    }\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003cstrong\u003eSalida\u003c/strong\u003e\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e100\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEjecutado con H2 en memoria (\u003ccode\u003ejdbc:h2:mem:\u003c/code\u003e), que implementa la API JDBC estándar. El rollback deshace el UPDATE no confirmado; el INSERT ya estaba confirmado.\u003c/p\u003e\n","number":"04"},{"title":"Cerrar recursos","html":"\u003cp\u003eConnection, Statement y ResultSet implementan AutoCloseable. Con try-with-resources se cierran en orden inverso a su declaración (ResultSet, Statement, Connection).\u003c/p\u003e\n\u003cp\u003eCerrar un Statement cierra su ResultSet; cerrar la Connection cierra sus Statements.\u003c/p\u003e\n","number":"05"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConcepto\u003c/th\u003e\n  \u003cth\u003eSe confunde con\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eexecuteQuery\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eexecuteUpdate\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eResultSet contra número de filas afectadas.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003eexecute\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003eexecuteUpdate\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eboolean (¿hay ResultSet?) contra int.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eÍndices JDBC\u003c/td\u003e\n  \u003ctd\u003eÍndices de Java\u003c/td\u003e\n  \u003ctd\u003eColumnas y parámetros empiezan en 1, no en 0.\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003e\u003ccode\u003ecommit\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003erollback\u003c/code\u003e\u003c/td\u003e\n  \u003ctd\u003eConfirmar contra deshacer los cambios pendientes.\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿Qué método de ejecución se usa y qué tipo devuelve?\u003c/li\u003e\n\u003cli\u003e¿Se llama a \u003ccode\u003enext()\u003c/code\u003e antes de leer la primera fila?\u003c/li\u003e\n\u003cli\u003e¿Los índices de columnas y parámetros empiezan en 1?\u003c/li\u003e\n\u003cli\u003e¿Hay autocommit o un commit/rollback explícito?\u003c/li\u003e\n\u003cli\u003e¿Se maneja o declara SQLException?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Temario adjunto","memory":[["executeQuery","Devuelve ResultSet"],["executeUpdate","Devuelve conteo de cambios"],["execute","Devuelve boolean según primer resultado"],["PreparedStatement","Parámetros desde índice 1"],["commit / rollback","Confirma / revierte transacción"]]},{"title":"Fechas y horas Java 8","id":"fechas-y-horas-java-8","group":"Avanzado","scope":"1Z0-808/809","icon":"calendar","intro":"`java.time` introdujo tipos inmutables y una separación clara entre fecha, hora, zona y periodos. Identifica qué clase representa cada concepto antes de calcular.","sections":[{"number":"01","title":"LocalDate, LocalTime y LocalDateTime","html":"\u003cp\u003e\u003ccode\u003eLocalDate\u003c/code\u003e contiene una fecha sin hora ni zona; \u003ccode\u003eLocalTime\u003c/code\u003e, una hora sin fecha ni zona; \u003ccode\u003eLocalDateTime\u003c/code\u003e, ambas sin zona. Son \u003cstrong\u003einmutables\u003c/strong\u003e: hay que guardar el valor devuelto por \u003ccode\u003eplusDays\u003c/code\u003e, \u003ccode\u003eminusHours\u003c/code\u003e, etc.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003eLocalDate a = LocalDate.of(2026, 2, 28);\nLocalDate b = a.plusDays(1);\nSystem.out.println(a + \u0026quot; | \u0026quot; + b); // 2026-02-28 | 2026-03-01\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eLocalDate.parse(\u0026quot;2026-12-31\u0026quot;)\u003c/code\u003e usa ISO por defecto; un texto inválido lanza \u003ccode\u003eDateTimeParseException\u003c/code\u003e. \u003ccode\u003enew LocalDate()\u003c/code\u003e no compila: se usan fábricas estáticas.\u003c/p\u003e\n"},{"number":"02","title":"Period y Duration","html":"\u003cp\u003e\u003ccode\u003ePeriod\u003c/code\u003e representa cantidades basadas en calendario (años, meses, días). \u003ccode\u003eDuration\u003c/code\u003e representa segundos y nanosegundos; se usa normalmente con horas y fechas que soportan tiempo.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003ePeriod p = Period.ofMonths(1).plusDays(5);\nDuration d = Duration.ofMinutes(90);\nSystem.out.println(p + \u0026quot; \u0026quot; + d); // P1M5D PT1H30M\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eNo trates meses como duración fija de 30 días. \u003ccode\u003ePeriod\u003c/code\u003e opera con fechas y \u003ccode\u003eDuration\u003c/code\u003e con unidades de tiempo.\u003c/p\u003e\n"},{"number":"03","title":"ZonedDateTime, ZoneId e Instant","html":"\u003cp\u003e\u003ccode\u003eZonedDateTime\u003c/code\u003e agrega una \u003ccode\u003eZoneId\u003c/code\u003e a la fecha y hora. \u003ccode\u003eInstant\u003c/code\u003e expresa un instante en la línea temporal UTC. Los cambios de horario de verano pueden crear horas ambiguas o inexistentes en algunas regiones.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003eZoneId zona = ZoneId.of(\u0026quot;America/Mexico_City\u0026quot;);\nZonedDateTime z = ZonedDateTime.of(2026, 11, 8, 10, 0, 0, 0, zona);\nInstant instante = z.toInstant();\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003ePara comparar instantes, prefiere \u003ccode\u003eInstant\u003c/code\u003e o \u003ccode\u003e.toInstant()\u003c/code\u003e antes que asumir que dos horas locales ocurren simultáneamente.\u003c/p\u003e\n"},{"number":"04","title":"DateTimeFormatter y excepciones","html":"\u003cp\u003e\u003ccode\u003eDateTimeFormatter.ofPattern(\u0026quot;dd/MM/uuuu\u0026quot;)\u003c/code\u003e crea un formateador. \u003ccode\u003eMM\u003c/code\u003e representa mes, \u003ccode\u003emm\u003c/code\u003e minutos, \u003ccode\u003eHH\u003c/code\u003e la hora 0–23, \u003ccode\u003ehh\u003c/code\u003e la hora 1–12, \u003ccode\u003euuuu\u003c/code\u003e el año proléptico.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003eLocalDate f = LocalDate.of(2026, 11, 8);\nSystem.out.println(f.format(DateTimeFormatter.ofPattern(\u0026quot;dd/MM/uuuu\u0026quot;)));\n// 08/11/2026\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eEn Java 8, \u003ccode\u003eLocalDate\u003c/code\u003e no tiene zona ni hora, por lo que no se convierte directamente a un \u003ccode\u003eInstant\u003c/code\u003e sin añadir información temporal.\u003c/p\u003e\n"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConceptos\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLocalDate / LocalTime\u003c/td\u003e\n  \u003ctd\u003eSolo fecha / solo hora, sin zona\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eLocalDateTime / ZonedDateTime\u003c/td\u003e\n  \u003ctd\u003eSin zona / con zona\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003ePeriod / Duration\u003c/td\u003e\n  \u003ctd\u003eAños-meses-días / segundos-nanos\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eMM / mm\u003c/td\u003e\n  \u003ctd\u003eMes / minuto\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eInmutabilidad\u003c/td\u003e\n  \u003ctd\u003e\u003ccode\u003efecha.plusDays(1)\u003c/code\u003e no modifica \u003ccode\u003efecha\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eInstant\u003c/td\u003e\n  \u003ctd\u003eInstante universal, no zona local\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿El método pertenece a Java 8 y se invoca sobre el tipo correcto?\u003c/li\u003e\n\u003cli\u003e¿Hay inmutabilidad, zona, recurso sin cerrar o excepción checked?\u003c/li\u003e\n\u003cli\u003e¿La operación consulta el sistema de archivos o solo manipula una ruta?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Ampliación conforme a objetivos Oracle Java SE 8","memory":[["LocalDate / LocalTime","Solo fecha / solo hora, sin zona"],["LocalDateTime / ZonedDateTime","Sin zona / con zona"],["Period / Duration","Años-meses-días / segundos-nanos"],["MM / mm","Mes / minuto"],["Inmutabilidad","`fecha.plusDays(1)` no modifica `fecha`"],["Instant","Instante universal, no zona local"]]},{"title":"Entrada/salida y NIO.2","id":"entrada-salida-y-nio-2","group":"Avanzado","scope":"1Z0-809","icon":"folder","intro":"`java.io` organiza streams de bytes y caracteres; `java.nio.file` aporta `Path`, `Files` y recorridos modernos de archivos. Distingue operaciones puramente léxicas de operaciones que consultan el sistema de archivos.","sections":[{"number":"01","title":"Bytes, caracteres y buffering","html":"\u003cp\u003e\u003ccode\u003eInputStream\u003c/code\u003e/\u003ccode\u003eOutputStream\u003c/code\u003e procesan \u003cstrong\u003ebytes\u003c/strong\u003e; \u003ccode\u003eReader\u003c/code\u003e/\u003ccode\u003eWriter\u003c/code\u003e trabajan con \u003cstrong\u003ecaracteres\u003c/strong\u003e. Clases \u003ccode\u003eBuffered*\u003c/code\u003e añaden buffering. \u003ccode\u003eInputStreamReader\u003c/code\u003e hace el puente bytes→caracteres y necesita una codificación para interpretar texto correctamente.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003etry (BufferedReader r = new BufferedReader(new FileReader(\u0026quot;notas.txt\u0026quot;))) {\n    String linea;\n    while ((linea = r.readLine()) != null) System.out.println(linea);\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eread()\u003c/code\u003e devuelve \u003ccode\u003e-1\u003c/code\u003e al llegar al final de archivo; \u003cstrong\u003eno\u003c/strong\u003e devuelve \u003ccode\u003enull\u003c/code\u003e en \u003ccode\u003eInputStream\u003c/code\u003e. \u003ccode\u003ereadLine()\u003c/code\u003e sí devuelve \u003ccode\u003enull\u003c/code\u003e al terminar.\u003c/p\u003e\n"},{"number":"02","title":"Serializable y transient","html":"\u003cp\u003ePara serialización por defecto, una clase implementa \u003ccode\u003ejava.io.Serializable\u003c/code\u003e. El campo \u003ccode\u003eserialVersionUID\u003c/code\u003e ayuda a controlar compatibilidad de versiones. Campos \u003ccode\u003estatic\u003c/code\u003e pertenecen a la clase y los \u003ccode\u003etransient\u003c/code\u003e no forman parte del estado serializado.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003eclass Usuario implements java.io.Serializable {\n    private static final long serialVersionUID = 1L;\n    String nombre;\n    transient String token;\n}\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eDurante la deserialización de una clase serializable, no se llama a sus constructores como en una creación normal, aunque el constructor sin argumentos del primer ancestro no serializable sí participa.\u003c/p\u003e\n"},{"number":"03","title":"Path, resolve, normalize y relativize","html":"\u003cp\u003e\u003ccode\u003ePaths.get\u003c/code\u003e obtiene un \u003ccode\u003ePath\u003c/code\u003e. \u003ccode\u003eresolve\u003c/code\u003e combina rutas; si el argumento es absoluto, puede reemplazar la base según el proveedor. \u003ccode\u003enormalize\u003c/code\u003e elimina segmentos redundantes \u003cstrong\u003esin visitar el disco\u003c/strong\u003e. \u003ccode\u003erelativize\u003c/code\u003e calcula el recorrido relativo entre rutas compatibles.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003ePath p = Paths.get(\u0026quot;a/b/../c\u0026quot;);\nSystem.out.println(p.normalize()); // a/c\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003etoRealPath()\u003c/code\u003e sí consulta el sistema de archivos, normalmente exige que exista la ruta y puede resolver enlaces simbólicos.\u003c/p\u003e\n"},{"number":"04","title":"Files y operaciones de archivos","html":"\u003cp\u003e\u003ccode\u003eFiles.exists\u003c/code\u003e, \u003ccode\u003eisDirectory\u003c/code\u003e y \u003ccode\u003eisRegularFile\u003c/code\u003e consultan atributos. \u003ccode\u003eFiles.copy\u003c/code\u003e y \u003ccode\u003emove\u003c/code\u003e reciben \u003ccode\u003eCopyOption\u003c/code\u003e como \u003ccode\u003eStandardCopyOption.REPLACE_EXISTING\u003c/code\u003e. \u003ccode\u003eFiles.deleteIfExists\u003c/code\u003e devuelve boolean.\u003c/p\u003e\n\u003cpre\u003e\u003ccode class=\"language-java\"\u003ePath origen = Paths.get(\u0026quot;a.txt\u0026quot;);\nPath destino = Paths.get(\u0026quot;b.txt\u0026quot;);\nFiles.copy(origen, destino, StandardCopyOption.REPLACE_EXISTING);\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eFiles.walk\u003c/code\u003e devuelve un \u003ccode\u003eStream\u0026lt;Path\u0026gt;\u003c/code\u003e que debe cerrarse. \u003ccode\u003eFiles.lines\u003c/code\u003e devuelve \u003ccode\u003eStream\u0026lt;String\u0026gt;\u003c/code\u003e y también debe cerrarse.\u003c/p\u003e\n"},{"number":"05","title":"Atributos, visitas y enlaces","html":"\u003cp\u003e\u003ccode\u003eBasicFileAttributes\u003c/code\u003e informa tamaño, fechas y si la ruta es archivo o directorio. \u003ccode\u003eFiles.readAttributes(path, BasicFileAttributes.class)\u003c/code\u003e obtiene una instantánea de atributos. \u003ccode\u003eFileVisitor\u003c/code\u003e y \u003ccode\u003eFiles.walkFileTree\u003c/code\u003e permiten recorrer árboles; \u003ccode\u003eFileVisitResult.SKIP_SUBTREE\u003c/code\u003e omite descendientes.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ePath\u003c/code\u003e implementa \u003ccode\u003eComparable\u0026lt;Path\u0026gt;\u003c/code\u003e, pero comparar caminos no significa comparar los archivos a los que apuntan. Los métodos NIO.2 pueden lanzar \u003ccode\u003eIOException\u003c/code\u003e checked.\u003c/p\u003e\n"}],"confusions":"\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth\u003eConceptos\u003c/th\u003e\n  \u003cth\u003eDiferencia\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd\u003eInputStream / Reader\u003c/td\u003e\n  \u003ctd\u003eBytes / caracteres\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eread() / readLine()\u003c/td\u003e\n  \u003ctd\u003eEOF -1 / EOF null\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003enormalize / toRealPath\u003c/td\u003e\n  \u003ctd\u003eSintáctico / consulta el disco\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eresolve / relativize\u003c/td\u003e\n  \u003ctd\u003eCombina / calcula ruta relativa\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFiles.lines\u003c/td\u003e\n  \u003ctd\u003eStream que debe cerrarse\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003etransient / static\u003c/td\u003e\n  \u003ctd\u003eNinguno se serializa como estado de instancia\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd\u003eFiles.deleteIfExists\u003c/td\u003e\n  \u003ctd\u003eNo falla por archivo inexistente; devuelve false\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","checklist":"\u003cul\u003e\n\u003cli\u003e¿El método pertenece a Java 8 y se invoca sobre el tipo correcto?\u003c/li\u003e\n\u003cli\u003e¿Hay inmutabilidad, zona, recurso sin cerrar o excepción checked?\u003c/li\u003e\n\u003cli\u003e¿La operación consulta el sistema de archivos o solo manipula una ruta?\u003c/li\u003e\n\u003c/ul\u003e\n","origin":"Ampliación conforme a objetivos Oracle Java SE 8","memory":[["InputStream / Reader","Bytes / caracteres"],["read() / readLine()","EOF -1 / EOF null"],["normalize / toRealPath","Sintáctico / consulta el disco"],["resolve / relativize","Combina / calcula ruta relativa"],["Files.lines","Stream que debe cerrarse"],["transient / static","Ninguno se serializa como estado de instancia"],["Files.deleteIfExists","No falla por archivo inexistente; devuelve false"]]}],"questions":[{"id":"J8-001","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Punto de entrada","type":"Codigo","difficulty":"Muy alta","question":"¿Cuál es el resultado al ejecutar java Main sin argumentos?","code":"public class Main { public static void main(String... args) { System.out.print(args.length); } }","codeContext":"Archivo Main.java completo","options":[{"key":"A","text":"Imprime 0","explain":"String... es una firma válida y args.length vale 0 sin argumentos."},{"key":"B","text":"Imprime null","explain":"args no es null al invocar main desde el lanzador Java."},{"key":"C","text":"No compila","explain":"La variante varargs se traduce a String[]."},{"key":"D","text":"Compila pero la JVM rechaza main","explain":"La JVM reconoce public static void main(String...) como punto de entrada."}],"answer":"A","general":"String... es una firma válida y args.length vale 0 sin argumentos."},{"id":"J8-002","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Clases y archivos","type":"Teorica","difficulty":"Muy alta","question":"En un mismo archivo Main.java se declaran public class Main, class Helper y class Otra. ¿Qué sucede?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"No compila por haber tres clases","explain":"Java permite varias clases de nivel superior en el mismo archivo."},{"key":"B","text":"Compila; se generan archivos .class independientes","explain":"Solo una clase de nivel superior puede ser public y coincidir con el nombre del archivo; las otras son válidas."},{"key":"C","text":"Compila solo si todas son public","explain":"Varias public en un archivo violan la regla de nombres."},{"key":"D","text":"Genera un único Main.class","explain":"Cada clase de nivel superior produce su propio bytecode. "}],"answer":"B","general":"Solo una clase de nivel superior puede ser public y coincidir con el nombre del archivo; las otras son válidas."},{"id":"J8-003","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Tipos primitivos","type":"Codigo","difficulty":"Muy alta","question":"¿Qué se imprime y por qué?","code":"char c=65; System.out.print((c+1)+\" \"+(char)(c+1));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"66 B","explain":"char se promociona a int en la suma: 65+1=66; el cast posterior produce B."},{"key":"B","text":"B B","explain":"La suma no conserva char automáticamente."},{"key":"C","text":"66 66","explain":"El cast convierte 66 al carácter B."},{"key":"D","text":"No compila","explain":"Ambas expresiones son legales."}],"answer":"A","general":"char se promociona a int en la suma: 65+1=66; el cast posterior produce B."},{"id":"J8-004","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Promoción numérica","type":"Codigo","difficulty":"Muy alta","question":"¿Qué resultado tiene el fragmento?","code":"byte a=10,b=20; byte c=a+b; System.out.print(c);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"30","explain":"La asignación sería válida si el resultado se convirtiese a byte explícitamente."},{"key":"B","text":"31","explain":"No se produce ningún resultado de ejecución."},{"key":"C","text":"No compila","explain":"byte+byte se promociona a int, incompatible con byte en una asignación simple."},{"key":"D","text":"Lanza ClassCastException","explain":"Las conversiones de primitivos no generan ClassCastException."}],"answer":"C","general":"byte+byte se promociona a int, incompatible con byte en una asignación simple."},{"id":"J8-005","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Asignación compuesta","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime tras el desbordamiento?","code":"byte b=125; b+=5; System.out.print(b);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"-126","explain":"b += 5 incluye una conversión implícita a byte, y 130 se convierte en -126."},{"key":"B","text":"130","explain":"byte no puede representar 130."},{"key":"C","text":"No compila","explain":"La asignación compuesta compila con conversión implícita."},{"key":"D","text":"ArithmeticException","explain":"El desbordamiento entero no lanza ArithmeticException."}],"answer":"A","general":"b += 5 incluye una conversión implícita a byte, y 130 se convierte en -126."},{"id":"J8-006","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Literales","type":"Teorica","difficulty":"Muy alta","question":"¿Qué declaración es válida en Java 8?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"float a=2.5;","explain":"2.5 es double y no se convierte implícitamente a float."},{"key":"B","text":"int b=0b10_10;","explain":"Un literal binario permite guiones bajos entre dígitos."},{"key":"C","text":"long c=2147483648;","explain":"El literal decimal excede int sin sufijo L."},{"key":"D","text":"int d=1__0_;","explain":"El guion bajo final no está permitido. "}],"answer":"B","general":"Un literal binario permite guiones bajos entre dígitos."},{"id":"J8-007","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Variables locales","type":"Codigo","difficulty":"Muy alta","question":"¿Qué ocurre si la condición es constante verdadera?","code":"int x; boolean flag=true; if(flag) x=7; System.out.print(x);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"Imprime 0","explain":"Una variable local no adquiere un valor 0 por defecto."},{"key":"B","text":"Imprime 7","explain":"El compilador no puede garantizar asignación de x en el if porque flag es variable local no constante."},{"key":"C","text":"No compila","explain":"La variable x puede llegar sin inicializar a println."},{"key":"D","text":"NullPointerException","explain":"No hay referencias nulas."}],"answer":"C","general":"La variable x puede llegar sin inicializar a println."},{"id":"J8-008","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Operadores de incremento","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"int x=2; int y=x++ + ++x; System.out.print(x+\" \"+y);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"4 6","explain":"x++ entrega 2 y lleva x a 3; ++x lleva x a 4 y entrega 4. Total 6, x termina en 4."},{"key":"B","text":"4 5","explain":"El postincremento entrega 2, el preincremento entrega 4; no suman 5."},{"key":"C","text":"5 6","explain":"Solo se incrementa x dos veces desde 2 hasta 4, no 5."},{"key":"D","text":"5 7","explain":"Ni el valor final ni la suma corresponden al orden Java."}],"answer":"A","general":"x++ entrega 2 y lleva x a 3; ++x lleva x a 4 y entrega 4. Total 6, x termina en 4."},{"id":"J8-009","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Cortocircuito","type":"Codigo","difficulty":"Muy alta","question":"¿Cuál es la salida?","code":"int x=0; boolean r=(x==1) | (++x==1); System.out.print(r+\" \"+x);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"false 0","explain":"El operador | siempre evalúa el lado derecho aun si el izquierdo es false."},{"key":"B","text":"false 1","explain":"x==1 es false pero ++x==1 es true; imprime true 1, no esta opción."},{"key":"C","text":"true 0","explain":"x cambia al evaluar la expresión derecha."},{"key":"D","text":"true 1","explain":"Se evalúa ++x, por lo que x=1 y el resultado true."}],"answer":"D","general":"| evalúa ambos lados: ++x da 1 y la comparación es verdadera; resultado true 1."},{"id":"J8-010","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Concatenación","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"System.out.print(1+2+\"3\"+true);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"33true","explain":"1+2 se evalúa antes de concatenar \"3\", luego se concatena true."},{"key":"B","text":"123true","explain":"Los enteros iniciales se suman antes de llegar a String."},{"key":"C","text":"1231","explain":"El boolean se convierte a su representación textual."},{"key":"D","text":"No compila","explain":"String admite concatenación con boolean."}],"answer":"A","general":"1+2 se evalúa antes de concatenar \"3\", luego se concatena true."},{"id":"J8-011","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"switch","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime el switch si n vale 3?","code":"int n=3; switch(n){ default:System.out.print(\"D\"); case 1:System.out.print(\"1\"); case 2:System.out.print(\"2\"); }","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"D2","explain":"default no finaliza automáticamente el switch."},{"key":"B","text":"D","explain":"Tras default sigue ejecutándose el case 1."},{"key":"C","text":"D12","explain":"Al no coincidir case, entra por default e imprime D12 por fall-through."},{"key":"D","text":"12","explain":"No puede saltar al case 1 cuando ninguno coincide y omitir default."}],"answer":"C","general":"Al no coincidir case, entra por default e imprime D12 por fall-through."},{"id":"J8-012","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"switch y tipos","type":"Codigo","difficulty":"Muy alta","question":"¿Cuál es la causa exacta del fallo?","code":"long n=1L; switch(n){case 1:System.out.print(1);}","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"Los case deben llevar break","explain":"break es opcional."},{"key":"B","text":"switch no admite long","explain":"El selector de switch Java 8 no puede ser long."},{"key":"C","text":"El literal 1 exige L","explain":"Cambiar el case no hace válido long."},{"key":"D","text":"No hay default","explain":"default es opcional."}],"answer":"B","general":"El selector de switch Java 8 no puede ser long."},{"id":"J8-013","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Alcance y bucles","type":"Codigo","difficulty":"Muy alta","question":"¿Qué ocurre?","code":"for(int i=0;i\u003c3;i++); System.out.print(i);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"Imprime 3","explain":"La variable i deja de estar en alcance al terminar el for."},{"key":"B","text":"Imprime 2","explain":"Tampoco se puede leer i al final."},{"key":"C","text":"No compila","explain":"i está declarada en la cabecera del for y no existe después."},{"key":"D","text":"Ciclo infinito","explain":"El bucle termina al alcanzar 3."}],"answer":"C","general":"i está declarada en la cabecera del for y no existe después."},{"id":"J8-014","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"continue etiquetado","type":"Codigo","difficulty":"Muy alta","question":"¿Qué salida se obtiene?","code":"outer:for(int i=1;i\u003c=2;i++){for(int j=1;j\u003c=3;j++){if(j==2)continue outer;System.out.print(\"\"+i+j);}}","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"11122122","explain":"continue externo descarta todas las iteraciones restantes del bucle interno."},{"key":"B","text":"112131","explain":"No se alcanzan los j mayores que 1."},{"key":"C","text":"1121","explain":"Para i=1 e i=2 solo se imprime j=1: 1121."},{"key":"D","text":"11122131","explain":"Los j mayores que 1 se omiten al ejecutar continue externo."}],"answer":"C","general":"Para i=1 e i=2 solo se imprime j=1: 1121."},{"id":"J8-015","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"División y restos","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"System.out.print((-7/3)+\" \"+(-7%3));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"-2 -1","explain":"La división entera trunca hacia cero y el resto conserva el signo del dividendo."},{"key":"B","text":"-2 1","explain":"El resto de -7 % 3 es -1, no +1."},{"key":"C","text":"-3 -1","explain":"-7/3 se trunca hacia cero, no hacia menos infinito."},{"key":"D","text":"-3 1","explain":"Ambas partes son incorrectas."}],"answer":"A","general":"La división entera trunca hacia cero y el resto conserva el signo del dividendo."},{"id":"J8-016","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Rangos","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime exactamente?","code":"int n=Integer.MAX_VALUE; System.out.print((n+1)+\" \"+((long)n+1));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"-2147483648 2147483648","explain":"La suma int desborda; el cast a long antes de sumar previene desbordamiento."},{"key":"B","text":"2147483648 2147483648","explain":"El primer operando sigue siendo int."},{"key":"C","text":"ArithmeticException","explain":"El overflow aritmético normal no lanza excepción."},{"key":"D","text":"No compila","explain":"Las dos expresiones son válidas."}],"answer":"A","general":"La suma int desborda; el cast a long antes de sumar previene desbordamiento."},{"id":"J8-017","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"IEEE 754","type":"Codigo","difficulty":"Muy alta","question":"¿Cuál es el resultado?","code":"double n=0.0/0.0; System.out.print((n==n)+\" \"+Double.isNaN(n));","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"true false","explain":"NaN no es igual a sí mismo."},{"key":"B","text":"false true","explain":"Las comparaciones de igualdad con NaN son falsas; isNaN(n) es verdadero."},{"key":"C","text":"true true","explain":"La comparación == para NaN siempre es false."},{"key":"D","text":"false false","explain":"Double.isNaN identifica NaN."}],"answer":"B","general":"Las comparaciones de igualdad con NaN son falsas; isNaN(n) es verdadero."},{"id":"J8-018","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Compilación y ejecución","type":"Teorica","difficulty":"Muy alta","question":"En un proyecto Java 8, Main.java contiene una única clase public Main con public void main(String[] args). ¿Qué ocurre con javac Main.java seguido de java Main?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Falla javac porque main no es static","explain":"Un método de instancia llamado main es legal sintácticamente."},{"key":"B","text":"javac compila, pero java Main no encuentra un main válido","explain":"La JVM exige main static public void como punto de entrada del lanzador."},{"key":"C","text":"Compila y ejecuta","explain":"El método de instancia no sirve de entrada."},{"key":"D","text":"java Main invoca el constructor por defecto","explain":"El lanzador no ejecuta el constructor para buscar un main. "}],"answer":"B","general":"La JVM exige main static public void como punto de entrada del lanzador."},{"id":"J8-019","scope":"1Z0-808","area":"Plataforma, tipos y control de flujo","subtopic":"Operador ternario","type":"Codigo","difficulty":"Muy alta","question":"¿Qué tipo y valor tiene la expresión?","code":"int x=2; int y=x\u003e0?1:2; System.out.print(y);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"byte con valor 1","explain":"El resultado del ternario en este contexto se asigna a int."},{"key":"B","text":"int con valor 1","explain":"El tipo asignado es int y el resultado es 1."},{"key":"C","text":"No compila","explain":"Ambos operandos son compatibles."},{"key":"D","text":"int con valor 2","explain":"La condición true escoge 1."}],"answer":"B","general":"El tipo asignado es int y el resultado es 1."},{"id": ecuado."},{"key":"C","text":"Accederlo por una nueva Base()","explain":"new Base() no sirve como receptor protegido en la subclase externa."},{"key":"D","text":"Todos los accesos anteriores","explain":"Las restricciones hacen falsa la opción de todos. "}],"answer":"B","general":"El acceso se autoriza en el contexto de herencia con receptor adecuado."},{"id":"J8-030","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Cast de referencia","type":"Codigo","difficulty":"Muy alta","question":"¿Qué pasa al ejecutarse?","code":"class Padre{} class Hija extends Padre{} Padre p=new Padre(); Hija h=(Hija)p;","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"ClassCastException","explain":"El cast es permitido por relación de herencia, pero el objeto no es una instancia de Hija."},{"key":"B","text":"No compila","explain":"El cast sí es legal estáticamente."},{"key":"C","text":"Imprime true","explain":"No existe impresión alguna."},{"key":"D","text":"NullPointerException","explain":"El objeto no es null."}],"answer":"A","general":"El cast es permitido por relación de herencia, pero el objeto no es una instancia de Hija."},{"id":"J8-031","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Covarianza","type":"Teorica","difficulty":"Muy alta","question":"¿Cuál override es válido sobre Object crear() de una superclase?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"String crear() con visibilidad igual o mayor","explain":"String es subtipo de Object y permite retorno covariante."},{"key":"B","text":"void crear()","explain":"void no es covariante con Object."},{"key":"C","text":"Object crear(int x) y @Override","explain":"Cambiar parámetros es sobrecarga, no override."},{"key":"D","text":"private Object crear() sobre método public","explain":"No puede reducirse la visibilidad. "}],"answer":"A","general":"String es subtipo de Object y permite retorno covariante."},{"id":"J8-032","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Interfaces Java 8","type":"Teorica","difficulty":"Muy alta","question":"Una clase implementa interfaces X e Y con default void m(). ¿Qué se exige?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"No se exige nada: se usa X.m","explain":"Hay conflicto entre dos defaults independientes."},{"key":"B","text":"Debe sobrescribir m y resolver el conflicto","explain":"La clase debe aportar una implementación que desambigüe."},{"key":"C","text":"La JVM elige por orden alfabético","explain":"No existe criterio alfabético."},{"key":"D","text":"Solo se permite implementar una de ellas","explain":"Java permite implementar varias interfaces. "}],"answer":"B","general":"La clase debe aportar una implementación que desambigüe."},{"id":"J8-033","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Interfaz static","type":"Teorica","difficulty":"Muy alta","question":"¿Cuál invocación es correcta para static void test() declarada en interface I?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"new Implementa().test()","explain":"Los métodos static de interfaces no se heredan en instancias."},{"key":"B","text":"Implementa.test()","explain":"Una clase implementadora no hereda ese static."},{"key":"C","text":"I.test()","explain":"Se invoca con el nombre de la interfaz que lo declara."},{"key":"D","text":"super.test()","explain":"super no sirve para este static de interfaz. "}],"answer":"C","general":"Se invoca con el nombre de la interfaz que lo declara."},{"id":"J8-034","scope":"1Z0-808","area":"Programación orientada a objetos","subtopic":"Enum","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"enum N { UNO,DOS,TRES }\npublic class Main { public static void main(String[] args) {\n System.out.print(N.values()[1]+\" \"+N.DOS.ordinal());\n} }","codeContext":"Archivo Main.java completo","options":[{"key":"A","text":"UNO 0","explain":"values()[1] es "code":"","codeContext":"No aplica","options":[{"key":"A","text":"Se invoca una vez por cada elemento original","explain":"Un terminal de cortocircuito puede detener la evaluación pronto."},{"key":"B","text":"Se invoca solo sobre los elementos que atraviesan el pipeline conforme al consumo, sin garantizar todos","explain":"peek es intermedia y se ejecuta cuando se consumen elementos, pudiendo no visitar todos."},{"key":"C","text":"Se ejecuta al construirse el stream","explain":"Las operaciones intermedias son perezosas."},{"key":"D","text":"Es equivalente a forEach terminal","explain":"forEach es terminal; peek no lo es. "}],"answer":"B","general":"peek es intermedia y se ejecuta cuando se consumen elementos, pudiendo no visitar todos."},{"id":"J8-085","scope":"1Z0-809","area":"Streams y reducción","subtopic":"Map vs flatMap","type":"Teorica","difficulty":"Muy alta","question":"Si una función de mapeo devuelve Stream\u003cString\u003e, ¿qué diferencia hay entre map y flatMap?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"map aplana automáticamente","explain":"map conserva un flujo anidado si la función devuelve Stream."},{"key":"B","text":"flatMap conserva Stream\u003cStream\u003cString\u003e\u003e","explain":"flatMap precisamente aplana los flujos devueltos."},{"key":"C","text":"map puede generar Stream\u003cStream\u003cString\u003e\u003e y flatMap Stream\u003cString\u003e","explain":"Esa es la distinción en tipos resultantes."},{"key":"D","text":"Ambos devuelven siempre List\u003cString\u003e","explain":"Ambos devuelven Stream, no List. "}],"answer":"C","general":"Esa es la distinción en tipos resultantes."},{"id":"J8-086","scope":"1Z0-809","area":"Streams y reducción","subtopic":"max Comparator","type":"Teorica","difficulty":"Muy alta","question":"¿Qué devuelve Stream.of(\"aa\",\"b\").max(Comparator.comparingInt(String::length))?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Optional[aa]","explain":"aa tiene longitud 2, mayor que b."},{"key":"B","text":"Optional[b]","explain":"b tiene longitud 1."},{"key":"C","text":"aa","explain":"max devuelve Optional\u003cT\u003e, no T directo."},{"key":"D","text":"No compila","explain":"El comparador es válido. "}],"answer":"A","general":"aa tiene longitud 2, mayor que b."},{"id":"J8-087","scope":"1Z0-809","area":"Streams y reducción","subtopic":"Streams terminales","type":"Teorica","difficulty":"Muy alta","question":"¿Qué combinación contiene únicamente operaciones terminales?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"filter, map, sorted","explain":"Las tres de esa opción son intermedias."},{"key":"B","text":"count, collect, forEach","explain":"count, collect y forEach consumen el stream."},{"key":"C","text":"distinct, limit, peek","explain":"Las tres son intermedias."},{"key":"D","text":"map, reduce, findAny","explain":"map es intermedia aunque reduce y findAny sean terminales. "}],"answer":"B","general":"count, collect y forEach consumen el stream."},{"id":"J8-088","scope":"1Z0-809","area":"Streams y reducción","subtopic":"forEach vs forEachOrdered","type":"Teorica","difficulty":"Muy alta","question":"¿Qué garantiza forEachOrdered en un stream paralelo con orden de encuentro?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Orden numérico ascendente siempre","explain":"El orden numérico solo coincide si así está ordenada la fuente."},{"key":"B","text":"Orden de encuentro de la fuente","explain":"Mantiene el orden de encuentro, aunque sea paralelo."},{"key":"C","text":"Uso de un solo hilo necesariamente","explain":"No exige necesariamente una sola hebra en toda la ejecución."},{"key":"D","text":"Que findAny devuelva el primero","explain":"No modifica el comportamiento de findAny. "}],"answer":"B","general":"Mantiene el orden de encuentro, aunque sea paralelo."},{"id":"J8-089","scope":"1Z0-809","area":"Streams y reducción","subtopic":"Optional de streams","type":"Teorica","difficulty":"Muy alta","quest ,"answer":"A","general":"Se eliminan elementos pares 2 y 4."},{"id":"J8-136","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"replaceAll","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"java.util.List\u003cInteger\u003e a=new java.util.ArrayList\u003c\u003e(java.util.Arrays.asList(1,2));a.replaceAll(x-\u003ex*2);System.out.print(a);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"[2, 4]","explain":"Se aplica el operador a cada elemento y muta la lista."},{"key":"B","text":"[1, 2]","explain":"replaceAll cambia los valores."},{"key":"C","text":"[3, 6]","explain":"No suma 2 a cada valor."},{"key":"D","text":"No compila","explain":"List.replaceAll está disponible en Java 8."}],"answer":"A","general":"Se aplica el operador a cada elemento y muta la lista."},{"id":"J8-137","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Arrays multimensionales","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"int[][] a={{1},{2,3,4}};System.out.print(a.length+\" \"+a[1].length);","codeContext":"Fragmento dentro de main; imports necesarios","options":[{"key":"A","text":"2 3","explain":"El arreglo externo tiene dos filas y la segunda fila contiene tres elementos."},{"key":"B","text":"2 2","explain":"La segunda dimensión puede variar por fila."},{"key":"C","text":"3 2","explain":"El número de filas es dos."},{"key":"D","text":"No compila","explain":"Los arreglos irregulares son legales."}],"answer":"A","general":"El arreglo externo tiene dos filas y la segunda fila contiene tres elementos."},{"id":"J8-138","scope":"1Z0-808/809","area":"Arrays, colecciones y genéricos","subtopic":"Iterator fail-fast","type":"Teorica","difficulty":"Muy alta","question":"¿Qué es lo más característico de modificar ArrayList estructuralmente con list.remove mientras un Iterator la recorre?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Siempre es seguro","explain":"La modificación fuera del iterador no es la forma permitida para estructuras fail-fast."},{"key":"B","text":"Puede provocar ConcurrentModificationException","explain":"Puede detectarse modificación concurrente y lanzar excepción; no es garantía absoluta."},{"key":"C","text":"Hace copia profunda","explain":"No se crea una copia."},{"key":"D","text":"Genera error de compilación","explain":"El código puede compilar. "}],"answer":"B","general":"Puede detectarse modificación concurrente y lanzar excepción; no es garantía absoluta."},{"id":"J8-139","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"Checked exceptions","type":"Teorica","difficulty":"Muy alta","question":"¿Qué afirmación describe correctamente IOException?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Es unchecked y no requiere manejo","explain":"IOException hereda de Exception pero no de RuntimeException."},{"key":"B","text":"Es checked y debe manejarse o declararse, salvo excepciones al control del flujo del compilador","explain":"El compilador exige captura o declaración en los puntos alcanzables donde puede generarse."},{"key":"C","text":"Es subtipo directo de Error","explain":"No hereda de Error."},{"key":"D","text":"Solo aparece en programación concurrente","explain":"Es habitual en entrada y salida de datos. "}],"answer":"B","general":"El compilador exige captura o declaración en los puntos alcanzables donde puede generarse."},{"id":"J8-140","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"catch orden","type":"Teorica","difficulty":"Muy alta","question":"¿Qué ocurre si catch(Exception e) precede a catch(IOException e) en el mismo try?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"La excepción IO se maneja en el segundo","explain":"El primer catch ya captura todas las IOException."},{"key":"B","text":"No compila: IOException catch inalcanzable","explain":"El segundo handler se considera inalcanzable."},{"key":"C","text":"Ambos bloques se ejecutan","explain":"Solo ejecutaría un catch."},{"key":"D","text":"Java elige el catch más específico automáticamente","explain":"El orden de los catch importa en el compilador. "}],"answer":"B","general":"El segundo handler se considera inalcanzable."},{"id":"J8-141","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"finally y return","type":"Codigo","difficulty":"Muy alta","question":"¿Qué imprime?","code":"class X { static int f() { try { return 1; } finally { return 2; } } }\npublic class Main { public static void main(String[] args) { System.out.print(X.f()); } }","codeContext":"Archivo Main.java completo","options":[{"key":"A","text":"1","explain":"Aunque el try retorna 1, el finally ejecuta return 2 y reemplaza el resultado."},{"key":"B","text":"2","explain":"El return de finally prevalece."},{"key":"C","text":"12","explain":"El método solo devuelve un int, no concatena."},{"key":"D","text":"No compila","explain":"Java permite return en finally, aunque no se recomienda."}],"answer":"B","general":"El return de finally prevalece."},{"id":"J8-142","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"finally excepción","type":"Teorica","difficulty":"Muy alta","question":"Si try lanza una excepción A y finally lanza una excepción B sin try-with-resources, ¿qué se propaga normalmente?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"La A","explain":"La excepción del finally reemplaza la pendiente de try en este patrón clásico."},{"key":"B","text":"La B","explain":"B es la que termina propagándose."},{"key":"C","text":"Ambas como suppressed automáticamente","explain":"La supresión automática aparece principalmente en try-with-resources."},{"key":"D","text":"Ninguna","explain":"No se descartan ambas. "}],"answer":"B","general":"B es la que termina propagándose."},{"id":"J8-143","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"Multi-catch","type":"Teorica","difficulty":"Muy alta","question":"¿Qué declaración multi-catch es ilegal?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"catch(IOException | SQLException e)","explain":"IOException y SQLException son hermanas de Exception."},{"key":"B","text":"catch(FileNotFoundException | IOException e)","explain":"FileNotFoundException es subtipo de IOException, alternativas relacionadas por herencia no se permiten."},{"key":"C","text":"catch(InterruptedException | IOException e)","explain":"Son checked independientes."},{"key":"D","text":"catch(NumberFormatException | NullPointerException e)","explain":"Ambas son unchecked hermanas. "}],"answer":"B","general":"FileNotFoundException es subtipo de IOException, alternativas relacionadas por herencia no se permiten."},{"id":"J8-144","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"Try-with-resources cierre","type":"Teorica","difficulty":"Muy alta","question":"¿En qué orden se cierran recursos declarados como try(R a=...;R b=...)?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"a y luego b","explain":"La pila de recursos se libera en orden inverso a su declaración."},{"key":"B","text":"b y luego a","explain":"Primero se cierra b, luego a."},{"key":"C","text":"Orden aleatorio","explain":"El orden está definido."},{"key":"D","text":"No se cierran si hubo excepción","explain":"Se intentan cerrar incluso si hubo excepción. "}],"answer":"B","general":"Primero se cierra b, luego a."},{"id":"J8-145","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"Suppressed","type":"Teorica","difficulty":"Muy alta","question":"Con try-with-resources, si el cuerpo arroja IOException A y close() arroja IOException B, ¿qué sucede?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"B reemplaza siempre a A","explain":"TWR conserva la excepción primaria del cuerpo."},{"key":"B","text":"A es principal y B aparece en getSuppressed()","explain":"B queda registrada como suprimida de A."},{"key":"C","text":"Ambos se pierden","explain":"La principal no se pierde."},{"key":"D","text":"El compilador rechaza el código","explain":"Es un comportamiento contemplado en Java 8. "}],"answer":"B","general":"B queda registrada como suprimida de A."},{"id":"J8-146","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"AutoCloseable","type":"Teorica","difficulty":"Muy alta","question":"¿Qué método debe proporcionar un recurso AutoCloseable?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"void dispose()","explain":"AutoCloseable define close, no dispose."},{"key":"B","text":"void close() throws Exception (puede declarar excepción más estrecha)","explain":"close() tiene retorno void y puede declarar Exception."},{"key":"C","text":"boolean close()","explain":"Un retorno boolean no coincide."},{"key":"D","text":"void finalize()","explain":"finalize no implementa AutoCloseable. "}],"answer":"B","general":"close() tiene retorno void y puede declarar Exception."},{"id":"J8-147","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"throw y throws","type":"Teorica","difficulty":"Muy alta","question":"¿Qué distinción es exacta?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"throw declara contrato, throws lanza objeto","explain":"Las funciones de ambas palabras están invertidas ahí."},{"key":"B","text":"throw lanza una instancia, throws declara posibles excepciones en firma","explain":"throw inicia lanzamiento; throws lista tipos de excepción declarados."},{"key":"C","text":"Ambos son sinónimos","explain":"No son sinónimos."},{"key":"D","text":"throws solo permite unchecked","explain":"throws puede mencionar checked o unchecked. "}],"answer":"B","general":"throw inicia lanzamiento; throws lista tipos de excepción declarados."},{"id":"J8-148","scope":"1Z0-808/809","area":"Excepciones y recursos","subtopic":"Override checked","type":"Teorica","difficulty":"Muy alta","question":"Una subclase sobrescribe public void f() throw ","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Se confirman","explain":"commit confirma, rollback deshace."},{"key":"B","text":"Se revierten cambios no confirmados de la transacción","explain":"Se revierten cambios de la transacción activa que no se hayan confirmado."},{"key":"C","text":"Se ejecuta una consulta SELECT","explain":"rollback no es una consulta SQL de lectura."},{"key":"D","text":"Se vuelve a habilitar autoCommit automáticamente siempre","explain":"El modo de autocommit no tiene por qué cambiar por llamar rollback. "}],"answer":"B","general":"Se revierten cambios de la transacción activa que no se hayan confirmado."},{"id":"J8-201","scope":"1Z0-809","area":"Acceso a bases de datos con JDBC","subtopic":"Auto-commit","type":"Teorica","difficulty":"Muy alta","question":"¿Qué modo tiene una nueva Connection JDBC por defecto según contrato?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"autoCommit es true","explain":"Las conexiones se crean usualmente con autoCommit habilitado por contrato JDBC."},{"key":"B","text":"autoCommit es false","explain":"false requiere normalmente configurarlo explícitamente."},{"key":"C","text":"Se requiere siempre setAutoCommit antes de cualquier query","explain":"Se pueden ejecutar consultas sin configurarlo."},{"key":"D","text":"Se inicia siempre una transacción distribuida","explain":"No implica una transacción distribuida. "}],"answer":"A","general":"Las conexiones se crean usualmente con autoCommit habilitado por contrato JDBC."},{"id":"J8-202","scope":"1Z0-809","area":"Acceso a bases de datos con JDBC","subtopic":"JDBC cierre","type":"Teorica","difficulty":"Muy alta","question":"¿Por qué usar try-with-resources con Connection, PreparedStatement y ResultSet?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Evita necesidad de driver","explain":"Se sigue necesitando driver compatible."},{"key":"B","text":"Cierra recursos automáticamente en orden inverso aun con excepci Se fijan los parámetros y se agrega cada juego al batch antes de ejecutarlo."},{"id":"J8-205","scope":"1Z0-809","area":"Acceso a bases de datos con JDBC","subtopic":"DriverManager","type":"Teorica","difficulty":"Muy alta","question":"Si DriverManager.getConnection(\"jdbc:desconocido:...\") no encuentra driver adecuado, ¿qué sucede?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Devuelve null","explain":"No es un mecanismo de retorno null para ese fallo."},{"key":"B","text":"SQLException (por ejemplo no suitable driver)","explain":"La API señala error mediante SQLException."},{"key":"C","text":"ClassCastException","explain":"No hay conversión de tipos Java incompatibles."},{"key":"D","text":"Crea un driver de Java puro automáticamente","explain":"No se fabrica driver genérico para URLs desconocidas. "}],"answer":"B","general":"La API señala error mediante SQLException."},{"id":"J8-206","scope":"Complementario","area":"SQL y lógica","subtopic":"Agregación","type":"Teorica","difficulty":"Muy alta","question":"Si una tabla tiene valores [10,NULL,30] en columna monto, ¿qué devuelve COUNT(*) y COUNT(monto)?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"2 y 2","explain":"COUNT(*) incluye filas con NULL."},{"key":"B","text":"3 y 2","explain":"Hay 3 filas y 2 valores no nulos de monto."},{"key":"C","text":"3 y 3","explain":"COUNT(monto) ignora NULL."},{"key":"D","text":"NULL y 2","explain":"COUNT retorna enteros de conteo, no null por filas nulas. "}],"answer":"B","general":"Hay 3 filas y 2 valores no nulos de monto."},{"id":"J8-207","scope":"Complementario","area":"SQL y lógica","subtopic":"AVG y NULL","type":"Teorica","difficulty":"Muy alta","question":"¿Cuál AVG(monto) se obtiene con [10,NULL,30]?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"13.333...","explain":"AVG ignora NULL, no lo trata como cero."},{"key":"B","text":"20","explain":"(10+30)/2=20."},{"key":"C","text":"40","explain":"SUM sería 40, AVG no."},{"key":"D","text":"NULL","explain":"Hay dos valores no nulos. "}],"answer":"B","general":"(10+30)/2=20."},{"id":"J8-208","scope":"Complementario","area":"SQL y lógica","subtopic":"HAVING","type":"Teorica","difficulty":"Muy alta","question":"¿Qué consulta permite seleccionar departamentos con más de 5 empleados?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"SELECT depto FROM empleado WHERE COUNT(*)\u003e5 GROUP BY depto","explain":"WHERE no acepta agregaciones calculadas de esa forma."},{"key":"B","text":"SELECT depto FROM empleado GROUP BY depto HAVING COUNT(*)\u003e5","explain":"HAVING filtra los grupos luego de GROUP BY."},{"key":"C","text":"SELECT depto,COUNT(*) FROM empleado HAVING depto\u003e5","explain":"Falta agrupación para expresión de ese SELECT y no se aplica el criterio correcto."},{"key":"D","text":"SELECT depto FROM empleado ORDER BY COUNT(*)\u003e5","explain":"ORDER BY no filtra grupos. "}],"answer":"B","general":"HAVING filtra los grupos luego de GROUP BY."},{"id":"J8-209","scope":"Complementario","area":"SQL y lógica","subtopic":"JOIN","type":"Teorica","difficulty":"Muy alta","question":"Con A ids {1,2}, B ids {2,3}, ¿qué ids de A devuelve A LEFT JOIN B cuando se selecciona A.id?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Solo 2","explain":"LEFT JOIN conserva filas sin coincidencia del lado izquierdo."},{"key":"B","text":"1 y 2","explain":"A aporta tanto 1 como 2, aunque 1 tenga columnas B en NULL."},{"key":"C","text":"2 y 3","explain":"3 solo está en B."},{"key":"D","text":"1,2 y 3","explain":"La fila de 3 de B no se incorpora al LEFT JOIN de A como principal. "}],"answer":"B","general":"A aporta tanto 1 como 2, aunque 1 tenga columnas B en NULL."},{"id":"J8-210","scope":"Complementario","area":"SQL y lógica","subtopic":"UNION","type":"Teorica","difficulty":"Muy alta","question":"¿Qué diferencia principal hay entre UNION y UNION ALL?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"UNION ALL elimina duplicados","explain":"UNION ALL conserva ocurrencias duplicadas."},{"key":"B","text":"UNION elimina duplicados; UNION ALL conserva duplicados","explain":"UNION aplica semántica de conjunto y elimina filas repetidas."},{"key":"C","text":"Ambos siempre ordenan ascendente","explain":"El orden final requiere ORDER BY explícito."},{"key":"D","text":"UNION solo funciona con tres tablas","explain":"Ambos admiten dos conjuntos de resultados compatibles. "}],"answer":"B","general":"UNION aplica semántica de conjunto y elimina filas repetidas."},{"id":"J8-211","scope":"Complementario","area":"SQL y lógica","subtopic":"NULL 3 valores","type":"Teorica","difficulty":"Muy alta","question":"¿Qué resultado lógico tiene NULL = NULL en SQL estándar?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"TRUE","explain":"La igualdad con NULL no es true."},{"key":"B","text":"FALSE","explain":"Tampoco se evalúa como false en lógica ternaria estándar."},{"key":"C","text":"UNKNOWN","explain":"Produce UNKNOWN, que filtra en WHERE."},{"key":"D","text":"Error de sintaxis","explain":"La expresión es sintácticamente válida. "}],"answer":"C","general":"Produce UNKNOWN, que filtra en WHERE."},{"id":"J8-212","scope":"Complementario","area":"SQL y lógica","subtopic":"NOT IN y NULL","type":"Teorica","difficulty":"Muy alta","question":"¿Por qué NOT IN (1,NULL) puede no seleccionar filas esperadas?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Porque NULL equivale a 0","explain":"NULL no equivale a cero."},{"key":"B","text":"Porque la comparación con NULL genera UNKNOWN","explain":"La negación de una disyunción con UNKNOWN puede resultar UNKNOWN."},{"key":"C","text":"Porque IN ordena datos","explain":"IN no ordena."},{"key":"D","text":"Porque NOT IN ignora NULL automáticamente","explain":"No se ignora necesariamente NULL. "}],"answer":"B","general":"La negación de una disyunción con UNKNOWN puede resultar UNKNOWN."},{"id":"J8-213","scope":"Complementario","area":"SQL y lógica","subtopic":"LIKE","type":"Teorica","difficulty":"Muy alta","question":"¿Qué patrón LIKE coincide con cadenas cuyo segundo carácter es a?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"'a%'","explain":"a% exige a como primer carácter."},{"key":"B","text":"'_a%'","explain":"_ representa exactamente un carácter y a queda en segunda posición."},{"key":"C","text":"'%a'","explain":"%a exige terminar con a."},{"key":"D","text":"'a_'","explain":"a_ exige empezar con a y tener longitud dos. "}],"answer":"B","general":"_ representa exactamente un carácter y a queda en segunda posición."},{"id":"J8-214","scope":"Complementario","area":"SQL y lógica","subtopic":"Transacciones SQL","type":"Teorica","difficulty":"Muy alta","question":"Sin autocommit, ¿qué hace un ROLLBACK tras INSERT no confirmado?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Conserva la fila","explain":"La inserción aún no se ha confirmado."},{"key":"B","text":"Deshace el INSERT no confirmado","explain":"ROLLBACK descarta los cambios de la transacción."},{"key":"C","text":"Duplica la fila","explain":"No duplica operaciones."},{"key":"D","text":"Convierte INSERT en UPDATE","explain":"No transforma tipos de sentencias SQL. "}],"answer":"B","general":"ROLLBACK descarta los cambios de la transacción."},{"id":"J8-215","scope":"Complementario","area":"SQL y lógica","subtopic":"Prioridad booleana","type":"Teorica","difficulty":"Muy alta","question":"En SQL estándar, ¿cómo se agrupa A OR B AND C sin paréntesis?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"(A OR B) AND C","explain":"AND tiene mayor precedencia que OR."},{"key":"B","text":"A OR (B AND C)","explain":"Se evalúa conceptualmente B AND C primero."},{"key":"C","text":"(A AND B) OR C","explain":"Esa agrupación no respeta la precedencia."},{"key":"D","text":"NOT(A OR B OR C)","explain":"No aparece NOT en la expresión. "}],"answer":"B","general":"Se evalúa conceptualmente B AND C primero."},{"id":"J8-216","scope":"Complementario","area":"SQL y lógica","subtopic":"De Morgan","type":"Teorica","difficulty":"Muy alta","question":"¿Cuál expresión es equivalente a NOT (A AND B) en lógica booleana clásica?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"NOT A AND NOT B","explain":"Eso corresponde a NOT(A OR B)."},{"key":"B","text":"NOT A OR NOT B","explain":"Por De Morgan la negación de conjunción es disyunción de negaciones."},{"key":"C","text":"A OR B","explain":"No se niega ninguno de los predicados."},{"key":"D","text":"NOT A AND B","explain":"Solo se niega A en la última alternativa. "}],"answer":"B","general":"Por De Morgan la negación de conjunción es disyunción de negaciones."},{"id":"J8-217","scope":"Complementario","area":"SQL y lógica","subtopic":"Implicación","type":"Teorica","difficulty":"Muy alta","question":"¿Qué expresión es lógicamente equivalente a A -\u003e B?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"A AND B","explain":"A AND B no es verdadera cuando A es false."},{"key":"B","text":"NOT A OR B","explain":"La implicación solo es falsa cuando A true y B false."},{"key":"C","text":"A OR NOT B","explain":"A OR NOT B no expresa esa condición de falsedad."},{"key":"D","text":"NOT(A OR B)","explain":"NOT(A OR B) es más restrictiva. "}],"answer":"B","general":"La implicación solo es falsa cuando A true y B false."},{"id":"J8-218","scope":"Complementario","area":"SQL y lógica","subtopic":"DELETE vs TRUNCATE","type":"Teorica","difficulty":"Muy alta","question":"¿Qué afirmación genérica es correcta sin asumir un SGBD específico?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"DELETE permite WHERE; el soporte y las características transaccionales de TRUNCATE dependen del motor","explain":"DELETE tiene forma con WHERE; TRUNCATE es DDL/operación de vaciado con reglas específicas del motor."},{"key":"B","text":"TRUNCATE siempre puede revertirse en cualquier motor","explain":"La reversibilidad no es universal."},{"key":"C","text":"DELETE nunca escribe logs","explain":"DELETE puede generar registros de log."},{"key":"D","text":"TRUNCATE siempre permite WHERE","explain":"No existe WHERE estándar para TRUNCATE. "}],"answer":"A","general":"DELETE tiene forma con WHERE; TRUNCATE es DDL/operación de vaciado con reglas específicas del motor."},{"id":"J8-219","scope":"Complementario","area":"SQL y lógica","subtopic":"Subconsulta escalar","type":"Teorica","difficulty":"Muy alta","question":"¿Qué exige conceptualmente una subconsulta escalar SQL en contexto de un solo valor?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Retornar exactamente una tabla de muchas filas","explain":"Un contexto escalar no acepta un conjunto multirregistro como valor."},{"key":"B","text":"Retornar como máximo una fila y una columna","explain":"Una subconsulta escalar retorna un valor o NULL si no hay fila, según reglas SQL aplicables."},{"key":"C","text":"Retornar al menos diez filas","explain":"No existe mínimo de diez."},{"key":"D","text":"Retornar dos columnas obligatoriamente","explain":"Una columna es la forma escalar. "}],"answer":"B","general":"Una subconsulta escalar retorna un valor o NULL si no hay fila, según reglas SQL aplicables."},{"id":"J8-220","scope":"Complementario","area":"SQL y lógica","subtopic":"JOIN y ON","type":"Teorica","difficulty":"Muy alta","question":"Con LEFT JOIN, ¿qué cambia al mover una condición sobre tabla derecha de ON a WHERE?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Nunca cambia los resultados","explain":"La condición en WHERE puede rechazar las filas extendidas con NULL."},{"key":"B","text":"Puede eliminar filas sin coincidencia al filtrar sus valores NULL","explain":"Es un error frecuente que altera el efecto del outer join."},{"key":"C","text":"Convierte la consulta en UNION","explain":"No implica UNION."},{"key":"D","text":"Garantiza que aumente el número de filas","explain":"Normalm i=4","explain":"No suma el 4 porque la condición ya es falsa. "}],"answer":"B","general":"Suma 1+2+3=6 y el incremento final deja i=4."},{"id":"J8-224","scope":"Complementario","area":"Diagramas de flujo","subtopic":"Ciclo infinito","type":"Teorica","difficulty":"Muy alta","question":"En un diagrama con i=0, condición i\u003c10 y cuerpo imprimir(i), sin actualizar i, ¿qué ocurre?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Se imprime 0 una vez","explain":"La condición sigue siendo verdadera al no cambiar i."},{"key":"B","text":"Se imprime 0 indefinidamente","explain":"El bucle no progresa y repite imprimir 0."},{"key":"C","text":"Se imprimen 0 a 9","explain":"No existe incremento que produzca 1..9."},{"key":"D","text":"Se lanza excepción automática","explain":"No es obligatorio que el entorno lance una excepción. "}],"answer":"B","general":"El bucle no progresa y repite imprimir 0."},{"id":"J8-225","scope":"Complementario","area":"Diagramas de flujo","subtopic":"Pruebas de decisión","type":"Teorica","difficulty":"Muy alta","question":"Para detectar un error AND vs OR en condición a\u003e5 \u0026\u0026 b\u003e5, ¿qué par es especialmente útil?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"(6,6)","explain":"En (6,6) ambas expresiones son true."},{"key":"B","text":"(6,5)","explain":"(6,5) hace true OR, pero false AND."},{"key":"C","text":"(5,5)","explain":"En (5,5) ambas son false."},{"key":"D","text":"(1,1)","explain":"En (1,1) ambas son false. "}],"answer":"B","general":"(6,5) hace true OR, pero false AND."},{"id":"J8-226","scope":"Complementario","area":"Tipos de pruebas de software","subtopic":"Prueba unitaria","type":"Teorica","difficulty":"Muy alta","question":"¿Qué escenario es una prueba unitaria más que de integración?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Verificar servicio + BD real","explain":"La primera integra varios componentes."},{"key":"B","text":"Verificar calcularTotal con depen ario","area":"Tipos de pruebas de software","subtopic":"Aceptación","type":"Teorica","difficulty":"Muy alta","question":"¿Quién y qué se verifica típicamente en pruebas de aceptación?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"El compilador verifica sintaxis","explain":"El compilador comprueba legalidad del código."},{"key":"B","text":"Stakeholder comprueba que se cumplan criterios de negocio pactados","explain":"Se evalúa adecuación a expectativas/criterios del usuario o negocio."},{"key":"C","text":"El recolector de basura verifica fugas","explain":"GC no es el actor de la prueba de aceptación."},{"key":"D","text":"El IDE ordena imports","explain":"Ordenar imports no verifica requisitos. "}],"answer":"B","general":"Se evalúa adecuación a expectativas/criterios del usuario o negocio."},{"id":"J8-230","scope":"Complementario","area":"Tipos de pruebas de software","subtopic":"Regresión","type":"Teorica","difficulty":"Muy alta","question":"Tras corregir un bug de descuentos, se ejecutan pruebas previas de impuestos y envíos. ¿Qué se intenta detectar?","code":"","codeContext":"No aplica","options":[{"key":"A","text":"Efectos secundarios que rompieron funcionalidades anteriores","explain":"La regresión busca fallos introducidos en comportamientos previamente correctos."},{"key":"B","text":"Solo errores de sintaxis","explain":"El compilador ya detecta sintaxis."},{"key":"C","text":"Exclusivamente velocidad de red","explain":"El objetivo no es solo rendimiento de red."},{"key":"D","text":"Satisfacción subjetiva de UI","explain":"No consiste solo en encuesta UI. "}],"answer":"A","general":"La regresión busca fallos introducidos en comportamientos previamente correctos."},{"id":"J8-231","scope":"Complementario","area":"Tipos de pruebas de software","subtopic":"Prueba funcional","type":"Teorica","difficulty":"Muy alta","question":"Una prueba comprueba que total de 100 con descuento de 10% resulte en 90. ¿Qué aspecto clasifica principalmente?","code":"
